const parsePrice = (v) => {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return v;
  
  let s = String(v).trim().replace(/\s/g, '');
  
  // Se tiver vírgula, assume que ela é o separador decimal (Padrão BR)
  if (s.includes(',')) {
    // Remove pontos de milhar (ex: 1.234,56 -> 1234,56)
    s = s.replace(/\./g, '');
    // Troca a vírgula decimal por ponto para o parseFloat (ex: 1234,56 -> 1234.56)
    return parseFloat(s.replace(',', '.')) || 0;
  }
  
  // Se NÃO tiver vírgula, mas tiver ponto
  if (s.includes('.')) {
    const parts = s.split('.');
    // Se tiver exatamente 3 dígitos após o ponto, provavelmente é milhar (ex: 1.590)
    // No contexto de peças, 1.590 reais é mais comum que 1 real e 59 centavos com 3 casas.
    if (parts.length === 2 && parts[1].length === 3) {
      return parseFloat(s.replace('.', '')) || 0;
    }
    // Caso contrário, assume que o ponto é decimal (ex: 92.27)
    return parseFloat(s) || 0;
  }
  
  return parseFloat(s) || 0;
};

function stripUndefined(obj){
  if(Array.isArray(obj))return obj.map(stripUndefined);

function getPecasParaOS(os, requests){
  if(!os)return[];
  const matching=requests.filter(r=>String(r.os).trim()===String(os).trim());
  const all=[];const seen=new Set();
  matching.forEach(r=>(r.items||[]).forEach(it=>{
    const k=it.id||it.description;
    if(!seen.has(k)){seen.add(k);all.push({...it,_responsavel:r.responsavel,_timestamp:r.timestamp});}
  }));
  return all;
}

function mergeByOS(requests){
  const map={};const order=[];
  requests.forEach(r=>{
    const k=String(r.os||'').trim();if(!k){order.push(r);return;}
    // Adiciona o solicitante e data original em cada item antes de mesclar
    const itemsWithMeta = (r.items||[]).map(it => ({
      ...it,
      _responsavel: r.responsavel,
      _timestamp: r.timestamp,
      _reqId: r.id
    }));

    if(!map[k]){
      map[k]={...r, items: itemsWithMeta, _merged:false};
      order.push(map[k]);
    } else {
      const existing=map[k];
      const allItems=[...(existing.items||[]), ...itemsWithMeta];
      const seen=new Set();
      const deduped=allItems.filter(it=>{
        const key=it.id||it.description;
        if(seen.has(key))return false;
        seen.add(key);
        return true;
      });
      existing.items=deduped;
      existing._merged=true;
      if((r.timestamp||0)>(existing.timestamp||0)){
        existing.vehicleData=r.vehicleData||existing.vehicleData;
        existing.responsavel=r.responsavel||existing.responsavel;
      }
    }
  });
  return order;
}

// ── Donut ─────────────────────────────────────────────────────────────────
function Donut({slices,size=100}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current)return;
    const ctx=ref.current.getContext('2d');const total=slices.reduce((a,s)=>a+s.v,0);
    ctx.clearRect(0,0,size,size);const cx=size/2,cy=size/2,r=size/2-5;
    if(!total){ctx.beginPath();ctx.arc(cx,cy,r,0,2*Math.PI);ctx.fillStyle='#F0EAE6';ctx.fill();}
    else{let s=-Math.PI/2;slices.forEach(sl=>{const a=(sl.v/total)*2*Math.PI;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,s,s+a);ctx.closePath();ctx.fillStyle=sl.c;ctx.fill();s+=a;});}
    ctx.beginPath();ctx.arc(cx,cy,r*.56,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();
  },[slices,size]);
  return <canvas ref={ref} width={size} height={size}/>;
}

function MiniBar({data,color='#DC1F1F'}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current||!data?.length)return;
    const ctx=ref.current.getContext('2d');const w=ref.current.width,h=ref.current.height;
    ctx.clearRect(0,0,w,h);const max=Math.max(...data.map(d=>d.v),1);const bw=w/data.length;
    data.forEach((d,i)=>{
      const bh=(d.v/max)*(h-22);
      ctx.fillStyle=i===data.length-1?color:color+'66';
      ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(i*bw+3,h-bh-20,bw-6,bh,4);
      else ctx.rect(i*bw+3,h-bh-20,bw-6,bh);
      ctx.fill();
      ctx.fillStyle='#9A9189';ctx.font='bold 8px Plus Jakarta Sans';ctx.textAlign='center';
      ctx.fillText(d.l,i*bw+bw/2,h-4);
      if(d.v>0){ctx.fillStyle='#1A1A1A';ctx.font='bold 9px Plus Jakarta Sans';ctx.fillText(d.v,i*bw+bw/2,h-bh-26);}
    });
  },[data,color]);
  return <canvas ref={ref} width={280} height={115} className="w-full"/>;
}

// ── Dashboard ─────────────────────────────────────────────────────────────
function DashboardView({requests}){
  const stats=useMemo(()=>{
    if(!requests?.length)return null;
    const byOS={};
    requests.forEach(r=>{const k=String(r.os||'').trim();if(k){if(!byOS[k])byOS[k]=[];byOS[k].push(r);}});
    const multi=Object.entries(byOS).filter(([,a])=>a.length>1);
    const totalAdd=multi.reduce((a,[,arr])=>a+(arr.length-1),0);
    const intervalos=[];
    multi.forEach(([,arr])=>{const sorted=[...arr].sort((a,b)=>a.timestamp-b.timestamp);sorted.slice(1).forEach(p=>{intervalos.push(Math.round((p.timestamp-sorted[0].timestamp)/864e5));});});
    const mediaAdd=intervalos.length?(intervalos.reduce((a,b)=>a+b,0)/intervalos.length).toFixed(1):0;
    const maxAdd=intervalos.length?Math.max(...intervalos):0;
    let totalIt=0,pend=0,cotac=0,comprado=0,conc=0,doado=0;
    requests.forEach(r=>(r.items||[]).forEach(it=>{
      totalIt++;
      if(it.status==='Concluído')conc++;
      else if(it.status==='Doado')doado++;
      else if(it.status==='Comprado')comprado++;
      else if(it.status==='Em Cotação')cotac++;
      else pend++;
    }));
    const porSol={};requests.forEach(r=>{porSol[r.responsavel]=(porSol[r.responsavel]||0)+1;});
    const rankSol=Object.entries(porSol).sort((a,b)=>b[1]-a[1]).slice(0,6);
    const diasSem=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];const porDia=[0,0,0,0,0,0,0];
    requests.forEach(r=>porDia[new Date(r.timestamp).getDay()]++);
    const pedDia=diasSem.map((l,i)=>({l,v:porDia[i]}));
    const agora=Date.now();
    const hoje=new Date();const diaSem=hoje.getDay();
    const diasDesdeSegunda=(diaSem===0?6:diaSem-1);
    const inicioSemanaAtual=new Date(hoje);
    inicioSemanaAtual.setHours(0,0,0,0);
    inicioSemanaAtual.setDate(hoje.getDate()-diasDesdeSegunda);
    const semanas=Array.from({length:8},(_,i)=>{
      const ini=new Date(inicioSemanaAtual);ini.setDate(inicioSemanaAtual.getDate()-(7-i)*7);
      const fim=new Date(ini);fim.setDate(ini.getDate()+7);
      const cnt=requests.filter(r=>r.timestamp>=ini.getTime()&&r.timestamp<fim.getTime()).length;
      return{l:`${ini.getDate()}/${ini.getMonth()+1}`,v:cnt};
    });
    const porMod={};requests.forEach(r=>{const m=r.vehicleData?.modelo||'N/D';porMod[m]=(porMod[m]||0)+1;});
    const rankMod=Object.entries(porMod).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const taxa=totalIt>0?Math.round(conc/totalIt*100):0;
    const porUnidade={};requests.forEach(r=>{const u=r.unidade||'Unidade 1';porUnidade[u]=(porUnidade[u]||0)+1;});
    return{total:requests.length,osU:Object.keys(byOS).length,totalAdd,mediaAdd:parseFloat(mediaAdd),maxAdd,totalIt,pend,cotac,comprado,conc,doado,rankSol,pedDia,semanas,rankMod,taxa,porUnidade};
  },[requests]);

  if(!stats)return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'80px 20px',textAlign:'center'}}>
      <div style={{width:64,height:64,background:'var(--smoke)',borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:16}}><Icon name="bar-chart-2" size={26}/></div>
      <p style={{fontSize:11,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)'}}>Nenhum dado disponível</p>
    </div>
  );
  const maxSol=stats.rankSol[0]?.[1]||1,maxMod=stats.rankMod[0]?.[1]||1;
  return(
    <div style={{paddingBottom:40}} className="fade-up">
      <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',marginBottom:20}}>
        <div>
          <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.15em',color:'var(--red)',marginBottom:4}}>Inteligência Operacional</p>
          <h2 style={{fontSize:36,fontWeight:800,lineHeight:1,color:'var(--ink)',margin:0,letterSpacing:'-.02em'}}>Análises VRZ</h2>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8,background:'var(--ink)',color:'#fff',padding:'8px 16px',borderRadius:10}}>
          <span className="pulse-beacon" style={{width:7,height:7,borderRadius:'50%',background:'var(--red)',display:'inline-block'}}/>
          <span style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em'}}>Tempo real</span>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:12,marginBottom:16}}>
        {[
          {label:'Total de Pedidos',v:stats.total,sub:`${stats.osU} OS únicas`,icon:'clipboard-list',dark:true},
          {label:'Inclusões Adicionais',v:stats.totalAdd,sub:'mesma OS',icon:'plus-circle',red:true},
          {label:'Taxa de Conclusão',v:stats.taxa+'%',sub:`${stats.conc}/${stats.totalIt}`,icon:'check-circle'},
          {label:'Itens Comprados',v:stats.comprado,sub:'aguardando entrega',icon:'shopping-bag'},
          {label:'Itens Doados',v:stats.doado,sub:'transferidos entre OS',icon:'git-merge'},
        ].map((k,i)=>(
          <div key={i} style={{background:k.dark?'var(--ink)':k.red?'var(--red)':'var(--smoke)',color:k.dark||k.red?'#fff':'var(--ink)',borderRadius:14,padding:20,border:(!k.dark&&!k.red)?'1.5px solid var(--border)':'none'}}>
            <div style={{width:32,height:32,borderRadius:8,background:k.dark||k.red?'rgba(255,255,255,.12)':'var(--border)',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:14}}><Icon name={k.icon} size={16}/></div>
            <p style={{fontSize:36,fontWeight:800,lineHeight:1,margin:0,letterSpacing:'-.02em'}}>{k.v}</p>
            <p style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.08em',marginTop:6,opacity:.7}}>{k.label}</p>
            <p style={{fontSize:8,fontWeight:500,marginTop:2,opacity:.4}}>{k.sub}</p>
          </div>
        ))}
      </div>
      <div className="dash-grid-3" style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,marginBottom:16}}>
        <div className="card" style={{padding:20}}>
          <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.12em',color:'var(--muted)',marginBottom:16}}>Pipeline</p>
          <div style={{display:'flex',alignItems:'center',gap:16}}>
            <Donut size={90} slices={[{v:stats.pend,c:'#F59E0B'},{v:stats.cotac,c:'#2563EB'},{v:stats.comprado,c:'#7C3AED'},{v:stats.conc,c:'#059669'},{v:stats.doado,c:'#DC1F1F'}]}/>
            <div style={{flex:1}}>
              {[{l:'Pendente',v:stats.pend,c:'#F59E0B'},{l:'Em Cotação',v:stats.cotac,c:'#2563EB'},{l:'Comprado',v:stats.comprado,c:'#7C3AED'},{l:'Concluído',v:stats.conc,c:'#059669'},{l:'Doado',v:stats.doado,c:'#DC1F1F'}].map((s,i)=>(
                <div key={i} style={{marginBottom:6}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:2}}>
                    <div style={{display:'flex',alignItems:'center',gap:5}}><div style={{width:6,height:6,borderRadius:'50%',background:s.c}}/><span style={{fontSize:8,fontWeight:700,color:'var(--muted)',textTransform:'uppercase'}}>{s.l}</span></div>
                    <span style={{fontSize:9,fontWeight:800,color:'var(--ink)'}}>{s.v}</span>
                  </div>
                  <div className="progress-track"><div className="progress-fill" style={{width:stats.totalIt>0?`${s.v/stats.totalIt*100}%`:'0%',background:s.c}}/></div>
                </div>
              ))}
            </div>
          </div>
        </div>
        <div className="card" style={{padding:20}}>
          <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.12em',color:'var(--muted)',marginBottom:2}}>Pedidos por Semana</p>

          <MiniBar data={stats.semanas} color="#DC1F1F"/>

        <div className="card" style={{padding:20}}>
          <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.12em',color:'var(--muted)',marginBottom:2}}>Distribuição Semanal</p>

      </div>
      <div className="grid-2col" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>

          <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.12em',color:'var(--muted)',marginBottom:16}}>Top Solicitantes</p>
          {stats.rankSol.map(([nome,qtd],i)=>(

function MeusCarrosView({loggedInUser,isMaster,finalizacoes,requests}){
  const[search,setSearch]=useState('');
  const[subTab,setSubTab]=useState('pendentes');
  const[confirmDelFin,setConfirmDelFin]=useState(null);
  const[confirmDelProb,setConfirmDelProb]=useState(null);
  const[pdfConfirmFin,setPdfConfirmFin]=useState(null);

  const podeVerTodos=isMaster||loggedInUser?.role==='comercial'||loggedInUser?.user==='Cleber.Zonta';
  const baseVisiveis=useMemo(()=>{
    let list=podeVerTodos?finalizacoes:finalizacoes.filter(f=>f.criadoPor===loggedInUser.user);
    list=list.filter(f=>!f.arquivada);
    if(search){
      const t=search.toLowerCase();
      list=list.filter(f=>String(f.os).toLowerCase().includes(t)||String(f.vehicleData?.modelo||'').toLowerCase().includes(t)||String(f.criadoPor||'').toLowerCase().includes(t));
    }
    return list.sort((a,b)=>b.criadoEm-a.criadoEm);
  },[finalizacoes,loggedInUser,isMaster,search]);

  // Calcula se a inspeção está 100% concluída (Ajuste + Pintura + Peças sem pendência)
  const comStatus=useMemo(()=>baseVisiveis.map(fin=>{
    const pendAjustePintura=['ajuste','martelinho','pintura','vidro'].reduce((a,c)=>a+(fin[c]||[]).filter(p=>p.status!=='Solucionado').length,0);
    const pecasItems=getPecasParaOS(fin.os,requests);
    const pecasAtivas=pecasItems.filter(it=>!it.excedente);
    const pecasSolucionado=pecasAtivas.length===0||pecasAtivas.every(it=>it.status==='Concluído');
    const totalPend=pendAjustePintura+(pecasSolucionado?0:1);
    return{fin,totalPend,concluida:totalPend===0};
  }),[baseVisiveis,requests]);

  const visiveis=useMemo(()=>comStatus.filter(c=>subTab==='concluidos'?c.concluida:!c.concluida).map(c=>c.fin),[comStatus,subTab]);
  const countConcluidos=comStatus.filter(c=>c.concluida).length;
  const countPendentes=comStatus.filter(c=>!c.concluida).length;

  const podeEditar=(fin)=>isMaster||fin.criadoPor===loggedInUser.user;

  const resolverPendencia=async(finId,categoria,itemId)=>{
    const fin=finalizacoes.find(f=>f.id===finId);if(!fin)return;
    const now=Date.now();
    const newCat=(fin[categoria]||[]).map(p=>p.id===itemId?{...p,status:'Solucionado',resolvidoPor:loggedInUser.user,resolvidoEm:now}:p);
    const novoHistorico=[...(fin.historico||[]),{acao:`Pendência resolvida (${categoria})`,usuario:loggedInUser.user,timestamp:now}];
    try{await col('finalizacoes').doc(finId).update({[categoria]:stripUndefined(newCat),historico:stripUndefined(novoHistorico)});}
    catch(e){alert('Erro: '+e.message);}
  };

  const cancelarSolucao=async(finId,categoria,itemId)=>{
    const fin=finalizacoes.find(f=>f.id===finId);if(!fin)return;
    const now=Date.now();
    const newCat=(fin[categoria]||[]).map(p=>{
      if(p.id!==itemId)return p;
      const{resolvidoPor,resolvidoEm,...rest}=p;
      return{...rest,status:'Pendente',canceladoSolucaoPor:loggedInUser.user,canceladoSolucaoEm:now};
    });
    const novoHistorico=[...(fin.historico||[]),{acao:`Solução cancelada (${categoria})`,usuario:loggedInUser.user,timestamp:now}];
    try{await col('finalizacoes').doc(finId).update({[categoria]:stripUndefined(newCat),historico:stripUndefined(novoHistorico)});}
    catch(e){alert('Erro: '+e.message);}
  };

  const excluirProblema=async()=>{
    if(!confirmDelProb)return;
    const{finId,categoria,itemId}=confirmDelProb;
    const fin=finalizacoes.find(f=>f.id===finId);if(!fin)return;
    const newCat=(fin[categoria]||[]).filter(p=>p.id!==itemId);
    const now=Date.now();
    try{await col('finalizacoes').doc(finId).update({[categoria]:stripUndefined(newCat),historico:stripUndefined([...(fin.historico||[]),{acao:`Problema excluído (${categoria}) por ${loggedInUser.user}`,usuario:loggedInUser.user,timestamp:now}])});}
    catch(e){alert('Erro: '+e.message);}
    setConfirmDelProb(null);
  };

  const excluirInspecao=async()=>{
    if(!confirmDelFin)return;
    try{await col('finalizacoes').doc(confirmDelFin).delete();}catch(e){alert('Erro: '+e.message);}
    setConfirmDelFin(null);
  };

const exportarPDF=async(fin,comFoto=true)=>{
    const pecasItems=getPecasParaOS(fin.os,requests);
    const doc=await buildFinalizacaoPDF(fin,pecasItems,comFoto);
    doc.save(`Finalizacao_OS_${fin.os}.pdf`);
  };

  const exportarExcel=()=>{
    const csvCell=(v)=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
const rows=[[csvCell('OS'),csvCell('Chassi'),csvCell('Modelo'),csvCell('Ajustes'),csvCell('Martelinho'),csvCell('Pintura'),csvCell('Vidro'),csvCell('Peças'),csvCell('Responsável')].join(';')];
    baseVisiveis.forEach(fin=>{
      const fmtProblemas=(items)=>(items||[]).map(p=>`${p.status==='Solucionado'?'[Solucionado]':'[Pendente]'} ${p.descricao||'(sem descrição)'}`).join(' | ')||'—';
      const pecasItems=getPecasParaOS(fin.os,requests).filter(it=>!it.excedente);
      const fmtPecas=pecasItems.map(it=>`${it.quantity}x ${it.description} — ${it.statusOriginal||it.status||'Pendente'}`).join(' | ')||'—';
      rows.push([
        csvCell(fin.os),
        csvCell(fin.vehicleData?.chassi||'—'),
        csvCell(fin.vehicleData?.modelo||'—'),
        csvCell(fmtProblemas(fin.ajuste)),
        csvCell(fmtProblemas(fin.martelinho)),
        csvCell(fmtProblemas(fin.pintura)),
        csvCell(fmtProblemas(fin.vidro)),
        csvCell(fmtPecas),
        csvCell(fin.criadoPor||'—'),
      ].join(';'));
    });
    const blob=new Blob(['\uFEFF'+rows.join('\r\n')],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Finalizacoes_VRZ_${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.csv`;a.click();
  };

  return(
    <>
    <div className="fade-up" style={{paddingBottom:30}}>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',marginBottom:16}}>
        <div style={{position:'relative',flex:1,minWidth:200}}>
          <input type="text" placeholder="Buscar OS / Modelo / Usuário..." value={search} onChange={e=>setSearch(e.target.value)} className="input" style={{paddingLeft:36}}/>
          <div style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',color:'var(--muted)'}}><Icon name="search" size={14}/></div>
        </div>
        <button onClick={exportarExcel} style={{display:'flex',alignItems:'center',gap:6,padding:'10px 16px',background:'#059669',color:'#fff',border:'none',borderRadius:10,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer',fontFamily:'Plus Jakarta Sans,sans-serif',whiteSpace:'nowrap'}}>
          <Icon name="file-spreadsheet" size={14}/> Exportar Excel
        </button>
      </div>
      <div style={{display:'flex',gap:3,background:'var(--smoke)',padding:4,borderRadius:12,border:'1px solid var(--border)',width:'fit-content',marginBottom:16,flexWrap:'wrap'}}>
        {[{k:'pendentes',l:`Pendentes (${countPendentes})`},{k:'concluidos',l:`Concluídos (${countConcluidos})`}].map(t=>(
          <button key={t.k} onClick={()=>setSubTab(t.k)} style={{padding:'8px 16px',borderRadius:9,fontSize:9,fontWeight:800,textTransform:'uppercase',border:'none',cursor:'pointer',letterSpacing:'.06em',fontFamily:'Plus Jakarta Sans,sans-serif',background:subTab===t.k?'#fff':'transparent',color:subTab===t.k?'var(--red)':'var(--muted)',boxShadow:subTab===t.k?'0 2px 8px rgba(0,0,0,.08)':'none'}}>{t.l}</button>
        ))}
      </div>
      {visiveis.length===0?(
        <div style={{padding:'56px 20px',textAlign:'center',background:'#fff',borderRadius:16,border:'1.5px dashed var(--border)'}}>
          <Icon name="clipboard-check" size={30} style={{margin:'0 auto 10px',display:'block',color:'var(--muted)'}}/>
          <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',margin:0}}>Nenhuma inspeção {subTab==='concluidos'?'concluída':'pendente'} encontrada</p>
        </div>
      ):(
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {visiveis.map(fin=>{
        const categorias=[['ajuste','Ajuste','#F59E0B','wrench'],['martelinho','Martelinho','#DC1F1F','hammer'],['pintura','Pintura','#2563EB','paintbrush'],['vidro','Vidro','#0EA5E9','square']];
            const totalPend=['ajuste','martelinho','pintura','vidro'].reduce((a,c)=>a+(fin[c]||[]).filter(p=>p.status!=='Solucionado').length,0);
            const editar=podeEditar(fin);
            const pecasItems=getPecasParaOS(fin.os,requests);
            const pecasAtivas=pecasItems.filter(it=>!it.excedente);
            const pecasExc=pecasItems.filter(it=>it.excedente);
            return(
              <div key={fin.id} className="card" style={{borderLeft:`3px solid ${totalPend>0?'var(--red)':'#059669'}`}}>
                <div style={{padding:'14px 16px',borderBottom:'1px solid var(--border)',background:'var(--smoke)',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>

                   <button onClick={()=>setPdfConfirmFin(fin)} style={{display:'flex',alignItems:'center',gap:5,padding:'6px 12px',background:'#2563EB',color:'#fff',border:'none',borderRadius:7,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer'}}><Icon name="file-down" size={12}/> PDF</button>
                    {isMaster&&(

function FinalizacaoView({vehiclesDB,requests,loggedInUser,isMaster}){
  const isComercial=loggedInUser?.role==='comercial';
  const[sub,setSub]=useState(isComercial?'meus':'nova');
  const{data:finalizacoes,loading}=useFirestore('finalizacoes');

  useEffect(()=>{
    if(loading||!finalizacoes.length||!vehiclesDB.length)return;
    const sweep=async()=>{
      const now=Date.now();
      for(const fin of finalizacoes){
        if(fin.arquivada)continue;
        const v=vehiclesDB.find(vv=>String(vv.os).trim()===String(fin.os).trim());
        const entregue=v&&(String(v.etapa||'').trim().toLowerCase()==='entregue'||String(v.localizacao||'').trim().toLowerCase()==='entregue');
        if(!entregue)continue;
        if(!fin.entregueDetectadoEm){
          try{await col('finalizacoes').doc(fin.id).update({entregueDetectadoEm:now});}catch(e){}
          continue;
        }
        if(now-fin.entregueDetectadoEm<5*86400000)continue;
       try{
          const pecasItems=getPecasParaOS(fin.os,requests);
          const doc=await buildFinalizacaoPDF(fin,pecasItems);
          const blob=doc.output('blob');
          let pdfUrl=null;
          try{
            const path=`finalizacoesHistorico/${fin.os}_${now}.pdf`;
            const ref=storage.ref().child(path);
            await ref.put(blob);
            pdfUrl=await ref.getDownloadURL();
          }catch(e){console.warn('Upload PDF histórico falhou:',e);}
          await col('finalizacoesHistorico').add(stripUndefined({os:fin.os,unidade:fin.unidade,vehicleData:fin.vehicleData,criadoPor:fin.criadoPor,criadoEm:fin.criadoEm,arquivadoEm:now,pdfUrl}));
        await col('finalizacoes').doc(fin.id).update({arquivada:true,ajuste:[],martelinho:[],pintura:[],vidro:[],historico:[...(fin.historico||[]),{acao:'Inspeção arquivada automaticamente (5 dias após entrega)',usuario:'Sistema',timestamp:now}]});
        }catch(e){console.warn('Arquivamento automático falhou para OS',fin.os,e);}
      }
    };
    sweep();
    // eslint-disable-next-line
  },[finalizacoes.length,vehiclesDB.length]);

  return(
    <div className="fade-up" style={{paddingBottom:16}}>
      <div style={{marginBottom:16}}>
        <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.15em',color:'var(--red)',marginBottom:4}}>Inspeção Final</p>
        <h2 style={{fontSize:30,fontWeight:800,margin:'0 0 14px',letterSpacing:'-.02em'}}>Finalização</h2>
        <div style={{display:'flex',gap:3,background:'var(--smoke)',padding:4,borderRadius:12,border:'1px solid var(--border)',width:'fit-content',flexWrap:'wrap'}}>
          {[!isComercial&&{k:'nova',l:'Nova Inspeção'},{k:'meus',l:'Meus Carros'},isMaster&&{k:'historico',l:'Histórico'}].filter(Boolean).map(t=>(
            <button key={t.k} onClick={()=>setSub(t.k)} style={{padding:'8px 16px',borderRadius:9,fontSize:9,fontWeight:800,textTransform:'uppercase',border:'none',cursor:'pointer',letterSpacing:'.06em',fontFamily:'Plus Jakarta Sans,sans-serif',background:sub===t.k?'#fff':'transparent',color:sub===t.k?'var(--red)':'var(--muted)',boxShadow:sub===t.k?'0 2px 8px rgba(0,0,0,.08)':'none'}}>{t.l}</button>
          ))}
        </div>
      </div>
      {loading?<Skeleton/>:(
        <>
          {sub==='nova'&&<NovaFinalizacaoForm vehiclesDB={vehiclesDB} requests={requests} loggedInUser={loggedInUser} isMaster={isMaster} finalizacoes={finalizacoes}/>}
          {sub==='meus'&&<MeusCarrosView loggedInUser={loggedInUser} isMaster={isMaster} finalizacoes={finalizacoes} requests={requests}/>}
          {sub==='historico'&&isMaster&&<FinalizacaoHistoricoView/>}
        </>
      )}
    </div>
  );
}

function PedidosExcedentesView({requests}){
  const excedentes=useMemo(()=>{
    const list=[];
    requests.forEach(req=>(req.items||[]).forEach(it=>{
      if(it.excedente===true)list.push({reqId:req.id,os:req.os,unidade:req.unidade,vehicleData:req.vehicleData,item:it});
    }));
    return list.sort((a,b)=>(b.item.excedenteEm||0)-(a.item.excedenteEm||0));
  },[requests]);

  const manter=async(reqId,itemId)=>{
    const req=requests.find(r=>r.id===reqId);if(!req)return;
    const newItems=req.items.map(it=>{
      if(String(it.id)!==String(itemId))return it;
      const{excedente,excedentePor,excedenteEm,...rest}=it;
      return rest;
    });
    try{await col('requests').doc(reqId).update({items:stripUndefined(newItems)});}
    catch(e){alert('Erro: '+e.message);}
  };

  const excluir=async(reqId,itemId)=>{
    if(!window.confirm('Excluir esta peça do pedido de compra?'))return;
    const req=requests.find(r=>r.id===reqId);if(!req)return;
    const newItems=req.items.filter(it=>String(it.id)!==String(itemId));
    try{
      if(newItems.length===0)await col('requests').doc(reqId).delete();
      else await col('requests').doc(reqId).update({items:stripUndefined(newItems)});
    }catch(e){alert('Erro: '+e.message);}
  };

  if(excedentes.length===0)return(
    <div style={{padding:'56px 20px',textAlign:'center',background:'#fff',borderRadius:16,border:'1.5px dashed var(--border)'}}>
      <Icon name="package-minus" size={30} style={{margin:'0 auto 10px',display:'block',color:'var(--muted)'}}/>
      <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',margin:0}}>Nenhum pedido excedente registrado</p>
    </div>
  );

  return(
   <div className="card" style={{overflow:'hidden'}}>
          <div className="table-scroll">
          <table className="vtable w-full" style={{minWidth:500}}>
            <thead><tr><th>OS</th><th>Veículo</th><th>Peça</th><th>Qtd</th><th>Marcado por</th><th>Data</th><th style={{textAlign:'right'}}>Ação</th></tr></thead>
        <tbody>
          {excedentes.map((e,i)=>(
            <tr key={i}>
              <td style={{fontWeight:800}}>#{e.os}</td>
              <td style={{textTransform:'uppercase',fontSize:10}}>{e.vehicleData?.modelo||'—'}</td>
              <td style={{fontWeight:700,textTransform:'uppercase',fontSize:11}}>{e.item.description}</td>
              <td style={{textAlign:'center'}}>{e.item.quantity}</td>
              <td style={{fontSize:10,color:'var(--muted)'}}>{e.item.excedentePor||'—'}</td>
              <td style={{fontSize:10,color:'var(--muted)'}}>{e.item.excedenteEm?new Date(e.item.excedenteEm).toLocaleDateString('pt-BR'):'—'}</td>
              <td style={{textAlign:'right'}}>
                <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
                  <button onClick={()=>manter(e.reqId,e.item.id)} style={{padding:'5px 12px',background:'#059669',color:'#fff',border:'none',borderRadius:7,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer'}}>Manter</button>
                  <button onClick={()=>excluir(e.reqId,e.item.id)} style={{padding:'5px 12px',background:'var(--red)',color:'#fff',border:'none',borderRadius:7,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer'}}>Excluir</button>
                </div>
              </td>
            </tr>
          ))}
       </tbody>
      </table>
      </div>
    </div>
  );
}

function ResumoReuniaoView({requests}){
  const [periodo, setPeriodo] = useState('semanal'); // 'semanal', 'quinzenal', 'mensal'
  const [offset, setOffset] = useState(0);
  const [diaSelecionado, setDiaSelecionado] = useState(null);

  const { inicioPeriodo, fimPeriodo, numDias } = useMemo(() => {
    const agora = new Date();
    let ini, fim, n;

    if (periodo === 'semanal') {
      const diaSem = agora.getDay();
      ini = new Date(agora);
      ini.setDate(agora.getDate() - diaSem + (offset * 7));
      ini.setHours(0, 0, 0, 0);
      fim = new Date(ini);
      fim.setDate(ini.getDate() + 6);
      fim.setHours(23, 59, 59, 999);
      n = 7;
    } else if (periodo === 'quinzenal') {
      // Calcula a quinzena atual (1 ou 2 do mês)
      const quinzenaAtual = agora.getDate() <= 15 ? 0 : 1;
      const totalQuinzenas = (agora.getFullYear() * 24 + agora.getMonth() * 2 + quinzenaAtual) + offset;
      const year = Math.floor(totalQuinzenas / 24);
      const month = Math.floor((totalQuinzenas % 24) / 2);
      const isSecondHalf = totalQuinzenas % 2 !== 0;
      
      ini = new Date(year, month, isSecondHalf ? 16 : 1);
      ini.setHours(0, 0, 0, 0);
      if (isSecondHalf) {
        fim = new Date(year, month + 1, 0);
      } else {
        fim = new Date(year, month, 15);
      }
    fim.setHours(23, 59, 59, 999);
      n = fim.getDate() - ini.getDate() + 1;
    } else {
      const totalMonths = (agora.getFullYear() * 12 + agora.getMonth()) + offset;
      const year = Math.floor(totalMonths / 12);
      const month = totalMonths % 12;
      ini = new Date(year, month, 1);
      ini.setHours(0, 0, 0, 0);
      fim = new Date(year, month + 1, 0);
      fim.setHours(23, 59, 59, 999);
      n = fim.getDate();
    }
    return { inicioPeriodo: ini, fimPeriodo: fim, numDias: n };
  }, [periodo, offset]);

  const isPeriodoAtual = offset === 0;
  const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

  const diasDoPeriodo = useMemo(() => {
    return Array.from({ length: numDias }, (_, i) => {
      const d = new Date(inicioPeriodo);
      d.setDate(inicioPeriodo.getDate() + i);
      return {
        label: diasSemana[d.getDay()],
        date: d.toISOString().slice(0, 10),
        isHoje: d.toDateString() === new Date().toDateString(),
        pedidos: [],
        osSet: new Set(),
      };
    });
  }, [inicioPeriodo, numDias]);

const dadosDia = useMemo(() => {
    const map = {};
    diasDoPeriodo.forEach(d => { map[d.date] = { ...d, pedidos: [], osSet: new Set() }; });

    // Junta as "partes" do mesmo envio (mesma OS, timestamps muito próximos, diferença
    // de até 10ms por parte) num único pedido — assim nenhuma peça das partes 2,3... se perde.
    const grupos = {};
    requests.forEach(r => {
      if (!r.timestamp) return;
      const itensReais = (r.items || []).filter(it => !it.donatedTo);
if (itensReais.length === 0) return;
      const baseTs = r.parte ? r.timestamp - ((r.parte - 1) * 10) : r.timestamp;
      const key = `${r.os}_${baseTs}`;
      if (!grupos[key]) grupos[key] = { ...r, items: [] };
      grupos[key].items = [...grupos[key].items, ...itensReais];
      if (!r.parte || r.parte === 1) grupos[key].timestamp = r.timestamp;
    });

    Object.values(grupos).forEach(r => {
      const dt = new Date(r.timestamp);
      const key = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
      if (map[key]) {
        map[key].pedidos.push(r);
        if (r.os) map[key].osSet.add(String(r.os).trim());
      }
    });
    return Object.values(map);
  }, [requests, diasDoPeriodo]);

// Estas duas métricas usam a MESMA fórmula das barras/rótulos abaixo — garante 100% de
  // fidelidade entre os cartões do topo e o que está desenhado no gráfico, sempre.
 const totalPecasPeriodo = dadosDia.reduce((a, d) => a + d.pedidos.reduce((s, p) => s + (p.items?.length || 0), 0), 0);
const osUnicasPeriodo = new Set(dadosDia.flatMap(d => Array.from(d.osSet))).size;
const mediaPorCarro = osUnicasPeriodo > 0 ? (totalPecasPeriodo / osUnicasPeriodo).toFixed(1) : '0';
  const maxPedDia = Math.max(...dadosDia.map(d => d.pedidos.reduce((s, p) => s + (p.items?.length || 0), 0)), 1);



const dadosCompra = useMemo(() => {
    const map = {};
    diasDoPeriodo.forEach(d => { map[d.date] = { ...d, itens: [], valor: 0, osSet: new Set() }; });
    const osComCompra = new Set();
 
    requests.forEach(r => {
      (r.items || []).forEach(it => {
        if (!it.boughtAt) return;
        if (it.donatedTo) return; // cópia de doação — a compra já é contada na OS receptora
     
        const dateKey = String(it.boughtAt).trim().slice(0, 10);
        if (map[dateKey]) {
          const preco = parsePrice(it.price);
          map[dateKey].itens.push({ ...it, os: r.os, _preco: preco });
          map[dateKey].valor += preco;
          if (r.os) { map[dateKey].osSet.add(String(r.os).trim()); osComCompra.add(String(r.os).trim()); }
        }
      });
    });
    const dias = Object.values(map);
    const totalValor = dias.reduce((a, d) => a + d.valor, 0);
    const totalItens = dias.reduce((a, d) => a + d.itens.length, 0);
    const mediaValorOS = osComCompra.size > 0 ? (totalValor / osComCompra.size) : 0;
    return { dias, totalItens, osUnicas: osComCompra.size, totalValor, mediaValorOS };
  }, [requests, diasDoPeriodo]);

  const maxValDia = Math.max(...dadosCompra.dias.map(d => d.valor), 1);

  // Helper para renderizar gráfico estilo "Diretoria"
  const renderChart = (canvas, data, maxValue, type) => {
    if (!canvas) return;
   const ctx = canvas.getContext('2d');
    const dpr = Math.max(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    
    // Ajuste de DPI para evitar embaçamento
    if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
    }
    
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.scale(dpr, dpr);
    
    const displayW = rect.width, displayH = rect.height;
   const padL = 72, padR = 40, bot = 96, top = 40;
    const chartH = displayH - bot - top, chartW = displayW - padL - padR;
    const n = data.length;
    const bw = chartW / n;
    const barGap = n > 15 ? 0.1 : 0.25;
    
    // Grid lines
    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = '#E5E7EB';
    ctx.lineWidth = 1;
    [0, 0.25, 0.5, 0.75, 1].forEach(p => {
      const y = top + chartH * (1 - p);
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(displayW - padR, y);
      ctx.stroke();
      
      ctx.setLineDash([]);
      ctx.fillStyle = '#6B7280';
      ctx.font = '600 11px Plus Jakarta Sans';
      ctx.textAlign = 'right';
      let label;
      if (type === 'valor') {
        const v = maxValue * p;
        label = v >= 1000 ? 'R$ ' + (v / 1000).toFixed(1).replace('.', ',') + 'k' : 'R$ ' + Math.round(v);
      } else {
        label = Math.round(maxValue * p);
      }
      ctx.fillText(label, padL - 10, y + 4);
      ctx.setLineDash([3, 3]);
    });
    ctx.setLineDash([]);

    // Coordenadas das barras para detecção de clique
    const barRects = [];

   data.forEach((d, i) => {
      // Para 'pedidos', a barra mostra o total de PEÇAS solicitadas no dia;
      // 'count' mostra quantos pedidos/OS geraram essas peças (rótulo abaixo da barra)
      const val = type === 'valor' ? d.valor : d.pedidos.reduce((a, p) => a + (p.items?.length || 0), 0);
      const count = type === 'valor' ? d.itens.length : d.osSet.size;
      const x = padL + i * bw;
      const bh = maxValue > 0 ? (val / maxValue) * chartH : 0;
      const bx = x + bw * barGap, bwidth = bw * (1 - barGap * 2);
      const barY = top + chartH - Math.max(bh, 2);
      const barH = Math.max(bh, 2);

      barRects.push({ x: bx, y: barY, w: bwidth, h: barH, data: d });

      // Draw Bar
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(bx, barY, bwidth, barH, [6, 6, 0, 0]);
      } else {
        ctx.rect(bx, barY, bwidth, barH);
      }
      ctx.fillStyle = diaSelecionado?.date === d.date ? '#A81515' : '#DC1F1F';
      ctx.fill();

      // Value on top - Mostrar sempre conforme solicitado
      if (val > 0) {
        ctx.fillStyle = '#000';
        ctx.font = 'bold 10px Plus Jakarta Sans';
        ctx.textAlign = 'center';
      let vStr;
        if (type === 'valor') {
          // Valor exato — sem abreviação em "k" — para fidelidade financeira total
          vStr = 'R$ ' + val.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        } else {
          vStr = val;
        }
        // No mensal, rotacionar se necessário ou diminuir fonte
        if (n > 15) {
          ctx.save();
          ctx.translate(x + bw / 2, barY - 12);
          ctx.rotate(-Math.PI / 4);
          ctx.fillText(vStr, 0, 0);
          ctx.restore();
        } else {
          ctx.fillText(vStr, x + bw / 2, barY - 8);
        }
      }

      // X-axis Labels - Mostrar apenas alguns no mensal para não poluir
   if (n <= 15 || i % Math.ceil(n/10) === 0 || i === n - 1) {
        ctx.fillStyle = '#000';
        ctx.font = 'bold 10px Plus Jakarta Sans';
        ctx.textAlign = 'center';
        ctx.fillText(d.label, x + bw / 2, displayH - 70);
        
        const dtParts = d.date.split('-');
        ctx.fillStyle = '#6B7280';
        ctx.font = '500 9px Plus Jakarta Sans';
        ctx.fillText(`${dtParts[2]}/${dtParts[1]}`, x + bw / 2, displayH - 57);
      }

   // Rótulo abaixo da barra: itens + OS's que geraram o valor (gráfico de compras) ou peças + OS's (gráfico de pedidos)
    if ((n <= 15 || diaSelecionado?.date === d.date) && (count > 0 || val > 0)) {
        ctx.fillStyle = '#DC1F1F';
        ctx.font = 'bold 9px Plus Jakarta Sans';
        ctx.textAlign = 'center';
        if (type === 'valor') {
          const osQtd = d.osSet ? d.osSet.size : 0;
          ctx.fillText(`${count} item${count !== 1 ? 's' : ''}`, x + bw / 2, displayH - 30);
          ctx.fillText(`${osQtd} OS${osQtd !== 1 ? "'s" : ''}`, x + bw / 2, displayH - 15);
        } else {
          ctx.fillText(`${count} OS${count !== 1 ? "'s" : ''}`, x + bw / 2, displayH - 15);
        }
      }
    });
    ctx.restore();

    // Adicionar listener de clique (removendo anterior se houver)
    canvas.onclick = (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      
      const clickedBar = barRects.find(r => 
        clickX >= r.x && clickX <= r.x + r.w && 
        clickY >= r.y - 20 && clickY <= r.y + r.h + 40
      );
      
      if (clickedBar) {
        setDiaSelecionado(clickedBar.data);
      } else {
        setDiaSelecionado(null);
      }
    };
  };

  const refBar1 = useRef(null);
  const refBar2 = useRef(null);

  useEffect(() => {
    const desenhar = () => {
      renderChart(refBar1.current, dadosDia, maxPedDia, 'pedidos');
      renderChart(refBar2.current, dadosCompra.dias, maxValDia, 'valor');
    };
    desenhar();
    window.addEventListener('resize', desenhar);
    return () => window.removeEventListener('resize', desenhar);
  }, [dadosDia, maxPedDia, dadosCompra, maxValDia, periodo, diaSelecionado]);
  const fmtPeriodo = `${inicioPeriodo.toLocaleDateString('pt-BR')} – ${fimPeriodo.toLocaleDateString('pt-BR')}`;

  return (
    <div className="fade-up" style={{ paddingBottom: 40 }}>
      {/* Header com Seleção de Período */}
      <div style={{ marginBottom: 24 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 16 }}>
          <div>
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, background: '#0D0D0D', borderRadius: 8, padding: '4px 12px', marginBottom: 12 }}>
              <span className="pulse-beacon" style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--red)', display: 'inline-block' }} />
              <span style={{ fontSize: 8, fontWeight: 800, textTransform: 'uppercase', letterSpacing: '.14em', color: 'rgba(255, 255, 255, .6)' }}>Relatório de Diretoria</span>
            </div>
            <h2 style={{ fontSize: 34, fontWeight: 800, margin: '0', letterSpacing: '-.03em', lineHeight: 1 }}>Resumo {periodo === 'semanal' ? 'da Semana' : periodo === 'quinzenal' ? 'da Quinzena' : 'do Mês'}</h2>
          </div>

          {/* Seletores de Período */}
          <div style={{ display: 'flex', background: 'var(--smoke)', padding: 4, borderRadius: 12, border: '1.5px solid var(--border)' }}>
            {['semanal', 'quinzenal', 'mensal'].map(p => (
              <button
                key={p}
                onClick={() => { setPeriodo(p); setOffset(0); }}
                style={{
                  padding: '8px 16px',
                  borderRadius: 8,
                  border: 'none',
                  fontSize: 10,
                  fontWeight: 800,
                  textTransform: 'uppercase',
                  cursor: 'pointer',
                  background: periodo === p ? '#fff' : 'transparent',
                  color: periodo === p ? 'var(--red)' : 'var(--muted)',
                  boxShadow: periodo === p ? '0 2px 8px rgba(0,0,0,.05)' : 'none',
                  transition: 'all .2s'
                }}
              >
                {p}
              </button>
            ))}
          </div>
        </div>

        {/* Navegação */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 16 }}>
          <div style={{ display: 'flex', alignItems: 'center', background: '#fff', border: '1.5px solid var(--border)', borderRadius: 12, overflow: 'hidden' }}>
            <button
              onClick={() => setOffset(o => o - 1)}
              style={{ padding: '10px 16px', background: 'none', border: 'none', cursor: 'pointer', color: 'var(--ink)', display: 'flex', alignItems: 'center', gap: 5, fontFamily: 'Plus Jakarta Sans,sans-serif', fontSize: 11, fontWeight: 700 }}
            >
              <Icon name="chevron-left" size={16} /> Anterior
            </button>
            <div style={{ padding: '10px 20px', borderLeft: '1px solid var(--border)', borderRight: '1px solid var(--border)', textAlign: 'center', minWidth: 200 }}>
              <p style={{ fontSize: 12, fontWeight: 800, margin: 0 }}>{fmtPeriodo}</p>
              {isPeriodoAtual && <p style={{ fontSize: 8, fontWeight: 800, textTransform: 'uppercase', color: 'var(--red)', margin: '2px 0 0' }}>Período atual</p>}
            </div>
            <button
              onClick={() => setOffset(o => o + 1)}
              disabled={isPeriodoAtual}
              style={{ padding: '10px 16px', background: 'none', border: 'none', cursor: isPeriodoAtual ? 'not-allowed' : 'pointer', color: isPeriodoAtual ? '#D0C9C4' : 'var(--ink)', display: 'flex', alignItems: 'center', gap: 5, fontFamily: 'Plus Jakarta Sans,sans-serif', fontSize: 11, fontWeight: 700 }}
            >
              Próxima <Icon name="chevron-right" size={16} />
            </button>
          </div>
          {!isPeriodoAtual && (
            <button onClick={() => setOffset(0)} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '10px 16px', background: 'var(--ink)', color: '#fff', border: 'none', borderRadius: 10, fontSize: 10, fontWeight: 800, textTransform: 'uppercase', cursor: 'pointer' }}>
              <Icon name="rotate-ccw" size={13} /> Atual
            </button>
          )}
        </div>
      </div>

      {/* KPIs */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))', gap: 10, marginBottom: 24 }}>
        {[
         { label: 'Pedidos no período', v: totalPecasPeriodo, sub: `${osUnicasPeriodo} OS's no período`, icon: 'clipboard-list', dark: true },
          { label: 'Média por veículo', v: mediaPorCarro, sub: 'pedidos / carro', icon: 'car', red: true },
          { label: 'Itens comprados', v: dadosCompra.totalItens, sub: `${dadosCompra.osUnicas} OS com compra`, icon: 'shopping-bag' },
          { label: 'Valor médio / OS', v: dadosCompra.mediaValorOS > 0 ? fmtBRL(dadosCompra.mediaValorOS) : '—', sub: 'no período', icon: 'trending-up' },
          { label: 'Total gasto', v: dadosCompra.totalValor > 0 ? fmtBRL(dadosCompra.totalValor) : '—', sub: 'em compras', icon: 'banknote' },
        ].map((k, i) => (
          <div key={i} style={{ background: k.dark ? '#0D0D0D' : k.red ? 'var(--red)' : 'var(--smoke)', color: k.dark || k.red ? '#fff' : 'var(--ink)', borderRadius: 14, padding: '16px 18px', border: (!k.dark && !k.red) ? '1.5px solid var(--border)' : 'none' }}>
            <div style={{ width: 28, height: 28, borderRadius: 7, background: k.dark || k.red ? 'rgba(255,255,255,.12)' : 'var(--border)', display: 'flex', alignItems: 'center', justifySelf: 'center', marginBottom: 12 }}><Icon name={k.icon} size={14} /></div>
            <p style={{ fontSize: String(k.v).length > 7 ? 18 : 28, fontWeight: 800, lineHeight: 1, margin: 0 }}>{k.v}</p>
            <p style={{ fontSize: 8, fontWeight: 800, textTransform: 'uppercase', marginTop: 5, opacity: .65 }}>{k.label}</p>
            <p style={{ fontSize: 8, fontWeight: 500, marginTop: 2, opacity: .4 }}>{k.sub}</p>
          </div>
        ))}
      </div>

      {/* Gráfico 1: Pedidos */}
      <div className="card" style={{ padding: 24, marginBottom: 16 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 20 }}>
          <div>
            <p style={{ fontSize: 8, fontWeight: 800, textTransform: 'uppercase', color: 'var(--red)', margin: '0 0 4px' }}>Pedidos por dia</p>
            <h3 style={{ fontSize: 18, fontWeight: 800, margin: 0 }}>Volume de Requisições</h3>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div style={{ width: 12, height: 12, background: '#DC1F1F', borderRadius: 3 }} />
            <span style={{ fontSize: 9, fontWeight: 700, textTransform: 'uppercase', color: '#6B7280' }}>Pedidos (Un.)</span>
          </div>
        </div>
        <div style={{ overflowX: 'auto' }}>
          <canvas ref={refBar1} width={periodo === 'mensal' ? 1200 : 840} height={300} style={{ width: '100%', height: 'auto', minWidth: periodo === 'mensal' ? 800 : 'auto' }} />
        </div>
      </div>

      {/* Gráfico 2: Compras */}
      <div className="card" style={{ padding: 24 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 20 }}>
          <div>
            <p style={{ fontSize: 8, fontWeight: 800, textTransform: 'uppercase', color: 'var(--red)', margin: '0 0 4px' }}>Valor comprado por dia</p>
            <h3 style={{ fontSize: 18, fontWeight: 800, margin: 0 }}>Valor Gasto em Peças</h3>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div style={{ width: 12, height: 12, background: '#DC1F1F', borderRadius: 3 }} />
            <span style={{ fontSize: 9, fontWeight: 700, textTransform: 'uppercase', color: '#6B7280' }}>Valor Comprado (R$)</span>
          </div>
        </div>
        <div style={{ overflowX: 'auto' }}>
          <canvas ref={refBar2} width={periodo === 'mensal' ? 1200 : 840} height={300} style={{ width: '100%', height: 'auto', minWidth: periodo === 'mensal' ? 800 : 'auto' }} />
        </div>
      </div>

      {/* Modal de Detalhes do Dia */}
      {diaSelecionado && (
        <div style={{ position: 'fixed', inset: 0, zIndex: 800, background: 'rgba(0,0,0,.85)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }} className="fade-in">
          <div style={{ background: '#fff', borderRadius: 24, overflow: 'hidden', maxWidth: 600, width: '100%', maxHeight: '90vh', display: 'flex', flexDirection: 'column' }}>
            <div style={{ background: 'var(--ink)', padding: '24px 28px', color: '#fff', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                <h3 style={{ margin: 0, fontSize: 18, fontWeight: 800 }}>Detalhes de {new Date(diaSelecionado.date + 'T00:00:00').toLocaleDateString('pt-BR')}</h3>
                <p style={{ margin: 0, fontSize: 10, color: 'rgba(255,255,255,.5)', textTransform: 'uppercase', letterSpacing: '.1em', marginTop: 4 }}>{diaSelecionado.label}</p>
              </div>
              <button onClick={() => setDiaSelecionado(null)} style={{ background: 'rgba(255,255,255,.1)', border: 'none', color: '#fff', width: 32, height: 32, borderRadius: 999, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyCenter: 'center' }}><Icon name="x" size={20} /></button>
            </div>
            <div className="scroll-y" style={{ padding: 24, flex: 1 }}>
              {/* Seção Pedidos */}
              {diaSelecionado.pedidos && diaSelecionado.pedidos.length > 0 && (
                <div style={{ marginBottom: 24 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
                    <div style={{ width: 24, height: 24, borderRadius: 6, background: 'var(--red-light)', color: 'var(--red)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="clipboard-list" size={14} /></div>
                    <h4 style={{ margin: 0, fontSize: 12, fontWeight: 800, textTransform: 'uppercase', color: 'var(--ink)' }}>
                      Pedidos Realizados ({diaSelecionado.pedidos.length}) · {diaSelecionado.pedidos.reduce((a, p) => a + (p.items?.length || 0), 0)} peça(s) solicitada(s)
                    </h4>
                  </div>
                 <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                    {diaSelecionado.pedidos.map((r, i) => (
                      <div key={i} style={{ padding: 12, background: 'var(--smoke)', borderRadius: 12, border: '1px solid var(--border)' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: (r.items && r.items.length > 0) ? 8 : 0 }}>
                          <div>
                            <p style={{ fontSize: 11, fontWeight: 800, margin: 0 }}>OS #{r.os}</p>
                            <p style={{ fontSize: 9, color: 'var(--muted)', margin: 0 }}>{r.vehicleData?.modelo || '—'} • {r.responsavel}</p>
                          </div>
                          <span className="pill" style={{ fontSize: 8 }}>{r.items?.length || 0} itens</span>
                        </div>
                        {r.items && r.items.length > 0 && (
                          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                            {r.items.map((it, ii) => (
                              <span key={ii} style={{ fontSize: 9, fontWeight: 700, textTransform: 'uppercase', background: '#fff', border: '1px solid var(--border)', borderRadius: 6, padding: '3px 8px', color: 'var(--ink)' }}>
                                {it.quantity}× {it.description || '(sem descrição)'}
                              </span>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Seção Compras (se houver no dadosCompra para este dia) */}
              {(() => {
                const diaCompra = dadosCompra.dias.find(d => d.date === diaSelecionado.date);
                if (!diaCompra || diaCompra.itens.length === 0) return null;
                return (
                  <div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
                      <div style={{ width: 24, height: 24, borderRadius: 6, background: '#EDFAF3', color: '#0A6B34', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="shopping-bag" size={14} /></div>
                      <h4 style={{ margin: 0, fontSize: 12, fontWeight: 800, textTransform: 'uppercase', color: 'var(--ink)' }}>Itens Comprados ({diaCompra.itens.length})</h4>
                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      {diaCompra.itens.map((it, i) => (
                        <div key={i} style={{ padding: 12, background: '#fff', borderRadius: 12, border: '1px solid #AAE6C5', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <p style={{ fontSize: 11, fontWeight: 800, margin: 0, textTransform: 'uppercase', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{it.description}</p>
                            <p style={{ fontSize: 9, color: 'var(--muted)', margin: 0 }}>OS #{it.os} • {it.supplier || '—'}</p>
                          </div>
                          <div style={{ textAlign: 'right', marginLeft: 12 }}>
                            <p style={{ fontSize: 11, fontWeight: 800, color: '#059669', margin: 0 }}>{fmtBRL(it._preco)}</p>
                            <p style={{ fontSize: 8, color: 'var(--muted)', margin: 0 }}>{it.quantity} un.</p>
                          </div>
                        </div>
                      ))}
                      <div style={{ marginTop: 8, padding: '12px 16px', background: '#0D0D0D', borderRadius: 12, color: '#fff', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <span style={{ fontSize: 10, fontWeight: 800, textTransform: 'uppercase' }}>Total Comprado</span>
                        <span style={{ fontSize: 14, fontWeight: 800 }}>{fmtBRL(diaCompra.valor)}</span>
                      </div>
                    </div>
                  </div>
                );
              })()}
            </div>
            <div style={{ padding: '16px 24px', borderTop: '1px solid var(--border)', background: 'var(--smoke)' }}>
              <button onClick={() => setDiaSelecionado(null)} className="btn-primary" style={{ width: '100%' }}>Fechar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── App Principal ─────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[loggedIn,setLoggedIn]=useState(null);
  const[view,setView]=useState('request');
  const[subView,setSubView]=useState('pending');
  const[importData,setImportData]=useState([]);const[showImport,setShowImport]=useState(false);const[editing,setEditing]=useState(null);
  const[showChangePwd,setShowChangePwd]=useState(false);
const[gestSearch,setGestSearch]=useState('');
const[gestFab,setGestFab]=useState('');

  const{data:requests,loading:reqLoad}=useFirestore('requests');
  const{data:vehicles,loading:vehLoad}=useFirestore('vehicles');
  const{data:usersData,loading:usrLoad}=useFirestore('users');
  const[users,setUsers]=useState([]);
  const[initDone,setInitDone]=useState(false);

  useEffect(()=>{
    if(usrLoad)return;
    if(!initDone){
      INIT_USERS.forEach(async iu=>{
        const exists=usersData.find(d=>d.user.toLowerCase()===iu.user.toLowerCase());
        if(!exists){try{await col('users').add(iu);}catch(e){console.warn('seed user:',e);}}
      });
      setInitDone(true);
    }
    setUsers(usersData);
    // Atualiza loggedIn se os dados do usuário mudaram (ex: senha alterada)
    setLoggedIn(prev=>{
      if(!prev)return prev;
      const fresh=usersData.find(u=>u.user===prev.user);
      return fresh?{...prev,...fresh}:prev;
    });
  },[usersData,usrLoad]);

  useEffect(()=>{const u=auth.onAuthStateChanged(u=>{if(u)setUser(u);else auth.signInAnonymously();});return u;},[]);

 const role=loggedIn?.role||'solicitante';
  const isMaster=role==='master';
  const isAdmin=role==='admin'||isMaster;
  const isSol=canDo(role,'newReq');
  const canAccessFinalizacao=isMaster||loggedIn?.acessoFinalizacao===true;

  const addUser=async(u,p,r='solicitante')=>{
    // Só o Master 1 (Lucas.Sabino) pode criar masters
    if(r==='master'&&loggedIn?.user!==MASTER_USER)return alert('Somente o Master 1 pode criar usuários Master.');
    try{await col('users').add({user:u,pass:p,active:true,role:r});}catch{alert('Erro ao criar usuário.');}
  };
  const deleteUser=async(id,userObj)=>{
    // Ninguém pode excluir o próprio Master 1
    if(userObj?.user===MASTER_USER)return alert('O usuário Master 1 (Lucas.Sabino) não pode ser excluído.');
    // Só Master 1 pode excluir outros masters
    if(userObj?.role==='master'&&loggedIn?.user!==MASTER_USER)return alert('Somente o Master 1 pode excluir outros masters.');
    if(!window.confirm('Remover usuário "'+userObj?.user+'"?'))return;
    const docId=userObj?.id||id;
    if(!docId||docId===userObj?.user){setUsers(p=>p.filter(u=>u.id!==id&&u.user!==id));return;}
    try{await col('users').doc(docId).delete();}catch(e){console.error('deleteUser:',e);alert('Erro ao excluir: '+e.message);}
  };
  const toggleUser=async u=>{
    if(u.user===MASTER_USER)return; // Master 1 sempre ativo
    if(u.role==='master'&&loggedIn?.user!==MASTER_USER)return alert('Somente o Master 1 pode alterar outros masters.');
    const s=!(u.active!==false);
    if(!u.id){setUsers(p=>p.map(x=>x.user===u.user?{...x,active:s}:x));return;}
    try{await col('users').doc(u.id).update({active:s});}catch(e){console.error(e);alert('Erro ao alterar status.');}
  };
const changeRole=async(u,r)=>{
    if(u.user===MASTER_USER)return; // Master 1 nunca muda de role
    // Só Master 1 pode promover/rebaixar para/de master
    if((r==='master'||u.role==='master')&&loggedIn?.user!==MASTER_USER)return alert('Somente o Master 1 pode alterar a categoria Master.');
    if(!u.id){setUsers(p=>p.map(x=>x.user===u.user?{...x,role:r}:x));return;}
    try{await col('users').doc(u.id).update({role:r});}catch(e){console.error(e);alert('Erro ao alterar categoria.');}
  };
 const toggleFinalizacaoAccess=async(u)=>{
    if(!isMaster)return;
    const novo=!(u.acessoFinalizacao===true);
    if(!u.id){setUsers(p=>p.map(x=>x.user===u.user?{...x,acessoFinalizacao:novo}:x));return;}
    try{await col('users').doc(u.id).update({acessoFinalizacao:novo});}catch(e){console.error(e);alert('Erro ao alterar acesso à Finalização.');}
  };
  const cleanDuplicateUsers=async()=>{
    if(!isMaster)return;
    const groups={};
    users.forEach(u=>{
      const key=(u.user||'').trim().toLowerCase();
      if(!key)return;
      if(!groups[key])groups[key]=[];
      groups[key].push(u);
    });
    const toDelete=[];
    Object.values(groups).forEach(group=>{
      if(group.length<=1)return;
      const keep=group.find(u=>u.user===MASTER_USER)||group.find(u=>u.role==='master')||group[0];
      group.forEach(u=>{if(u.id&&u.id!==keep.id)toDelete.push(u);});
    });
    if(!toDelete.length){alert('Nenhum usuário duplicado encontrado.');return;}
    if(!window.confirm(`Remover ${toDelete.length} conta(s) de usuário duplicada(s)? Esta ação é irreversível.`))return;
    try{
      for(const u of toDelete)await col('users').doc(u.id).delete();
      alert(`${toDelete.length} conta(s) duplicada(s) removida(s) com sucesso.`);
    }catch(e){alert('Erro ao limpar duplicados: '+e.message);}
  };

  const defaultViewForRole=(r)=>{if(r==='leitor')return 'status';return 'request';};
  const login=u=>{
    const found=users.find(x=>x.user.toLowerCase()===u.user.toLowerCase()&&x.pass===u.pass);
    if(found){setLoggedIn(found);setView(defaultViewForRole(found.role));}
  };
  const logout=()=>{setLoggedIn(null);setView('request');};

  const handlePaste=e=>{
    const text=e.clipboardData.getData('text');const lines=text.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return;
    const headers=lines[0].split(/[,\t]/).map(h=>h.trim().toUpperCase());
    const fi=t=>headers.findIndex(h=>t.some(x=>h.includes(x)));
    const[iO,iM,iF,iC,iCh,iE,iL]=[fi(['OS']),fi(['MODELO']),fi(['FABRICANTE','MARCA']),fi(['COR']),fi(['CHASSI']),fi(['ETAPA']),fi(['LOCALIZA'])];
    const rows=(iO!==-1?lines.slice(1):lines).map(l=>{const v=l.split(/[,\t]/);const g=(i,fb)=>(i!==-1?v[i]:v[fb])?.trim()||'';return{os:g(iO,0),modelo:g(iM,1),fabricante:g(iF,2),cor:g(iC,3),chassi:g(iCh,4),etapa:g(iE,5),localizacao:g(iL,6)};}).filter(r=>r.os);
    setImportData(rows);
  };
  const commitImport=async()=>{
    if(!importData.length)return;const batch=db.batch();
    importData.forEach(v=>batch.set(col('vehicles').doc(v.os),v));
    await batch.commit();alert('Sucesso! '+importData.length+' veículos importados.');setImportData([]);setShowImport(false);
  };

  // Salva array completo de items no Firestore — chamado só ao confirmar
  const compressBase64=(b64,maxPx=600,quality=0.45)=>new Promise(resolve=>{
    if(!b64||!b64.startsWith('data:image')){resolve(b64);return;}
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>h&&w>maxPx){h=Math.round(h*maxPx/w);w=maxPx;}
      else if(h>maxPx){w=Math.round(w*maxPx/h);h=maxPx;}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>resolve(b64);
    img.src=b64;
  });

 const saveItems=async(reqId,newItems,os)=>{
    const req=requests.find(r=>r.id===reqId);if(!req)return;

    // Comprime fotos e remove os campos auxiliares (_responsavel/_timestamp/_reqId)
    const compressedItems=await Promise.all(newItems.map(async it=>{
      const{_responsavel,_timestamp,_reqId,...clean}=it;
      if(!clean.photo)return clean;
      const photo=await compressBase64(clean.photo,600,0.45);
      return{...clean,photo};
    }));

    // Reagrupa os itens pelo documento Firestore de origem, pois uma OS pode
    // estar espalhada em mais de um documento (inclusão adicional, Finalização, etc.)
    const grupos={};
    compressedItems.forEach((it,idx)=>{
      const origem=newItems[idx]._reqId||reqId;
      if(!grupos[origem])grupos[origem]=[];
      grupos[origem].push(it);
    });

    const alvoOS=os||req.os;
    const todosDocs=requests.filter(r=>String(r.os).trim()===String(alvoOS).trim());

    try{
      for(const doc of todosDocs){
        const itensDoDoc=grupos[doc.id]||[];
        if(itensDoDoc.length===0){
          // todos os itens deste documento foram excluídos → apaga o documento
          await col('requests').doc(doc.id).delete();
          continue;
        }
        let gs='Concluído';
        if(itensDoDoc.some(it=>it.status==='Pendente'))gs='Pendente';
        else if(itensDoDoc.some(it=>it.status==='Em Cotação'))gs='Em Cotação';
        else if(itensDoDoc.some(it=>it.status==='Comprado'))gs='Comprado';
        else if(itensDoDoc.some(it=>it.status==='Doado'))gs='Doado';
        const payload=stripUndefined(itensDoDoc);
        const estimado=JSON.stringify(payload).length;
        if(estimado>900000){
          alert(`Documento da OS ${alvoOS} ainda grande (~${Math.round(estimado/1024)}KB). Remova algumas fotos ou reduza itens.`);
          return;
        }
        await col('requests').doc(doc.id).update({items:payload,status:gs});
      }
    }catch(e){console.error('Erro ao salvar:',e);alert('Erro ao salvar: '+e.message);}
  };

  // ── Todos os hooks ANTES de qualquer return condicional ──────────────────
  
 const hoje=new Date();hoje.setHours(0,0,0,0);
  const excedentesCount=requests.reduce((a,r)=>a+(r.items||[]).filter(it=>it.excedente===true).length,0);
  const tabCounts={

    overdue:requests.filter(r=>r.items?.some(it=>{
      if(it.status!=='Comprado'||!it.deliveryDate)return false;
      const prazo=new Date(it.deliveryDate+'T00:00:00');
      return prazo<hoje;
    })).length,
    completed:requests.filter(r=>r.items?.every(it=>it.status==='Concluído'||it.status==='Doado')).length,
    donated:requests.filter(r=>r.items?.some(it=>it.status==='Doado')).length,
  };

  // Lidas compartilhadas via Firestore para badge no menu
  const{data:lidasNavData}=useFirestore('lidas');
  const lidasNav=useMemo(()=>{
    if(!lidasNavData?.length)return[];
    return lidasNavData.flatMap(d=>d.uids||[]);
  },[lidasNavData]);
  const chegadasNaoLidas=useMemo(()=>{
    let count=0;
    requests.forEach(req=>{
      (req.items||[]).forEach(it=>{
        if(!it.actualDeliveryDate)return;
        const uid=String(req.os)+'_'+String(it.id||it.description);
        if(!lidasNav.includes(uid))count++;
      });
    });
    return count;
  },[requests,lidasNav]);

const navItems=[
    isSol&&{key:'request',icon:'plus-circle',label:'Nova Peça'},

    {key:'chegadas',icon:'package-check',label:'Chegadas',badge:chegadasNaoLidas},
    canAccessFinalizacao&&{key:'finalizacao',icon:'clipboard-check',label:'Finalização'},
    canDo(role,'donor')&&{key:'donor',icon:'git-merge',label:'Doações'},
    canDo(role,'manage')&&{key:'admin',icon:'settings',label:'Gestão'},
    (isMaster||isAdmin)&&{key:'dashboard',icon:'bar-chart-2',label:'Análises'},
    (loggedIn?.user===MASTER_USER||loggedIn?.user==='Matheus.Ransi')&&{key:'resumo',icon:'presentation',label:'Resumo Reunião'},
  ].filter(Boolean);

  const loading=reqLoad||vehLoad||usrLoad;

  // ── Return condicional APÓS todos os hooks ────────────────────────────────
  if(!loggedIn)return <LoginView onLogin={login} usersList={users} loadingUsers={usrLoad}/>;

      <nav style={{display:'none',width:220,background:'#0D0D0D',padding:'20px 14px',flexDirection:'column',gap:4,flexShrink:0}} id="desktop-nav">
        <style>{`@media(min-width:768px){#desktop-nav{display:flex!important}}`}</style>
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'6px 6px 20px',borderBottom:'1px solid rgba(255,255,255,.08)',marginBottom:8}}>
          <div style={{width:36,height:36,background:'var(--red)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,boxShadow:'0 4px 12px rgba(220,31,31,.3)'}}><Icon name="shopping-cart" size={18}/></div>
          <div><p style={{fontSize:7,fontWeight:700,textTransform:'uppercase',letterSpacing:'.14em',color:'rgba(255,255,255,.3)',margin:0,lineHeight:1}}>Portal Compras</p><h1 style={{fontSize:20,fontWeight:800,margin:0,lineHeight:1.1,color:'#fff'}}>VRZ</h1></div>
        </div>
        <div style={{flex:1,display:'flex',flexDirection:'column',gap:2}}>
          {navItems.map(n=>(
            <button key={n.key} onClick={()=>setView(n.key)} className={`nav-item ${view===n.key?'active':''}`}>
              <div className="nav-icon" style={{position:'relative'}}>

                {n.badge>0&&<span style={{position:'absolute',top:-4,right:-4,background:'var(--red)',color:'#fff',borderRadius:999,fontSize:7,fontWeight:800,minWidth:14,height:14,display:'flex',alignItems:'center',justifyContent:'center',padding:'0 3px',border:'1.5px solid #0D0D0D'}}>{n.badge>99?'99+':n.badge}</span>}
              </div>
              {n.label}
              {n.badge>0&&view!==n.key&&<span className="pulse-beacon" style={{marginLeft:'auto',width:7,height:7,borderRadius:'50%',background:'var(--red)',display:'inline-block',flexShrink:0}}/>}
            </button>

        </div>
        <div style={{background:'rgba(255,255,255,.06)',borderRadius:12,padding:12,border:'1px solid rgba(255,255,255,.1)'}}>
          <p style={{fontSize:7,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'rgba(255,255,255,.3)',margin:'0 0 4px'}}>Logado como</p>
