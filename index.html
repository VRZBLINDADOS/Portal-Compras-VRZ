                <div className="scroll-y" style={{maxHeight:200,display:'flex',flexDirection:'column',gap:8}}>
                  {filteredOutros.map(v=>(
                    <div key={v.os} onClick={()=>setSourceOS(String(v.os))} className={`donor-card ${String(v.os)===sourceOS?'selected':''}`} style={{padding:'10px 14px'}}>
                      <div style={{display:'flex',alignItems:'center',gap:10}}>
                        <input type="radio" name="sourceOS" checked={String(v.os)===sourceOS} onChange={()=>setSourceOS(String(v.os))} style={{width:15,height:15,accentColor:'var(--red)',flexShrink:0}}/>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{display:'flex',alignItems:'center',gap:8}}>
                            <span style={{fontSize:13,fontWeight:800}}>OS #{v.os}</span>
                            <span style={{fontSize:8,fontWeight:700,background:'var(--smoke)',color:'var(--muted)',padding:'2px 7px',borderRadius:999,textTransform:'uppercase'}}>{v.etapa||v.localizacao||'—'}</span>
                          </div>
                          <p style={{margin:0,fontSize:9,color:'var(--muted)',textTransform:'uppercase',fontWeight:600}}>{v.modelo} · <span className="mono">{v.chassi}</span></p>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
            {filteredRecebidos.length===0&&filteredOutros.length===0&&(
              <div style={{textAlign:'center',padding:'32px 0',color:'var(--muted)'}}>
                <Icon name="search" size={28} style={{margin:'0 auto 10px',display:'block'}}/>
                <p style={{fontSize:10,fontWeight:700,textTransform:'uppercase',margin:0}}>Nenhum veículo do mesmo modelo encontrado</p>
                <p style={{fontSize:9,margin:'4px 0 0'}}>Modelo: {targetRequest?.vehicleData?.modelo}</p>
              </div>
            )}
            <div style={{marginBottom:16}}>
              <div className="divider" style={{marginBottom:12}}>
                <span style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)',whiteSpace:'nowrap',flexShrink:0}}>Ou digitar outra OS</span>
              </div>
              <input type="text" inputMode="numeric" placeholder="Número da OS doadora" className="input" style={{fontSize:14,fontWeight:700}} value={sourceOS} onChange={e=>setSourceOS(sanitize(e.target.value))}/>
            </div>
            {sourceOS&&(
              <div style={{background:'var(--ink)',borderRadius:12,padding:14,color:'#fff',marginBottom:16}}>
                <p style={{fontSize:7,fontWeight:800,textTransform:'uppercase',letterSpacing:'.12em',color:'rgba(255,255,255,.3)',margin:'0 0 10px'}}>Resumo da operação</p>
                <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:8,alignItems:'center',textAlign:'center'}}>
                  <div style={{background:'rgba(255,255,255,.05)',borderRadius:10,padding:'10px 8px'}}>
                    <p style={{fontSize:7,color:'rgba(255,255,255,.3)',fontWeight:700,textTransform:'uppercase',margin:'0 0 4px'}}>OS Receptora</p>
                    <p style={{fontSize:22,fontWeight:800,color:'#FFAAAA',margin:0}}>#{targetOS}</p>
                    <p style={{fontSize:9,color:'rgba(255,255,255,.4)',margin:0}}>{targetRequest?.vehicleData?.modelo}</p>
                  </div>
                  <div style={{textAlign:'center'}}><Icon name="arrow-right" size={18}/><p style={{fontSize:7,color:'rgba(255,255,255,.3)',fontWeight:700,textTransform:'uppercase',margin:'4px 0 0'}}>{selectedItems.length} peça(s)</p></div>
                  <div style={{background:'rgba(255,255,255,.05)',borderRadius:10,padding:'10px 8px'}}>
                    <p style={{fontSize:7,color:'rgba(255,255,255,.3)',fontWeight:700,textTransform:'uppercase',margin:'0 0 4px'}}>OS Doadora</p>
                    <p style={{fontSize:22,fontWeight:800,color:'#fff',margin:0}}>#{sourceOS}</p>
                    <p style={{fontSize:9,color:'rgba(255,255,255,.4)',margin:0}}>{sourceVehicle?.modelo||'—'}</p>
                  </div>
                </div>
              </div>
            )}
            <div style={{display:'flex',gap:10}}>
              <button onClick={()=>setStep(2)} className="btn-ghost" style={{flex:1}}>← Voltar</button>
              <button onClick={handleConfirm} disabled={!sourceOS||processing} className="btn-primary" style={{flex:2,padding:13}}>
                {processing?<Icon name="refresh-cw" size={15} className="spin"/>:<Icon name="check" size={15}/>}
                {processing?'Processando...':'Confirmar Transferência'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Request Form ──────────────────────────────────────────────────────────
function RequestForm({user,loggedInUser,vehiclesDB,requests}){
  const[os,setOs]=useState('');const[vehicle,setVehicle]=useState(null);const[unidade,setUnidade]=useState('Unidade 1');
  const[items,setItems]=useState([{id:Date.now(),description:'',quantity:1,photo:null,status:'Pendente'}]);
  const[submitting,setSubmitting]=useState(false);const[done,setDone]=useState(false);
  const[semFoto,setSemFoto]=useState([]);const[showFoto,setShowFoto]=useState(false);
  const[showDup,setShowDup]=useState(false);const[dups,setDups]=useState([]);const[compressing,setCompressing]=useState(false);

  const onOSBlur=()=>{const t=String(os).trim();if(!t)return;const f=vehiclesDB.find(v=>String(v.os).trim()===t);if(f)setVehicle(f);else{setVehicle(null);alert('OS não cadastrada.');}};
const compressImageToBlob=async(file)=>{
    return new Promise(resolve=>{
      const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const ctx=c.getContext('2d');let w=img.width,h=img.height;const mx=1024;if(w>h&&w>mx){h*=mx/w;w=mx;}else if(h>mx){w*=mx/h;h=mx;}c.width=w;c.height=h;ctx.drawImage(img,0,0,w,h);c.toBlob(b=>resolve(b),'image/jpeg',.7);};img.src=e.target.result;};r.readAsDataURL(file);
    });
  };
const handleImageUpload=async(itemId,file)=>{
    setCompressing(true);
    try{
      const c=await new Promise((resolve,reject)=>{
        const timeoutId=setTimeout(()=>reject(new Error('Tempo esgotado ao processar a imagem.')),15000);
        const r=new FileReader();
        r.onerror=()=>{clearTimeout(timeoutId);reject(new Error('Falha ao ler o arquivo.'));};
        r.onload=e=>{
          const img=new Image();
          img.onerror=()=>{clearTimeout(timeoutId);reject(new Error('Formato de imagem não suportado.'));};
          img.onload=()=>{
            clearTimeout(timeoutId);
            const c=document.createElement('canvas');const ctx=c.getContext('2d');
            let w=img.width,h=img.height;const mx=700;
            if(w>h&&w>mx){h*=mx/w;w=mx;}else if(h>mx){w*=mx/h;h=mx;}
            c.width=w;c.height=h;ctx.drawImage(img,0,0,w,h);
            resolve(c.toDataURL('image/jpeg',.55));
          };
          img.src=e.target.result;
        };
        r.readAsDataURL(file);
      });
      setItems(p=>p.map(i=>i.id===itemId?{...i,photo:c}:i));
      setSemFoto(p=>p.filter(id=>id!==itemId));
    }catch(err){alert('Não foi possível processar essa imagem: '+(err?.message||'erro desconhecido')+'. Tente tirar a foto novamente ou escolher outra da galeria.');}
    setCompressing(false);
  };
const salvar=async()=>{
    setSubmitting(true);
    try{
      const LIMITE=13;
      if(items.length>LIMITE){
        const partes=[];
        for(let i=0;i<items.length;i+=LIMITE)partes.push(items.slice(i,i+LIMITE));
        const loteId=String(Date.now())+Math.floor(Math.random()*99999);
        for(let p=0;p<partes.length;p++){
          await col('requests').add({os,responsavel:loggedInUser.user,vehicleData:vehicle,unidade,items:partes[p],timestamp:Date.now()+(p*10),status:'Pendente',userId:user?.uid||'anon',parte:p+1,totalPartes:partes.length,loteId});
        }
      }else{
        await col('requests').add({os,responsavel:loggedInUser.user,vehicleData:vehicle,unidade,items,timestamp:Date.now(),status:'Pendente',userId:user?.uid||'anon'});
      }
      setDone(true);setShowDup(false);
    }
    catch{alert('Erro ao salvar pedido.');}
    setSubmitting(false);
  };
  const submit=async e=>{
    e.preventDefault();
    if(!os.trim())return alert('OS obrigatória.');
    if(!vehicle)return alert('OS não cadastrada no sistema.');
    if(items.some(i=>!i.description.trim()))return alert('Todos os itens precisam de descrição.');
    const sf=items.filter(i=>!i.photo).map(i=>i.id);
    if(sf.length){setSemFoto(sf);setShowFoto(true);return;}
    const ex=requests.filter(r=>String(r.os).trim()===String(os).trim());
    if(ex.length){setDups(ex);setShowDup(true);return;}
    await salvar();
  };

  const existingItemsForOS=useMemo(()=>{
    if(!os.trim())return[];
    const matching=requests.filter(r=>String(r.os).trim()===os.trim());
    const all=[];const seen=new Set();
    matching.forEach(r=>(r.items||[]).forEach(it=>{const k=it.id||it.description;if(!seen.has(k)){seen.add(k);all.push(it);}}));
    return all;
  },[requests,os]);

  if(done)return(
    <div style={{maxWidth:420,margin:'0 auto',background:'#fff',borderRadius:20,border:'1.5px solid var(--border)',padding:40,textAlign:'center'}} className="fade-up">
      <div style={{width:64,height:64,background:'#EDFAF3',borderRadius:18,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 20px'}}><Icon name="check-circle" size={32}/></div>
      <h2 style={{fontSize:24,fontWeight:800,margin:'0 0 8px'}}>Pedido Enviado!</h2>
      <p style={{fontSize:12,color:'var(--muted)',marginBottom:24}}>OS #{os} — {unidade}</p>
      <button onClick={()=>{setDone(false);setOs('');setVehicle(null);setUnidade('Unidade 1');setItems([{id:Date.now(),description:'',quantity:1,photo:null,status:'Pendente'}]);}} className="btn-primary" style={{width:'100%',padding:14}}>Nova Solicitação</button>
    </div>
  );

  return(
    <div className="fade-up" style={{paddingBottom:16}}>
      {showFoto&&(
        <div style={{position:'fixed',inset:0,zIndex:600,background:'rgba(0,0,0,.8)',display:'flex',alignItems:'center',justifyContent:'center',padding:16,overflowY:'auto'}}>
          <div style={{background:'#fff',borderRadius:20,overflow:'hidden',maxWidth:360,width:'100%'}}>
            <div style={{background:'var(--red)',padding:'24px 20px',textAlign:'center',color:'#fff'}}>
              <div style={{width:52,height:52,background:'rgba(255,255,255,.2)',borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px'}}><Icon name="camera" size={26}/></div>
              <h3 style={{margin:0,fontSize:17,fontWeight:800}}>Foto Obrigatória</h3>
            </div>
            <div style={{padding:20}}><p style={{fontSize:12,color:'var(--muted)',textAlign:'center',marginBottom:16}}>{semFoto.length} item(s) sem foto.</p><button onClick={()=>setShowFoto(false)} className="btn-primary" style={{width:'100%'}}>Entendido</button></div>
          </div>
        </div>
      )}
      {showDup&&(
        <div style={{position:'fixed',inset:0,zIndex:600,background:'rgba(0,0,0,.85)',display:'flex',alignItems:'center',justifyContent:'center',padding:16,overflowY:'auto'}}>
          <div style={{background:'#fff',borderRadius:20,overflow:'hidden',maxWidth:560,width:'100%'}}>
            <div style={{background:'var(--ink)',padding:'20px 24px',display:'flex',alignItems:'center',gap:14,color:'#fff',borderBottom:'4px solid var(--red)'}}>
              <div style={{width:44,height:44,background:'var(--red)',borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name="alert-triangle" size={20}/></div>
              <div><h3 style={{margin:0,fontSize:16,fontWeight:800}}>OS já possui pedido!</h3><p style={{margin:0,fontSize:9,color:'rgba(255,255,255,.4)',textTransform:'uppercase',letterSpacing:'.08em',marginTop:2}}>OS #{os} — Será inclusão adicional</p></div>
            </div>
            <div style={{padding:16,maxHeight:'40vh',overflowY:'auto'}}>
              <p style={{fontSize:10,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',marginBottom:10}}>Peças já cadastradas nesta OS:</p>
              <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                {existingItemsForOS.map((it,j)=>(
                  <div key={j} style={{display:'flex',alignItems:'center',gap:6,background:'var(--smoke)',border:'1px solid var(--border)',borderRadius:8,padding:'6px 10px'}}>
                    {it.photo&&<img src={it.photo} style={{width:28,height:28,borderRadius:6,objectFit:'cover'}}/>}
                    <div><p style={{fontSize:9,fontWeight:700,textTransform:'uppercase',margin:0}}>{it.description}</p><StatusBadge status={it.status||'Pendente'} orig={it.statusOriginal}/></div>
                  </div>
                ))}
              </div>
            </div>
            <div style={{padding:16,background:'var(--smoke)',borderTop:'1px solid var(--border)',display:'flex',gap:10}}>
              <button onClick={()=>{setShowDup(false);setDups([]);}} className="btn-ghost" style={{flex:1}}>Cancelar</button>
              <button onClick={salvar} disabled={submitting} className="btn-primary" style={{flex:1}}>
                {submitting?<Icon name="refresh-cw" size={14} className="spin"/>:<Icon name="check" size={14}/>} Incluir mesmo assim
              </button>
            </div>
          </div>
        </div>
      )}

      <div style={{marginBottom:20}}>
        <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.15em',color:'var(--red)',marginBottom:4}}>Operacional VRZ</p>
        <h2 style={{fontSize:32,fontWeight:800,margin:0,letterSpacing:'-.02em'}}>Nova Requisição</h2>
      </div>

      <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:16}}>
        <div className="card">
          <div style={{padding:20,display:'flex',flexDirection:'column',gap:16}}>
            <div>
              <label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.12em',color:'var(--muted)',display:'block',marginBottom:6}}>Número da OS</label>
              <input type="text" inputMode="numeric" value={os} onChange={e=>setOs(sanitize(e.target.value))} onBlur={onOSBlur} placeholder="Nº da OS" className="input" style={{fontSize:22,fontWeight:800}} required/>
            </div>
            <div>
              <label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.12em',color:'var(--muted)',display:'block',marginBottom:6}}>Unidade</label>
              <select value={unidade} onChange={e=>setUnidade(e.target.value)} className="input" style={{fontWeight:700,appearance:'auto'}}>{UNIDADES.map(u=><option key={u} value={u}>{u}</option>)}</select>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:10,background:'var(--smoke)',border:'1px solid var(--border)',borderRadius:10,padding:'10px 14px'}}>
              <div style={{width:36,height:36,borderRadius:9,background:'var(--red-light)',border:'1px solid #FFBDBD',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name="user" size={15}/></div>
              <div style={{flex:1,minWidth:0}}>
                <p style={{fontSize:8,fontWeight:700,textTransform:'uppercase',color:'var(--muted)',margin:0}}>Solicitante</p>
                <p style={{fontSize:13,fontWeight:700,textTransform:'uppercase',margin:0}}>{loggedInUser.user}</p>
              </div>
              <RoleBadge role={loggedInUser.role}/>
            </div>
          </div>
          <div style={{borderTop:'2px solid var(--border)',background:'var(--ink)',padding:20,minHeight:100,display:'flex',alignItems:'center'}}>
            {vehicle?(
              <div style={{width:'100%'}}>
                <p style={{fontSize:7,fontWeight:700,textTransform:'uppercase',letterSpacing:'.12em',color:'rgba(255,255,255,.3)',margin:'0 0 4px'}}>Veículo encontrado</p>
                <p style={{fontSize:22,fontWeight:800,textTransform:'uppercase',color:'#fff',margin:'0 0 12px'}}>{vehicle.modelo}</p>
               <div className="grid-3col" style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:10}}>
                  {[['Etapa',vehicle.etapa],['Cor',vehicle.cor],['Local',vehicle.localizacao]].map(([l,v])=>(
                    <div key={l}><p style={{fontSize:7,color:'rgba(255,255,255,.3)',fontWeight:700,textTransform:'uppercase',margin:'0 0 2px'}}>{l}</p><p style={{fontSize:11,color:'rgba(255,255,255,.85)',fontWeight:600,margin:0,textTransform:'uppercase'}}>{v||'—'}</p></div>
                  ))}
                </div>
                <div style={{background:'rgba(255,255,255,.06)',borderRadius:8,padding:'8px 12px',textAlign:'center',border:'1px solid rgba(255,255,255,.08)'}}>
                  <p style={{fontSize:7,color:'rgba(255,255,255,.3)',fontWeight:700,textTransform:'uppercase',margin:'0 0 2px'}}>Chassi</p>
                  <p className="mono" style={{fontSize:13,fontWeight:700,color:'rgba(255,255,255,.9)',margin:0,userSelect:'all'}}>{vehicle.chassi}</p>
                </div>
                {existingItemsForOS.length>0&&(
                  <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid rgba(255,255,255,.1)'}}>
                    <p style={{fontSize:7,fontWeight:700,textTransform:'uppercase',color:'rgba(255,255,255,.3)',marginBottom:6}}>Peças já cadastradas nesta OS:</p>
                    <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                      {existingItemsForOS.map((it,i)=>(
                        <span key={i} style={{fontSize:8,fontWeight:700,textTransform:'uppercase',padding:'2px 8px',borderRadius:6,background:'rgba(255,255,255,.08)',color:'rgba(255,255,255,.6)',border:'1px solid rgba(255,255,255,.12)'}}>{it.quantity}× {it.description} · <span style={{opacity:.6}}>{it.status}</span></span>
                      ))}

                <p style={{fontSize:9,color:'rgba(255,255,255,.25)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',margin:0}}>Digite a OS para carregar o veículo</p>

        </div>
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <h3 style={{margin:0,fontSize:13,fontWeight:800,textTransform:'uppercase',display:'flex',alignItems:'center',gap:8}}><Icon name="package" size={16}/> Peças</h3>

          </div>

                      <label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--red)',display:'block',marginBottom:6}}>📷 Foto (Obrigatória)</label>
                      {it.photo?(
                        <div style={{position:'relative',borderRadius:10,overflow:'hidden',border:'1.5px solid #AAE6C5',height:80}}>
                          <img src={it.photo} style={{height:'100%',width:'100%',objectFit:'cover'}} alt="Peça"/>
                          <button type="button" onClick={()=>setItems(p=>p.map(i=>i.id===it.id?{...i,photo:null}:i))} style={{position:'absolute',inset:0,background:'rgba(0,0,0,.5)',display:'flex',alignItems:'center',justifyContent:'center',border:'none',cursor:'pointer',color:'#fff',fontSize:10,fontWeight:700,opacity:0,transition:'opacity .2s'}} onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=0}>✕ Trocar</button>
                          <div style={{position:'absolute',top:6,right:6,background:'#059669',color:'#fff',fontSize:7,fontWeight:800,padding:'2px 7px',borderRadius:999}}>✓ OK</div>
                        </div>
                      ):(
                        <label style={{height:80,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:6,border:`1.5px dashed ${semFoto.includes(it.id)?'var(--red)':'var(--border)'}`,borderRadius:10,cursor:compressing?'not-allowed':'pointer',background:semFoto.includes(it.id)?'var(--red-light)':'var(--smoke)',transition:'all .15s',position:'relative'}}
                            onMouseEnter={e=>{if(!compressing){e.currentTarget.style.borderColor='var(--red)';e.currentTarget.style.background='var(--red-light)';}}}
                            onMouseLeave={e=>{e.currentTarget.style.borderColor=semFoto.includes(it.id)?'var(--red)':'var(--border)';e.currentTarget.style.background=semFoto.includes(it.id)?'var(--red-light)':'var(--smoke)';}}>
                          {compressing?<Icon name="loader" size={22} className="spin"/>:<Icon name="camera" size={22}/>}
                          <span style={{fontSize:9,fontWeight:800,textTransform:'uppercase',color:semFoto.includes(it.id)?'var(--red)':'var(--muted)',textAlign:'center',lineHeight:1.3}}>{compressing?'Processando...':'Adicionar foto'}</span>
                          <span style={{fontSize:7,color:'var(--muted)',fontWeight:600,textAlign:'center'}}>Câmera ou galeria</span>
                          {/* sem capture= para deixar o sistema perguntar câmera ou galeria */}
                          <input type="file" accept="image/*" onChange={e=>{if(e.target.files[0])handleImageUpload(it.id,e.target.files[0]);}} style={{position:'absolute',inset:0,opacity:0,cursor:compressing?'not-allowed':'pointer',width:'100%',height:'100%'}} disabled={compressing}/>
                        </label>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
        <button disabled={submitting||!vehicle||compressing} className="btn-primary" style={{width:'100%',padding:16,fontSize:12}}>
          {submitting?<Icon name="refresh-cw" size={18} className="spin"/>:<><Icon name="send" size={16}/> Enviar Pedido</>}
        </button>
      </form>
    </div>
  );
}

// ── Status View — MELHORIA 1: etapa + localização ao lado da OS ───────────
function StatusView({requests,loggedInUser,vehicles}){
  const[search,setSearch]=useState('');
  const[unidadeFilter,setUnidadeFilter]=useState('todas');
  const[statusTab,setStatusTab]=useState('geral');
  const[toDelete,setToDelete]=useState(null);
  const[pdfConfirm,setPdfConfirm]=useState(null);
 const role=loggedInUser?.role||'solicitante';
  const canDelete=canDo(role,'delete')&&!ADMIN_ESPECIAL.includes(loggedInUser?.user);

  // Cria mapa de veículos por OS para lookup rápido
  const vehicleMap=useMemo(()=>{
    const m={};vehicles.forEach(v=>{m[String(v.os).trim()]=v;});return m;
  },[vehicles]);

  const merged=useMemo(()=>mergeByOS(requests.filter(r=>!r.importado)),[requests]);

  const filtered=useMemo(()=>merged.filter(r=>{
    const t=search.toLowerCase();
    const mb=String(r.os||'').toLowerCase().includes(t)||String(r.responsavel||'').toLowerCase().includes(t)||String(r.vehicleData?.modelo||'').toLowerCase().includes(t)||String(r.vehicleData?.chassi||'').toLowerCase().includes(t);
    const mu=unidadeFilter==='todas'||r.unidade===unidadeFilter;
    let ms=true;
    if(statusTab==='pendente')ms=r.items?.some(it=>it.status==='Pendente');
    else if(statusTab==='cotacao')ms=r.items?.some(it=>it.status==='Em Cotação');
    else if(statusTab==='comprado')ms=r.items?.some(it=>it.status==='Comprado');
    else if(statusTab==='concluido')ms=r.items?.every(it=>it.status==='Concluído'||it.status==='Doado');
    else if(statusTab==='doado')ms=r.items?.some(it=>it.status==='Doado'||it.receivedFrom||it.donatedTo);
    return mb&&mu&&ms;
  }),[merged,search,unidadeFilter,statusTab]);

  const counts=useMemo(()=>({
    geral:merged.length,
    pendente:merged.filter(r=>r.items?.some(it=>it.status==='Pendente')).length,
    cotacao:merged.filter(r=>r.items?.some(it=>it.status==='Em Cotação')).length,
    comprado:merged.filter(r=>r.items?.some(it=>it.status==='Comprado')).length,
    concluido:merged.filter(r=>r.items?.every(it=>it.status==='Concluído'||it.status==='Doado')).length,
    doado:merged.filter(r=>r.items?.some(it=>it.status==='Doado'||it.receivedFrom||it.donatedTo)).length,
  }),[merged]);

const exportCSV=()=>{
    const rows=[['Data Solicit.','OS','Unidade','Chassi','Veiculo','Peca','Qtd','Status','Valor','Loja','Data Compra','Prazo Entrega','Entrega Real'].join(';')];
    filtered.forEach(r=>(r.items||[]).forEach(it=>{
      const preco = parsePrice(it.price);
      const precoFormatado = preco > 0 ? preco.toLocaleString('pt-BR', {minimumFractionDigits: 2}) : '0,00';
      const dataCompra = it.boughtAt ? new Date(it.boughtAt + 'T00:00:00').toLocaleDateString('pt-BR') : '-';
      const dataSolicit = r.timestamp ? new Date(r.timestamp).toLocaleDateString('pt-BR') : '-';
      const prazoEntrega = it.deliveryDate ? new Date(it.deliveryDate + 'T00:00:00').toLocaleDateString('pt-BR') : '-';
      const entregaReal = it.actualDeliveryDate ? new Date(it.actualDeliveryDate + 'T00:00:00').toLocaleDateString('pt-BR') : '-';
      
      rows.push([
        dataSolicit, 
        r.os, 
        r.unidade||'Unidade 1', 
        r.vehicleData?.chassi||'-', 
        r.vehicleData?.modelo||'-', 
        it.description||'-', 
        it.quantity||1, 
        it.statusOriginal||it.status||'Pendente', 
        precoFormatado, 
        it.supplier||'-', 
        dataCompra, 
        prazoEntrega, 
        entregaReal
      ].join(';'));
    }));
    const blob=new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Relatorio_VRZ_${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.csv`;a.click();
  };

  // Status Semáforo — 1 linha por OS, todas as peças concatenadas em UMA célula, para uso com PROCV
  const csvCell=(v)=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const exportSemaforo=()=>{
    const rows=[[csvCell('OS'),csvCell('Unidade'),csvCell('Veiculo'),csvCell('Chassi'),csvCell('Status Semáforo')].join(';')];
    filtered.forEach(r=>{
      const linhas=(r.items||[]).map(it=>{
        const desc=it.description||'(sem descrição)';
        const qtd=it.quantity||1;
        let situacao='Pendente';
        if(it.status==='Doado'){
          situacao=it.receivedFrom?`Doado (recebido da OS ${it.receivedFrom})`:`Doado (transferido para OS ${it.donatedTo||'?'})`;
        }else if(it.status==='Concluído'){
          const dt=it.actualDeliveryDate?new Date(it.actualDeliveryDate+'T00:00:00').toLocaleDateString('pt-BR'):'';
          situacao='Entregue'+(dt?` (Entrega: ${dt})`:'');
        }else if(it.status==='Comprado'){
          const dt=it.deliveryDate?new Date(it.deliveryDate+'T00:00:00').toLocaleDateString('pt-BR'):'';
          situacao='Comprado'+(dt?` (Entrega: ${dt})`:'');
        }else if(it.status==='Em Cotação'){
          situacao='Pendente (Em Cotação)';
        }else{
          situacao='Pendente';
        }
        return `${qtd}x ${desc} — ${situacao}`;
      });
      const celula=linhas.join('\n');
      rows.push([csvCell(r.os),csvCell(r.unidade||'Unidade 1'),csvCell(r.vehicleData?.modelo||'-'),csvCell(r.vehicleData?.chassi||'-'),csvCell(celula)].join(';'));
    });
    const blob=new Blob(['\uFEFF'+rows.join('\r\n')],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Status_Semaforo_VRZ_${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.csv`;a.click();
  };

 const exportPDF=async (req,comFoto=true)=>{
    const{jsPDF}=window.jspdf;const doc=new jsPDF();
    doc.setFontSize(16);doc.text('Solicitacao de Pecas - VRZ',10,15);doc.setFontSize(9);
    doc.text('OS: #'+req.os,10,24);doc.text('Unidade: '+(req.unidade||'Unidade 1'),10,30);
    doc.text('Data: '+new Date(req.timestamp).toLocaleString(),10,36);
    doc.text('Veiculo: '+(req.vehicleData?.modelo||''),10,42);doc.text('Chassi: '+(req.vehicleData?.chassi||''),10,48);
    doc.text('Solicitante: '+req.responsavel,10,54);
    let y=64;doc.setFontSize(11);doc.text('ITENS:',10,y);y+=8;
    (req.items||[]).forEach((it,i)=>{
      if(y>250){doc.addPage();y=15;}
      doc.setFontSize(9);
      const st=it.status==='Doado'?`[DOADO → OS ${it.donatedTo||'?'}]`:`[${it.status||'Pendente'}]`;
      doc.text(`${i+1}. Qtd:${it.quantity} - ${it.description} ${st}`,14,y);y+=7;
      if(comFoto&&it.photo){try{doc.addImage(it.photo,'JPEG',14,y,45,28);y+=32;}catch{}}
    });
    doc.save('OS_'+req.os+'_VRZ.pdf');
  };

  return(
    <div className="fade-up" style={{paddingBottom:16}}>
    {toDelete&&(
        <div style={{position:'fixed',inset:0,zIndex:500,background:'rgba(0,0,0,.8)',display:'flex',alignItems:'center',justifyContent:'center',padding:16,overflowY:'auto'}}>
          <div style={{background:'#fff',borderRadius:20,overflow:'hidden',maxWidth:360,width:'100%'}}>
            <div style={{background:'var(--red)',padding:'24px 20px',textAlign:'center',color:'#fff'}}>
              <div style={{width:48,height:48,background:'rgba(255,255,255,.2)',borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px'}}><Icon name="trash-2" size={22}/></div>
              <h3 style={{margin:0,fontSize:16,fontWeight:800}}>Excluir Registro</h3>
            </div>
            <div style={{padding:20}}>
              <p style={{fontSize:11,color:'var(--muted)',textAlign:'center',marginBottom:16}}>Confirmar exclusão permanente?</p>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                <button onClick={()=>setToDelete(null)} className="btn-ghost">Cancelar</button>
              <button onClick={async()=>{
  try{
    const req=requests.find(r=>r.id===toDelete);
    if(req){
      await col('deletedItems').add(stripUndefined({
        ...req,
        originalId:req.id,
        deletedBy:loggedInUser?.user||'Sistema',
        deletedAt:Date.now(),
        expiresAt:Date.now()+(5*86400000),
      }));
    }
    await col('requests').doc(toDelete).delete();
    setToDelete(null);
  }catch{alert('Erro.');}
}} className="btn-primary">Confirmar</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {pdfConfirm&&(
        <div style={{position:'fixed',inset:0,zIndex:550,background:'rgba(0,0,0,.8)',display:'flex',alignItems:'center',justifyContent:'center',padding:16,overflowY:'auto'}}>
          <div style={{background:'#fff',borderRadius:20,overflow:'hidden',maxWidth:380,width:'100%'}}>
            <div style={{background:'#2563EB',padding:'24px 20px',textAlign:'center',color:'#fff'}}>
              <div style={{width:48,height:48,background:'rgba(255,255,255,.2)',borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px'}}><Icon name="file-down" size={22}/></div>
              <h3 style={{margin:0,fontSize:16,fontWeight:800}}>Exportar PDF</h3>
              <p style={{margin:0,fontSize:9,color:'rgba(255,255,255,.75)',marginTop:4}}>OS #{pdfConfirm.os}</p>
            </div>
            <div style={{padding:20}}>
              <p style={{fontSize:11,color:'var(--muted)',textAlign:'center',marginBottom:16}}>Deseja incluir as fotos das peças no PDF?</p>
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                <button onClick={()=>{exportPDF(pdfConfirm,true);setPdfConfirm(null);}} className="btn-primary" style={{background:'#2563EB'}}><Icon name="image" size={14}/> Com Fotos</button>
                <button onClick={()=>{exportPDF(pdfConfirm,false);setPdfConfirm(null);}} className="btn-ghost">Sem Fotos</button>
                <button onClick={()=>setPdfConfirm(null)} style={{background:'none',border:'none',color:'var(--muted)',fontSize:10,fontWeight:700,textTransform:'uppercase',cursor:'pointer',padding:6}}>Cancelar</button>
              </div>
            </div>
          </div>
        </div>
      )}

      <div style={{marginBottom:16}}>
       <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.15em',color:'var(--red)',marginBottom:4}}>Registros do Portal</p>
        <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',margin:'0 0 12px'}}>
          <h2 style={{fontSize:26,fontWeight:800,margin:0,letterSpacing:'-.02em'}}>Histórico de OS</h2>
          <LastUpdateBadge/>
        </div>
        <div style={{display:'flex',gap:3,background:'var(--smoke)',padding:4,borderRadius:12,border:'1px solid var(--border)',overflowX:'auto',marginBottom:12,WebkitOverflowScrolling:'touch'}}>
          {[
            {key:'geral',label:`Todos (${counts.geral})`,color:'var(--ink)'},
            {key:'pendente',label:`Pendentes (${counts.pendente})`,color:'#C45E00'},
            {key:'cotacao',label:`Em Cotação (${counts.cotacao})`,color:'#1A4EC2'},
            {key:'comprado',label:`Comprado (${counts.comprado||0})`,color:'#6B21A8'},
            {key:'concluido',label:`Concluídos (${counts.concluido})`,color:'#0A6B34'},
            {key:'doado',label:`Doações (${counts.doado})`,color:'#A81515'},
          ].map(t=>(
            <button key={t.key} onClick={()=>setStatusTab(t.key)} style={{padding:'7px 14px',borderRadius:9,fontSize:9,fontWeight:800,textTransform:'uppercase',whiteSpace:'nowrap',border:'none',cursor:'pointer',letterSpacing:'.06em',transition:'all .15s',fontFamily:'Plus Jakarta Sans,sans-serif',background:statusTab===t.key?'#fff':'transparent',color:statusTab===t.key?t.color:'var(--muted)',boxShadow:statusTab===t.key?'0 2px 8px rgba(0,0,0,.08)':'none'}}>
              {t.label}
            </button>
          ))}
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:8,alignItems:'center'}}>
          <select value={unidadeFilter} onChange={e=>setUnidadeFilter(e.target.value)} className="input" style={{width:'auto',padding:'8px 14px',fontSize:10,fontWeight:700,appearance:'auto'}}>
            <option value="todas">Todas as Unidades</option>
            {UNIDADES.map(u=><option key={u} value={u}>{u}</option>)}
          </select>
         {canDo(role,'delete')&&(
            <button onClick={exportCSV} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',background:'#059669',color:'#fff',border:'none',borderRadius:8,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer'}}>
              <Icon name="file-text" size={13}/> Excel
            </button>
          )}
          {canDo(role,'delete')&&(
            <button onClick={exportSemaforo} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',background:'#7C3AED',color:'#fff',border:'none',borderRadius:8,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer'}}>
              <Icon name="file-spreadsheet" size={13}/> Status Semáforo
            </button>
          )}
          <div style={{position:'relative',flex:1,minWidth:200}}>
            <input type="text" placeholder="Buscar OS / Chassi / Nome..." value={search} onChange={e=>setSearch(e.target.value)} className="input" style={{paddingLeft:36,fontSize:11}}/>
            <div style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',color:'var(--muted)'}}><Icon name="search" size={14}/></div>
          </div>
        </div>
      </div>

      <div className="scroll-y" style={{maxHeight:'72vh',display:'flex',flexDirection:'column',gap:12}}>
        {filtered.length===0?(
          <div style={{padding:'64px 20px',textAlign:'center',background:'#fff',borderRadius:16,border:'1.5px dashed var(--border)'}}>
            <Icon name="inbox" size={32} style={{margin:'0 auto 10px',display:'block',color:'var(--muted)'}}/>
            <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',margin:0}}>Nenhum resultado encontrado</p>
          </div>
        ):filtered.map(r=>{
          const vInfo=vehicleMap[String(r.os).trim()]||r.vehicleData||{};
          const etapa=vInfo.etapa||r.vehicleData?.etapa||'';
          const localizacao=vInfo.localizacao||r.vehicleData?.localizacao||'';
          return(
          <div key={r.os} style={{background:'#fff',border:'1.5px solid var(--border)',borderRadius:14,borderLeft:'3px solid var(--red)',overflow:'visible'}}>
            <div style={{padding:'14px 16px'}}>
              <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:8,marginBottom:10}}>
                <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',flex:1,minWidth:0}}>
                  <span style={{fontSize:14,fontWeight:800}}>OS #{r.os}</span>
                  <span className="pill">{r.unidade||'Unidade 1'}</span>
                  {/* MELHORIA 1: etapa e localização */}
                  {etapa&&(
                    <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'3px 9px',borderRadius:6,background:'#FFF4E6',border:'1px solid #FFD9A8',fontSize:8,fontWeight:800,textTransform:'uppercase',color:'#C45E00'}}>
                      <Icon name="layers" size={10}/>{etapa}
                    </span>
                  )}
                  {localizacao&&(
                    <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'3px 9px',borderRadius:6,background:'#EAF0FF',border:'1px solid #C0D0F5',fontSize:8,fontWeight:800,textTransform:'uppercase',color:'#1A4EC2'}}>
                      <Icon name="map-pin" size={10}/>{localizacao}
                    </span>
                  )}
                  {r._merged&&<span style={{fontSize:7,fontWeight:800,padding:'2px 7px',borderRadius:999,background:'#EAF0FF',color:'#1A4EC2',border:'1px solid #C0D0F5'}}>Mesclado</span>}
{r.parte&&r.totalPartes>1&&<span style={{fontSize:7,fontWeight:800,padding:'2px 7px',borderRadius:999,background:'#F3E8FF',color:'#6B21A8',border:'1px solid #D8B4FE'}}>Parte {r.parte}/{r.totalPartes}</span>}
                </div>
                <div style={{display:'flex',gap:8}}>
                 <button onClick={()=>setPdfConfirm(r)} style={{display:'flex',alignItems:'center',gap:5,padding:'6px 12px',background:'#2563EB',color:'#fff',border:'none',borderRadius:7,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer'}}>
                    <Icon name="file-down" size={12}/> PDF
                  </button>
                  {canDelete&&<button onClick={()=>setToDelete(r.id)} style={{display:'flex',alignItems:'center',gap:5,padding:'6px 12px',background:'var(--red)',color:'#fff',border:'none',borderRadius:7,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer'}}>
                    <Icon name="trash-2" size={12}/> Excluir
                  </button>}
                </div>
              </div>
              <div className="hist-meta" style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(100px,1fr))',gap:'6px 16px',marginBottom:12}}>
                {[['Solicitante',r.responsavel||'—'],['Veículo',r.vehicleData?.modelo||'—'],['Chassi',r.vehicleData?.chassi||'—'],['Data',r.timestamp?new Date(r.timestamp).toLocaleDateString():'—']].map(([l,v])=>(
                  <div key={l}><p style={{fontSize:7,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',margin:'0 0 2px'}}>{l}</p><p style={{fontSize:10,fontWeight:600,color:'var(--ink)',margin:0}}>{v}</p></div>
                ))}
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:0,borderTop:'1px solid var(--border)',marginTop:8}}>
                {(r.items||[]).map((it,i)=>{
                  const bgItem=it.status==='Concluído'?'#F0FBF5':it.status==='Doado'?'#FFF5F5':it.status==='Comprado'?'#F8F4FF':it.status==='Em Cotação'?'#F0F5FF':'#FAFAF9';
                  const borderColor=it.status==='Concluído'?'#AAE6C5':it.status==='Doado'?'#FFBDBD':it.status==='Comprado'?'#D8B4FE':it.status==='Em Cotação'?'#C0D0F5':'var(--border)';
                  return(
                  <div key={i} style={{display:'flex',alignItems:'flex-start',gap:12,padding:'12px 16px',borderBottom:i<(r.items||[]).length-1?'1px solid var(--border)':'none',background:bgItem}}>
                    {/* Foto */}
                    {it.photo
                      ?<img src={it.photo} style={{width:44,height:44,borderRadius:8,objectFit:'cover',border:`1px solid ${borderColor}`,flexShrink:0}} alt="Peça"/>
                      :<div style={{width:44,height:44,borderRadius:8,background:'rgba(0,0,0,.05)',border:`1px solid ${borderColor}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name="package" size={18}/></div>
                    }
                    {/* Conteúdo */}
                    <div style={{flex:1,minWidth:0}}>
                      {/* Linha 1: nome + badge + qtd */}
                      <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',marginBottom:5}}>
                        <span style={{fontSize:11,fontWeight:800,textTransform:'uppercase',color:'var(--ink)',wordBreak:'break-word'}}>{it.description||'(sem descrição)'}</span>
                        <StatusBadge status={it.status||'Pendente'} orig={it.statusOriginal}/>
                        <span style={{fontSize:8,background:'rgba(0,0,0,.06)',padding:'1px 6px',borderRadius:4,fontWeight:700,color:'var(--muted)'}}>×{it.quantity}</span>
                        {/* Solicitante e Data do Item */}
                        <span style={{fontSize:8,fontWeight:700,color:'var(--muted)',marginLeft:'auto',display:'flex',alignItems:'center',gap:4}}>
                          <Icon name="user" size={10}/> {it._responsavel||'—'} 
                          <span style={{opacity:0.5}}>•</span>

// ── Storage View ──────────────────────────────────────────────────────────
function StorageView({requests,loggedInUser}){
  const LIM=1000;

  const{data:finalizacoesHistorico}=useFirestore('finalizacoesHistorico');
  const[sel,setSel]=useState({});const[exportando,setExportando]=useState(false);const[excluindo,setExcluindo]=useState(false);const[confirmar,setConfirmar]=useState(false);
  const[prog,setProg]=useState({atual:0,total:0,msg:''});
  const concluidos=useMemo(()=>requests.filter(r=>r.items?.length>0&&r.items.every(it=>it.status==='Concluído'||it.status==='Doado')).sort((a,b)=>a.timestamp-b.timestamp),[requests]);
  const total=requests.length,totalConc=concluidos.length,ativos=total-totalConc;
  const totalFinalizacoes=finalizacoes.length+finalizacoesHistorico.length;
  const bytesFinalizacoes=useMemo(()=>{
    let b=0;
    finalizacoes.forEach(f=>{
      ['ajuste','martelinho','pintura','vidro'].forEach(cat=>(f[cat]||[]).forEach(p=>{if(p.foto)b+=150000;}));
    });
    finalizacoesHistorico.forEach(h=>{if(h.pdfUrl||h.pdfDataUrl)b+=800000;});
    return b;
  },[finalizacoes,finalizacoesHistorico]);
  const pctPed=Math.min(total/LIM*100,100);const bytesU=estimarBytes(requests)+bytesFinalizacoes;const pctSt=Math.min(bytesU/1073741824*100,100);
  const restam=Math.max(LIM-total,0);const corB=pctPed>=85?'var(--red)':pctPed>=60?'#F59E0B':'#059669';
  const alerta=pctPed>=85?'⚠ Próximo do limite!':pctPed>=60?'Uso moderado':'Uso saudável';
  const todosSel=concluidos.length>0&&concluidos.every(r=>sel[r.id]);
  const qtdSel=Object.values(sel).filter(Boolean).length;
  const idsSel=Object.entries(sel).filter(([,v])=>v).map(([id])=>id);
  const pedSel=concluidos.filter(r=>idsSel.includes(r.id));
  const toggleTodos=()=>{if(todosSel)setSel({});else{const n={};concluidos.forEach(r=>{n[r.id]=true;});setSel(n);}};
  const exportCSV=()=>{
    if(!pedSel.length)return;
    const rows=[['Data','OS','Unidade','Modelo','Fabricante','Chassi','Solicitante','Peça','Qtd','Status','Fornecedor','Valor','Entrega Real'].join(';')];
    pedSel.forEach(r=>(r.items||[]).forEach(it=>rows.push([r.timestamp?new Date(r.timestamp).toLocaleDateString('pt-BR'):'',r.os,r.unidade||'Unidade 1',r.vehicleData?.modelo||'',r.vehicleData?.fabricante||'',r.vehicleData?.chassi||'',r.responsavel||'',it.description||'',it.quantity||1,it.statusOriginal||it.status||'',it.supplier||'',it.price?Number(it.price).toLocaleString('pt-BR',{minimumFractionDigits:2}):'',it.actualDeliveryDate||''].join(';'))));
    const blob=new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`VRZ_Concluidos_${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.csv`;a.click();
  };
  const exportPDF=async()=>{
    if(!pedSel.length)return;setExportando(true);
    try{
      const{jsPDF}=window.jspdf;const doc=new jsPDF();const hoje=new Date().toLocaleDateString('pt-BR');
      doc.setFillColor(13,13,13);doc.rect(0,0,210,38,'F');doc.setTextColor(255,255,255);doc.setFontSize(16);doc.setFont('helvetica','bold');
      doc.text('VRZ COMPRAS — ARQUIVO DE CONCLUÍDOS',10,16);doc.setFontSize(8);doc.setFont('helvetica','normal');doc.text(`Gerado: ${hoje}  |  Pedidos: ${pedSel.length}`,10,28);
      doc.setTextColor(0,0,0);let y=50;
      pedSel.forEach(req=>{
        if(y>250){doc.addPage();y=15;}
        doc.setFillColor(245,242,240);doc.rect(8,y-4,194,13,'F');
        doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text(`OS #${req.os} (${req.unidade||'Unidade 1'}) — ${req.vehicleData?.modelo||''}`,12,y+3);
        doc.setFont('helvetica','normal');doc.setFontSize(7);doc.text(`Solicitante: ${req.responsavel||'—'}  |  ${req.timestamp?new Date(req.timestamp).toLocaleDateString('pt-BR'):''}`,12,y+9);y+=16;
        (req.items||[]).forEach((it,ii)=>{
          if(y>265){doc.addPage();y=15;}
          doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(0,0,0);doc.text(`${ii+1}. ${it.description||''}`,14,y);

          const det=`Qtd:${it.quantity||1}  Fornecedor:${it.supplier||'—'}  Valor:${it.price?'R$'+Number(it.price).toLocaleString('pt-BR',{minimumFractionDigits:2}):'—'}  Entrega:${it.actualDeliveryDate||'—'}`;
          const ls=doc.splitTextToSize(det,180);doc.text(ls,16,y+5);doc.setTextColor(0,0,0);y+=5+ls.length*4+2;
        });
        y+=4;doc.setDrawColor(220,220,220);doc.line(8,y-2,202,y-2);
      });
      doc.save(`VRZ_Concluidos_${hoje.replace(/\//g,'-')}.pdf`);
    }catch(e){alert('Erro PDF: '+e.message);}
    setExportando(false);
  };
 const executarExclusao=async()=>{
