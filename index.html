  const onSetOpcao=(v)=>{
    setPecasEscolha(v);
    if(v==='novas'){setMostrarNovas(true);setMostrarExcedente(false);setPerguntaExcedenteFeita(false);}
    else if(v==='excedente'){setMostrarExcedente(true);setMostrarNovas(false);setPerguntaNovasFeita(false);}
    else{setMostrarNovas(false);setMostrarExcedente(false);}
  };

 const carregarFin=(t)=>{
    const fin=finalizacoes.find(f=>String(f.os).trim()===t&&!f.arquivada);
  if(fin){
     setExistingFin(fin);
     setAjuste(fin.ajuste||[]);
      setMartelinho(fin.martelinho||[]);
      setPintura(fin.pintura||[]);
      setVidro(fin.vidro||[]);
      setOutro(fin.outro||[]);
      setInstalacaoPecas(fin.instalacaoPecas||[]);
      const opc=fin.pecasOpcao||'suficiente';
      const novas=opc==='novas'||opc==='ambos';
      const exc=opc==='excedente'||opc==='ambos';
      setPecasEscolha(novas?'novas':exc?'excedente':'suficiente');
      setMostrarNovas(novas);
      setMostrarExcedente(exc);
      setPerguntaExcedenteFeita(true);
      setPerguntaNovasFeita(true);
      setExcedentes([]);setNovasPecas([]);
       setReadOnly(false);
  }else{
    setExistingFin(null);
      setAjuste([]);setMartelinho([]);setPintura([]);setVidro([]);setOutro([]);setInstalacaoPecas([]);
      setPecasEscolha('suficiente');setMostrarNovas(false);setMostrarExcedente(false);
      setPerguntaExcedenteFeita(false);setPerguntaNovasFeita(false);
      setNovasPecas([]);setExcedentes([]);
      setReadOnly(false);
    }
  };
 const onOSBlur=()=>{
    const t=String(os).trim();if(!t)return;
    const f=vehiclesDB.find(v=>String(v.os).trim()===t);
    if(f){
      setVehicle(f);
      const req=requests.find(r=>String(r.os).trim()===t);
      if(req)setUnidade(req.unidade||'Unidade 1');
      carregarFin(t);
      try{
        const raw=localStorage.getItem('rascunho_finalizacao_'+t);
        if(raw){
          const rascunho=JSON.parse(raw);
        if(window.confirm('Encontramos um rascunho não salvo desta OS (de '+new Date(rascunho.salvoEm).toLocaleString('pt-BR')+'). Deseja restaurá-lo?')){
            setAjuste(rascunho.ajuste||[]);
            setMartelinho(rascunho.martelinho||[]);
            setPintura(rascunho.pintura||[]);
            setVidro(rascunho.vidro||[]);
            setOutro(rascunho.outro||[]);
            setInstalacaoPecas(rascunho.instalacaoPecas||[]);
            setPecasEscolha(rascunho.pecasEscolha||'suficiente');
            setMostrarNovas(!!rascunho.mostrarNovas);
            setMostrarExcedente(!!rascunho.mostrarExcedente);
            setNovasPecas(rascunho.novasPecas||[]);
            setExcedentes(rascunho.excedentes||[]);
          }else{
            localStorage.removeItem('rascunho_finalizacao_'+t);
          }
        }
      }catch(e){}
    }else{setVehicle(null);setExistingFin(null);setReadOnly(false);alert('OS não cadastrada.');}
  };
const reset=()=>{
    try{if(os.trim())localStorage.removeItem('rascunho_finalizacao_'+os.trim());}catch(e){}
    setOs('');setVehicle(null);setUnidade('Unidade 1');setAjuste([]);setMartelinho([]);setPintura([]);setVidro([]);setOutro([]);setInstalacaoPecas([]);
    setPecasEscolha('suficiente');setMostrarNovas(false);setMostrarExcedente(false);
    setPerguntaExcedenteFeita(false);setPerguntaNovasFeita(false);setPerguntaPendente(null);
    setNovasPecas([]);setExcedentes([]);setDone(false);setExistingFin(null);setReadOnly(false);
  };
const executarSalvar=async()=>{
    const problemasSemDescricao=[...ajuste,...martelinho,...pintura,...vidro,...outro,...instalacaoPecas].some(p=>!p.descricao||!p.descricao.trim());
    if(problemasSemDescricao){alert('Preencha a descrição de todos os problemas em Ajuste, Martelinho, Pintura e Vidro antes de salvar.');return;}
    if(mostrarNovas&&novasPecas.some(p=>!p.description||!p.description.trim())){alert('Preencha a descrição de todas as peças antes de salvar.');return;}
    const pecasValidas=novasPecas.filter(p=>p.description.trim());
    if(mostrarNovas&&pecasValidas.some(p=>!p.photo)){setShowFotoAlert(true);return;}
   setSaving(true);
    // Trava de segurança: nunca deixa o botão preso em "Salvando..." para sempre
    const timeoutId=setTimeout(()=>{
      setSaving(false);
      alert('Tempo esgotado ao salvar. Verifique sua conexão e tente novamente. Seu rascunho não foi perdido.');
    },20000);
    try{
      const now=Date.now();

     // Storage não está disponível no plano Firebase atual — fotos já vêm
      // comprimidas em base64 e vão direto pro Firestore, igual ao resto do app.
     const ajusteUp=ajuste, martelinhoUp=martelinho, pinturaUp=pintura, vidroUp=vidro, outroUp=outro, instalacaoPecasUp=instalacaoPecas;
      if(mostrarNovas&&pecasValidas.length){
        await col('requests').add(stripUndefined({
          os,responsavel:loggedInUser.user,vehicleData:vehicle,unidade,
          items:pecasValidas.map(p=>({id:String(Date.now())+Math.floor(Math.random()*999),description:p.description,quantity:p.quantity||1,photo:p.photo||null,status:'Pendente'})),
          timestamp:now,status:'Pendente',origemFinalizacao:true,
        }));
      }
      if(mostrarExcedente&&excedentes.length){
        const matching=requests.filter(r=>String(r.os).trim()===String(os).trim());
        for(const req of matching){
          let changed=false;
          const newItems=(req.items||[]).map(it=>{
            if(excedentes.includes(String(it.id))){changed=true;return{...it,excedente:true,excedentePor:loggedInUser.user,excedenteEm:now};}
            return it;
          });
          if(changed)await col('requests').doc(req.id).update({items:stripUndefined(newItems)});
        }
      }
    const opcaoFinal=mostrarNovas&&mostrarExcedente?'ambos':mostrarExcedente?'excedente':mostrarNovas?'novas':'suficiente';
      const historicoEntry={acao:existingFin?'Inspeção atualizada':'Inspeção criada',usuario:loggedInUser.user,timestamp:now};
      const atualizadoCatsHist={ajuste:ajusteUp,martelinho:martelinhoUp,pintura:pinturaUp,vidro:vidroUp,outro:outroUp,instalacaoPecas:instalacaoPecasUp};
      const diffEntradasHist=diffHistoricoProblemas(existingFin||{},atualizadoCatsHist,loggedInUser.user,now);
      const payloadCheck=stripUndefined({ajuste:ajusteUp,martelinho:martelinhoUp,pintura:pinturaUp,vidro:vidroUp,outro:outroUp,instalacaoPecas:instalacaoPecasUp});
      const tamanhoEstimado=JSON.stringify(payloadCheck).length;
      if(tamanhoEstimado>900000){
        alert(`As fotos desta inspeção estão grandes demais (~${Math.round(tamanhoEstimado/1024)}KB). Remova algumas fotos e tente novamente.`);
        setSaving(false);
        return;
      }
    if(existingFin){
        await col('finalizacoes').doc(existingFin.id).update(stripUndefined({
          ajuste:ajusteUp.map(p=>({...p})),
          martelinho:martelinhoUp.map(p=>({...p})),
          pintura:pinturaUp.map(p=>({...p})),
          vidro:vidroUp.map(p=>({...p})),
          outro:outroUp.map(p=>({...p})),
          instalacaoPecas:instalacaoPecasUp.map(p=>({...p})),
          pecasOpcao:opcaoFinal,
          historico:[...(existingFin.historico||[]),historicoEntry,...diffEntradasHist],
        }));
      }else{
        await col('finalizacoes').add(stripUndefined({
          os,unidade,vehicleData:vehicle,
          criadoPor:loggedInUser.user,criadoEm:now,
          ajuste:ajusteUp.map(p=>({...p})),
          martelinho:martelinhoUp.map(p=>({...p})),
          pintura:pinturaUp.map(p=>({...p})),
          vidro:vidroUp.map(p=>({...p})),
          outro:outroUp.map(p=>({...p})),
          instalacaoPecas:instalacaoPecasUp.map(p=>({...p})),
          pecasOpcao:opcaoFinal,
          historico:[historicoEntry,...diffEntradasHist],
        }));
      }
     try{localStorage.removeItem('rascunho_finalizacao_'+os.trim());}catch(e){}
      clearTimeout(timeoutId);
      setDone(true);
    }catch(e){
      clearTimeout(timeoutId);
      alert('Erro ao salvar: '+e.message);
    }
    clearTimeout(timeoutId);
    setSaving(false);
  };

  const handleSalvarClick=()=>{
    if(readOnly)return;
    if(!os.trim())return alert('Informe a OS.');
    if(!vehicle)return alert('OS não cadastrada.');
    if(pecasEscolha==='novas'&&!perguntaExcedenteFeita){setPerguntaPendente('excedente');return;}
    if(pecasEscolha==='excedente'&&!perguntaNovasFeita){setPerguntaPendente('novas');return;}
    executarSalvar();
  };

  const responderPergunta=(resposta)=>{
    if(perguntaPendente==='excedente'){
      setPerguntaExcedenteFeita(true);
      if(resposta==='sim'){setMostrarExcedente(true);setPerguntaPendente(null);return;}
    }else if(perguntaPendente==='novas'){
      setPerguntaNovasFeita(true);
      if(resposta==='sim'){setMostrarNovas(true);setPerguntaPendente(null);return;}
    }
    setPerguntaPendente(null);
    executarSalvar();
  };

 if(saving)return(
    <div style={{maxWidth:440,margin:'0 auto',background:'#fff',borderRadius:20,border:'1.5px solid var(--border)',padding:48,textAlign:'center'}} className="fade-in">
      <div style={{width:72,height:72,borderRadius:999,background:'var(--red-light)',border:'2px solid #FFBDBD',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 20px'}}>
        <Icon name="refresh-cw" size={32} className="spin"/>
      </div>
      <h3 style={{fontSize:18,fontWeight:800,margin:'0 0 8px'}}>Salvando Inspeção...</h3>
      <p style={{fontSize:11,color:'var(--muted)',margin:0}}>Não feche esta tela. Isso pode levar alguns segundos.</p>
      <p style={{fontSize:9,color:'var(--muted)',marginTop:8,opacity:.7}}>Se demorar mais de 20 segundos, o sistema libera automaticamente com um aviso.</p>
    </div>
  );

  if(done)return(
    <div style={{maxWidth:420,margin:'0 auto',background:'#fff',borderRadius:20,border:'1.5px solid var(--border)',padding:40,textAlign:'center'}} className="fade-up">
      <div style={{width:64,height:64,background:'#EDFAF3',borderRadius:18,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 20px'}}><Icon name="check-circle" size={32}/></div>
      <h2 style={{fontSize:22,fontWeight:800,margin:'0 0 8px'}}>Inspeção Registrada!</h2>
      <p style={{fontSize:12,color:'var(--muted)',marginBottom:24}}>OS #{os}</p>
      <button onClick={reset} className="btn-primary" style={{width:'100%',padding:14}}>Nova Inspeção</button>
    </div>
  );

  return(
    <div className="fade-up" style={{paddingBottom:20}}>
      {showFotoAlert&&(
        <div style={{position:'fixed',inset:0,zIndex:600,background:'rgba(0,0,0,.8)',display:'flex',alignItems:'center',justifyContent:'center',padding:16,overflowY:'auto'}}>
          <div style={{background:'#fff',borderRadius:20,overflow:'hidden',maxWidth:360,width:'100%'}}>
            <div style={{background:'var(--red)',padding:'24px 20px',textAlign:'center',color:'#fff'}}>
              <div style={{width:52,height:52,background:'rgba(255,255,255,.2)',borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px'}}><Icon name="camera" size={26}/></div>
              <h3 style={{margin:0,fontSize:17,fontWeight:800}}>Foto Obrigatória</h3>
            </div>
            <div style={{padding:20}}><p style={{fontSize:12,color:'var(--muted)',textAlign:'center',marginBottom:16}}>Todas as novas peças precisam de uma foto anexada.</p><button onClick={()=>setShowFotoAlert(false)} className="btn-primary" style={{width:'100%'}}>Entendido</button></div>
          </div>
        </div>
      )}
  {perguntaPendente&&(
        <div style={{position:'fixed',inset:0,zIndex:600,background:'rgba(0,0,0,.8)',display:'flex',alignItems:'center',justifyContent:'center',padding:16,overflowY:'auto'}}>
          <div style={{background:'#fff',borderRadius:20,overflow:'hidden',maxWidth:400,width:'100%'}}>
            <div style={{background:'var(--ink)',padding:'24px 20px',textAlign:'center',color:'#fff'}}>
              <div style={{width:52,height:52,background:'rgba(255,255,255,.1)',borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px'}}><Icon name="package" size={26}/></div>
              <h3 style={{margin:0,fontSize:16,fontWeight:800}}>
                {perguntaPendente==='excedente'?'Existem peças dessa lista que não são mais necessárias?':'Deseja adicionar algum novo pedido?'}
              </h3>
            </div>
            <div style={{padding:20,display:'flex',gap:10}}>
              <button onClick={()=>responderPergunta('nao')} className="btn-ghost" style={{flex:1}}>Não, salvar assim</button>
              <button onClick={()=>responderPergunta('sim')} className="btn-primary" style={{flex:1}}>Sim</button>
            </div>
          </div>
        </div>
      )}
      <div className="card" style={{marginBottom:16}}>
        <div style={{padding:20,display:'flex',flexDirection:'column',gap:16}}>
          <div>
            <label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.12em',color:'var(--muted)',display:'block',marginBottom:6}}>Número da OS</label>
            <input type="text" inputMode="numeric" value={os} onChange={e=>setOs(sanitize(e.target.value))} onBlur={onOSBlur} placeholder="Nº da OS" className="input" style={{fontSize:22,fontWeight:800}}/>
          </div>
         {existingFin&&(
            <div style={{background:'#EAF0FF',border:'1px solid #C0D0F5',borderRadius:10,padding:'10px 14px',display:'flex',alignItems:'center',gap:10}}>
              <Icon name="info" size={16} style={{color:'#1A4EC2',flexShrink:0}}/>
              <p style={{fontSize:10,fontWeight:700,color:'#1A4EC2',margin:0}}>
                Esta Ordem de Serviço já possui uma inspeção criada por <strong>{existingFin.criadoPor}</strong>. Qualquer inspetor pode continuar editando, adicionando ou removendo itens — todas as alterações ficam registradas no histórico.
              </p>
            </div>
          )}
        </div>
        <div style={{borderTop:'2px solid var(--border)',background:'var(--ink)',padding:20,minHeight:90,display:'flex',alignItems:'center'}}>
          {vehicle?(
            <div style={{width:'100%'}}>
              <p style={{fontSize:7,fontWeight:700,textTransform:'uppercase',letterSpacing:'.12em',color:'rgba(255,255,255,.3)',margin:'0 0 4px'}}>Veículo encontrado</p>
              <p style={{fontSize:20,fontWeight:800,textTransform:'uppercase',color:'#fff',margin:'0 0 10px'}}>{vehicle.modelo}</p>
            <div className="grid-4col" style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:10}}>
                {[['Etapa',vehicle.etapa],['Cor',vehicle.cor],['Chassi',vehicle.chassi],['Linha',vehicle.linhaProducao]].map(([l,v])=>(
                  <div key={l}><p style={{fontSize:7,color:'rgba(255,255,255,.3)',fontWeight:700,textTransform:'uppercase',margin:'0 0 2px'}}>{l}</p><p style={{fontSize:11,color:'rgba(255,255,255,.85)',fontWeight:600,margin:0,textTransform:'uppercase'}}>{v||'—'}</p></div>
                ))}
              </div>
            </div>
          ):(
            <div style={{width:'100%',textAlign:'center',padding:'8px 0'}}>
              <Icon name="car" size={26} style={{margin:'0 auto 6px',display:'block',color:'rgba(255,255,255,.15)'}}/>
              <p style={{fontSize:9,color:'rgba(255,255,255,.25)',fontWeight:700,textTransform:'uppercase',margin:0}}>Digite a OS para carregar o veículo e habilitar os campos</p>
            </div>
          )}
        </div>
      </div>

  <div style={{background:limiteAtingido?'var(--red-light)':'var(--smoke)',border:`1px solid ${limiteAtingido?'#FFBDBD':'var(--border)'}`,borderRadius:12,padding:'10px 16px',marginBottom:16,display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,flexWrap:'wrap'}}>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <Icon name="camera" size={15} style={{color:limiteAtingido?'var(--red)':'var(--muted)'}}/>
        <span style={{fontSize:10,fontWeight:800,textTransform:'uppercase',color:limiteAtingido?'var(--red)':'var(--muted)'}}>Fotos da inspeção: {totalFotos}/{MAX_FOTOS_INSPECAO}</span>
      </div>
      {limiteAtingido&&<span style={{fontSize:9,fontWeight:700,color:'var(--red)'}}>Limite atingido — remova uma foto para adicionar outra</span>}
    </div>
  <ProblemCategoryEditor title="Ajuste" icon="wrench" color="#F59E0B" items={ajuste} setItems={setAjuste} disabled={disabled} limiteAtingido={limiteAtingido} loggedInUser={loggedInUser}/>
      <ProblemCategoryEditor title="Martelinho" icon="hammer" color="#DC1F1F" items={martelinho} setItems={setMartelinho} disabled={disabled} limiteAtingido={limiteAtingido} loggedInUser={loggedInUser}/>
      <ProblemCategoryEditor title="Pintura" icon="paintbrush" color="#2563EB" items={pintura} setItems={setPintura} disabled={disabled} limiteAtingido={limiteAtingido} tipoSelect loggedInUser={loggedInUser}/>
      <ProblemCategoryEditor title="Vidro" icon="square" color="#0EA5E9" items={vidro} setItems={setVidro} disabled={disabled} limiteAtingido={limiteAtingido} tipoSelect loggedInUser={loggedInUser}/>
      <ProblemCategoryEditor title="Estética" icon="more-horizontal" color="#6B7280" items={outro} setItems={setOutro} disabled={disabled} limiteAtingido={limiteAtingido} loggedInUser={loggedInUser}/>
      <ProblemCategoryEditor title="Instalação Peças" icon="package" color="#10B981" items={instalacaoPecas} setItems={setInstalacaoPecas} disabled={disabled} limiteAtingido={limiteAtingido} loggedInUser={loggedInUser}/>
      <PecasFinalizacaoSection os={os} requests={requests}
        novasPecas={novasPecas} setNovasPecas={setNovasPecas} excedentes={excedentes} setExcedentes={setExcedentes}
        pecasEscolha={pecasEscolha} mostrarNovas={mostrarNovas} mostrarExcedente={mostrarExcedente}
        onSetOpcao={onSetOpcao} disabled={disabled}/>

      {!readOnly&&(
        <button onClick={handleSalvarClick} disabled={saving||!vehicle} className="btn-primary" style={{width:'100%',padding:16,fontSize:12}}>
          {saving?<Icon name="refresh-cw" size={18} className="spin"/>:<><Icon name="save" size={16}/> Salvar Inspeção</>}
        </button>
      )}
    </div>
  );
}

function EditarInspecaoModal({fin,loggedInUser,onClose}){
 const[ajuste,setAjuste]=useState(()=>JSON.parse(JSON.stringify(fin.ajuste||[])));
  const[martelinho,setMartelinho]=useState(()=>JSON.parse(JSON.stringify(fin.martelinho||[])));
  const[pintura,setPintura]=useState(()=>JSON.parse(JSON.stringify(fin.pintura||[])));
  const[vidro,setVidro]=useState(()=>JSON.parse(JSON.stringify(fin.vidro||[])));
  const[outro,setOutro]=useState(()=>JSON.parse(JSON.stringify(fin.outro||[])));
  const[instalacaoPecas,setInstalacaoPecas]=useState(()=>JSON.parse(JSON.stringify(fin.instalacaoPecas||[])));
  const[saving,setSaving]=useState(false);
  const totalFotos=useMemo(()=>{
    const conta=(arr)=>arr.filter(p=>p.foto).length;
    return conta(ajuste)+conta(martelinho)+conta(pintura)+conta(vidro)+conta(outro)+conta(instalacaoPecas);
  },[ajuste,martelinho,pintura,vidro,outro,instalacaoPecas]);
  const limiteAtingido=totalFotos>=MAX_FOTOS_INSPECAO;

  const salvar=async()=>{
    const problemasSemDescricao=[...ajuste,...martelinho,...pintura,...vidro,...outro,...instalacaoPecas].some(p=>!p.descricao||!p.descricao.trim());
    if(problemasSemDescricao){alert('Preencha a descrição de todos os problemas antes de salvar.');return;}
    setSaving(true);
    try{
      const now=Date.now();
      const payload=stripUndefined({ajuste,martelinho,pintura,vidro,outro,instalacaoPecas});
      const estimado=JSON.stringify(payload).length;
      if(estimado>900000){
        alert(`As fotos desta inspeção estão grandes demais (~${Math.round(estimado/1024)}KB). Remova algumas fotos e tente novamente.`);
        setSaving(false);return;
      }
      const diffEntradasHist=diffHistoricoProblemas(fin,{ajuste,martelinho,pintura,vidro,outro,instalacaoPecas},loggedInUser.user,now);
      await col('finalizacoes').doc(fin.id).update({
        ajuste:payload.ajuste,martelinho:payload.martelinho,pintura:payload.pintura,vidro:payload.vidro,outro:payload.outro,instalacaoPecas:payload.instalacaoPecas,
        historico:[...(fin.historico||[]),{acao:'Inspeção editada',usuario:loggedInUser.user,timestamp:now},...diffEntradasHist],
      });
      onClose();
    }catch(e){alert('Erro ao salvar: '+e.message);}
    setSaving(false);
  };

  return(
    <div style={{position:'fixed',inset:0,zIndex:650,background:'rgba(0,0,0,.9)',backdropFilter:'blur(4px)',display:'flex',alignItems:'center',justifyContent:'center',padding:16,overflowY:'auto'}}>
      <div style={{background:'#fff',width:'100%',maxWidth:900,borderRadius:24,boxShadow:'0 40px 80px rgba(0,0,0,.5)',display:'flex',flexDirection:'column',margin:'auto',maxHeight:'92vh'}}>
        <div style={{padding:'20px 28px',background:'var(--ink)',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
          <div>
            <h3 style={{margin:0,fontSize:18,fontWeight:800,color:'#fff'}}>Editar Inspeção — OS #{fin.os}</h3>
            <p style={{margin:0,fontSize:9,color:'var(--red)',fontWeight:700,textTransform:'uppercase',marginTop:4}}>{fin.vehicleData?.modelo||''}</p>
          </div>
          <button onClick={onClose} style={{width:38,height:38,background:'rgba(255,255,255,.08)',border:'none',borderRadius:10,cursor:'pointer',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="x" size={20}/></button>
        </div>
        <div style={{padding:24,overflowY:'auto'}} className="scroll-y">
          <div style={{background:limiteAtingido?'var(--red-light)':'var(--smoke)',border:`1px solid ${limiteAtingido?'#FFBDBD':'var(--border)'}`,borderRadius:12,padding:'10px 16px',marginBottom:16,display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,flexWrap:'wrap'}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <Icon name="camera" size={15} style={{color:limiteAtingido?'var(--red)':'var(--muted)'}}/>
              <span style={{fontSize:10,fontWeight:800,textTransform:'uppercase',color:limiteAtingido?'var(--red)':'var(--muted)'}}>Fotos da inspeção: {totalFotos}/{MAX_FOTOS_INSPECAO}</span>
            </div>
            {limiteAtingido&&<span style={{fontSize:9,fontWeight:700,color:'var(--red)'}}>Limite atingido — remova uma foto para adicionar outra</span>}
          </div>
        <ProblemCategoryEditor title="Ajuste" icon="wrench" color="#F59E0B" items={ajuste} setItems={setAjuste} disabled={false} limiteAtingido={limiteAtingido} loggedInUser={loggedInUser}/>
          <ProblemCategoryEditor title="Martelinho" icon="hammer" color="#DC1F1F" items={martelinho} setItems={setMartelinho} disabled={false} limiteAtingido={limiteAtingido} loggedInUser={loggedInUser}/>
          <ProblemCategoryEditor title="Pintura" icon="paintbrush" color="#2563EB" items={pintura} setItems={setPintura} disabled={false} limiteAtingido={limiteAtingido} tipoSelect loggedInUser={loggedInUser}/>
          <ProblemCategoryEditor title="Vidro" icon="square" color="#0EA5E9" items={vidro} setItems={setVidro} disabled={false} limiteAtingido={limiteAtingido} tipoSelect loggedInUser={loggedInUser}/>
          <ProblemCategoryEditor title="Estética" icon="more-horizontal" color="#6B7280" items={outro} setItems={setOutro} disabled={false} limiteAtingido={limiteAtingido} loggedInUser={loggedInUser}/>
          <ProblemCategoryEditor title="Instalação Peças" icon="package" color="#10B981" items={instalacaoPecas} setItems={setInstalacaoPecas} disabled={false} limiteAtingido={limiteAtingido} loggedInUser={loggedInUser}/>
        </div>
        <div style={{padding:'16px 24px',background:'var(--smoke)',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'flex-end',gap:10,flexShrink:0}}>
          <button onClick={onClose} className="btn-ghost">Cancelar</button>
          <button onClick={salvar} disabled={saving} className="btn-primary" style={{minWidth:160}}>
            {saving?<><Icon name="refresh-cw" size={14} className="spin"/> Salvando...</>:<><Icon name="save" size={14}/> Salvar Alterações</>}
          </button>
        </div>
      </div>
    </div>
  );
}

function MeusCarrosView({loggedInUser,isMaster,finalizacoes,requests}){
  const[search,setSearch]=useState('');
  const[subTab,setSubTab]=useState('pendentes');
  const[confirmDelFin,setConfirmDelFin]=useState(null);
  const[confirmDelProb,setConfirmDelProb]=useState(null);
  const[pdfConfirmFin,setPdfConfirmFin]=useState(null);
  const[editandoFin,setEditandoFin]=useState(null);
  const[resolvendoPendencia,setResolvendoPendencia]=useState(null);
  const[obsResolucao,setObsResolucao]=useState('');
  const[salvandoResolucao,setSalvandoResolucao]=useState(false);
  const[verHistorico,setVerHistorico]=useState({});

  const podeVerTodos=isMaster||loggedInUser?.role==='comercial'||ADMIN_ESPECIAL.includes(loggedInUser?.user);

  const pecasByOS=useMemo(()=>{
    const acc={};
    requests.forEach(r=>{
      const k=String(r.os||'').trim();if(!k)return;
      if(!acc[k])acc[k]={seen:new Set(),items:[]};
      (r.items||[]).forEach(it=>{
        const key=it.id||it.description;
        if(!acc[k].seen.has(key)){acc[k].seen.add(key);acc[k].items.push({...it,_responsavel:r.responsavel,_timestamp:r.timestamp});}
      });
    });
    const map={};
    Object.entries(acc).forEach(([k,v])=>{map[k]=v.items;});
    return map;
  },[requests]);

  const baseVisiveis=useMemo(()=>{
    let list=podeVerTodos?finalizacoes:finalizacoes.filter(f=>f.criadoPor===loggedInUser.user);
    list=list.filter(f=>!f.arquivada);
    if(search){
      const t=search.toLowerCase();
      list=list.filter(f=>String(f.os).toLowerCase().includes(t)||String(f.vehicleData?.modelo||'').toLowerCase().includes(t)||String(f.criadoPor||'').toLowerCase().includes(t));
    }
    return list.sort((a,b)=>b.criadoEm-a.criadoEm);
  },[finalizacoes,loggedInUser,isMaster,search]);

  // Calcula se a inspeção está 100% concluída (Ajuste + Pintura + Peças sem pendência)
const comStatus=useMemo(()=>baseVisiveis.map(fin=>{
    const pendAjustePintura=['ajuste','martelinho','pintura','vidro','outro','instalacaoPecas'].reduce((a,c)=>a+(fin[c]||[]).filter(p=>p.status!=='Solucionado').length,0);
    const pecasItems=pecasByOS[String(fin.os).trim()]||[];
    const pecasAtivas=pecasItems.filter(it=>!it.excedente);
    const pecasSolucionado=pecasAtivas.length===0||pecasAtivas.every(it=>it.status==='Concluído');
    const totalPend=pendAjustePintura+(pecasSolucionado?0:1);
    return{fin,totalPend,concluida:totalPend===0};
  }),[baseVisiveis,pecasByOS]);

  const visiveis=useMemo(()=>comStatus.filter(c=>subTab==='concluidos'?c.concluida:!c.concluida).map(c=>c.fin),[comStatus,subTab]);
  const countConcluidos=comStatus.filter(c=>c.concluida).length;
  const countPendentes=comStatus.filter(c=>!c.concluida).length;

  const podeEditar=(fin)=>true;

  const resolverPendencia=async(finId,categoria,itemId,observacao)=>{
    const fin=finalizacoes.find(f=>f.id===finId);if(!fin)return;
    const now=Date.now();
    const newCat=(fin[categoria]||[]).map(p=>p.id===itemId?{...p,status:'Solucionado',resolvidoPor:loggedInUser.user,resolvidoEm:now,obsResolucao:observacao||''}:p);
    const novoHistorico=[...(fin.historico||[]),{acao:`Pendência resolvida (${categoria})${observacao?' — Obs: '+observacao:''}`,usuario:loggedInUser.user,timestamp:now}];
    try{await col('finalizacoes').doc(finId).update({[categoria]:stripUndefined(newCat),historico:stripUndefined(novoHistorico)});}
    catch(e){alert('Erro: '+e.message);}
  };

  const abrirResolucao=(finId,categoria,itemId,descricao)=>{
    setResolvendoPendencia({finId,categoria,itemId,descricao});
    setObsResolucao('');
  };

  const confirmarResolucao=async()=>{
    if(!resolvendoPendencia)return;
    setSalvandoResolucao(true);
    await resolverPendencia(resolvendoPendencia.finId,resolvendoPendencia.categoria,resolvendoPendencia.itemId,obsResolucao.trim());
    setSalvandoResolucao(false);
    setResolvendoPendencia(null);
    setObsResolucao('');
  };

  const cancelarSolucao=async(finId,categoria,itemId)=>{
    const fin=finalizacoes.find(f=>f.id===finId);if(!fin)return;
    const now=Date.now();
    const newCat=(fin[categoria]||[]).map(p=>{
      if(p.id!==itemId)return p;
      const{resolvidoPor,resolvidoEm,...rest}=p;
      return{...rest,status:'Pendente',canceladoSolucaoPor:loggedInUser.user,canceladoSolucaoEm:now};
    });
    const novoHistorico=[...(fin.historico||[]),{acao:`Solução cancelada (${categoria})`,usuario:loggedInUser.user,timestamp:now}];
    try{await col('finalizacoes').doc(finId).update({[categoria]:stripUndefined(newCat),historico:stripUndefined(novoHistorico)});}
    catch(e){alert('Erro: '+e.message);}
  };

 const excluirProblema=async()=>{
    if(!confirmDelProb)return;
    const{finId,categoria,itemId}=confirmDelProb;
    const fin=finalizacoes.find(f=>f.id===finId);if(!fin)return;
    const problemaRemovido=(fin[categoria]||[]).find(p=>p.id===itemId);
    const newCat=(fin[categoria]||[]).filter(p=>p.id!==itemId);
    const now=Date.now();
    const labelCat=CATEGORIA_LABELS_HIST[categoria]||categoria;
    try{await col('finalizacoes').doc(finId).update({[categoria]:stripUndefined(newCat),historico:stripUndefined([...(fin.historico||[]),{acao:`Problema removido em ${labelCat}: "${problemaRemovido?.descricao||'(sem descrição)'}"`,usuario:loggedInUser.user,timestamp:now}])});}
    catch(e){alert('Erro: '+e.message);}
    setConfirmDelProb(null);
  };
  const excluirInspecao=async()=>{
    if(!confirmDelFin)return;
    try{await col('finalizacoes').doc(confirmDelFin).delete();}catch(e){alert('Erro: '+e.message);}
    setConfirmDelFin(null);
  };

const exportarPDF=async(fin,comFoto=true)=>{
    const pecasItems=getPecasParaOS(fin.os,requests);
    const doc=await buildFinalizacaoPDF(fin,pecasItems,comFoto);
    doc.save(`Finalizacao_OS_${fin.os}.pdf`);
  };

  const exportarExcel=()=>{
    const csvCell=(v)=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
const rows=[[csvCell('OS'),csvCell('Chassi'),csvCell('Modelo'),csvCell('Ajustes'),csvCell('Martelinho'),csvCell('Pintura'),csvCell('Vidro'),csvCell('Estética'),csvCell('Instalação Peças'),csvCell('Peças'),csvCell('Responsável')].join(';')];
  baseVisiveis.forEach(fin=>{
      const fmtProblemas=(items)=>(items||[]).map(p=>`${p.status==='Solucionado'?'[Solucionado]':'[Pendente]'} ${p.descricao||'(sem descrição)'}${p.tipo?' ('+p.tipo+')':''}`).join(' | ')||'—';
      const pecasItems=(pecasByOS[String(fin.os).trim()]||[]).filter(it=>!it.excedente);
      const fmtPecas=pecasItems.map(it=>`${it.quantity}x ${it.description} — ${it.statusOriginal||it.status||'Pendente'}`).join(' | ')||'—';
      rows.push([
        csvCell(fin.os),
        csvCell(fin.vehicleData?.chassi||'—'),
        csvCell(fin.vehicleData?.modelo||'—'),
        csvCell(fmtProblemas(fin.ajuste)),
        csvCell(fmtProblemas(fin.martelinho)),
        csvCell(fmtProblemas(fin.pintura)),
        csvCell(fmtProblemas(fin.vidro)),
        csvCell(fmtProblemas(fin.outro)),
        csvCell(fmtProblemas(fin.instalacaoPecas)),
        csvCell(fmtPecas),
        csvCell(fin.criadoPor||'—'),
      ].join(';'));
    });
    const blob=new Blob(['\uFEFF'+rows.join('\r\n')],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Finalizacoes_VRZ_${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.csv`;a.click();
  };

  return(
    <>
    <div className="fade-up" style={{paddingBottom:30}}>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',marginBottom:16}}>
        <div style={{position:'relative',flex:1,minWidth:200}}>
          <input type="text" placeholder="Buscar OS / Modelo / Usuário..." value={search} onChange={e=>setSearch(e.target.value)} className="input" style={{paddingLeft:36}}/>
          <div style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',color:'var(--muted)'}}><Icon name="search" size={14}/></div>
        </div>
        <button onClick={exportarExcel} style={{display:'flex',alignItems:'center',gap:6,padding:'10px 16px',background:'#059669',color:'#fff',border:'none',borderRadius:10,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer',fontFamily:'Plus Jakarta Sans,sans-serif',whiteSpace:'nowrap'}}>
          <Icon name="file-spreadsheet" size={14}/> Exportar Excel
        </button>
      </div>
      <div style={{display:'flex',gap:3,background:'var(--smoke)',padding:4,borderRadius:12,border:'1px solid var(--border)',width:'fit-content',marginBottom:16,flexWrap:'wrap'}}>
        {[{k:'pendentes',l:`Pendentes (${countPendentes})`},{k:'concluidos',l:`Concluídos (${countConcluidos})`}].map(t=>(
          <button key={t.k} onClick={()=>setSubTab(t.k)} style={{padding:'8px 16px',borderRadius:9,fontSize:9,fontWeight:800,textTransform:'uppercase',border:'none',cursor:'pointer',letterSpacing:'.06em',fontFamily:'Plus Jakarta Sans,sans-serif',background:subTab===t.k?'#fff':'transparent',color:subTab===t.k?'var(--red)':'var(--muted)',boxShadow:subTab===t.k?'0 2px 8px rgba(0,0,0,.08)':'none'}}>{t.l}</button>
        ))}
      </div>
      {visiveis.length===0?(
        <div style={{padding:'56px 20px',textAlign:'center',background:'#fff',borderRadius:16,border:'1.5px dashed var(--border)'}}>
          <Icon name="clipboard-check" size={30} style={{margin:'0 auto 10px',display:'block',color:'var(--muted)'}}/>
          <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',margin:0}}>Nenhuma inspeção {subTab==='concluidos'?'concluída':'pendente'} encontrada</p>
        </div>
      ):(
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {visiveis.map(fin=>{
      const categorias=[['ajuste','Ajuste','#F59E0B','wrench'],['martelinho','Martelinho','#DC1F1F','hammer'],['pintura','Pintura','#2563EB','paintbrush'],['vidro','Vidro','#0EA5E9','square'],['outro','Estética','#6B7280','more-horizontal'],['instalacaoPecas','Instalação Peças','#10B981','package']];
            const totalPend=['ajuste','martelinho','pintura','vidro','outro','instalacaoPecas'].reduce((a,c)=>a+(fin[c]||[]).filter(p=>p.status!=='Solucionado').length,0);
          const editar=podeEditar(fin);
           const pecasItems=pecasByOS[String(fin.os).trim()]||[];
            const pecasAtivas=pecasItems.filter(it=>!it.excedente);
            const pecasExc=pecasItems.filter(it=>it.excedente);
            const pecasSolucionadoHeader=pecasAtivas.length===0||pecasAtivas.every(it=>it.status==='Concluído');
            const inspecaoConcluida=totalPend===0&&pecasSolucionadoHeader;
            const dataSolucao=(()=>{
              if(!inspecaoConcluida)return null;
              const times=[];
              ['ajuste','martelinho','pintura','vidro'].forEach(cat=>(fin[cat]||[]).forEach(p=>{if(p.status==='Solucionado'&&p.resolvidoEm)times.push(p.resolvidoEm);}));
              pecasAtivas.forEach(it=>{if(it.actualDeliveryDate)times.push(new Date(it.actualDeliveryDate+'T00:00:00').getTime());});
              return times.length?Math.max(...times):fin.criadoEm;
            })();
            return(
              <div key={fin.id} className="card" style={{borderLeft:`3px solid ${totalPend>0?'var(--red)':'#059669'}`}}>
                <div style={{padding:'14px 16px',borderBottom:'1px solid var(--border)',background:'var(--smoke)',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                    <span style={{fontSize:14,fontWeight:800}}>OS #{fin.os}</span>
                    <span className="pill">{fin.unidade||'Unidade 1'}</span>
                    <span style={{fontSize:9,color:'var(--muted)',fontWeight:700,textTransform:'uppercase'}}>{fin.vehicleData?.modelo||'—'}</span>
                    <span style={{fontSize:8,fontWeight:700,color:'var(--muted)',display:'inline-flex',alignItems:'center',gap:3}}><Icon name="calendar" size={10}/> Aberto: {fin.criadoEm?new Date(fin.criadoEm).toLocaleDateString('pt-BR'):'—'}</span>
                    {inspecaoConcluida&&dataSolucao&&<span style={{fontSize:8,fontWeight:700,color:'#059669',display:'inline-flex',alignItems:'center',gap:3}}><Icon name="check-circle" size={10}/> Solucionado: {new Date(dataSolucao).toLocaleDateString('pt-BR')}</span>}
                   <span style={{fontSize:8,fontWeight:700,color:'var(--muted)'}}>Criado por {fin.criadoPor}</span>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontSize:9,fontWeight:800,padding:'3px 10px',borderRadius:999,background:totalPend>0?'var(--red-light)':'#EDFAF3',color:totalPend>0?'var(--red)':'#059669',border:`1px solid ${totalPend>0?'#FFBDBD':'#AAE6C5'}`}}>{totalPend>0?`${totalPend} pendente(s)`:'Tudo solucionado'}</span>
                   <button onClick={()=>setPdfConfirmFin(fin)} style={{display:'flex',alignItems:'center',gap:5,padding:'6px 12px',background:'#2563EB',color:'#fff',border:'none',borderRadius:7,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer'}}><Icon name="file-down" size={12}/> PDF</button>
                    {editar&&<button onClick={()=>setEditandoFin(fin)} style={{display:'flex',alignItems:'center',gap:5,padding:'6px 12px',background:'#F59E0B',color:'#fff',border:'none',borderRadius:7,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer'}}><Icon name="edit-3" size={12}/> Editar</button>}
                    {isMaster&&(
                      confirmDelFin===fin.id?(
                        <div style={{display:'flex',gap:5}}>
                          <button onClick={()=>setConfirmDelFin(null)} className="btn-ghost" style={{padding:'5px 10px',fontSize:8}}>Não</button>
                          <button onClick={excluirInspecao} style={{padding:'5px 10px',background:'var(--red)',color:'#fff',border:'none',borderRadius:7,fontSize:8,fontWeight:800,cursor:'pointer'}}>Confirmar</button>
                        </div>
                      ):(
                        <button onClick={()=>setConfirmDelFin(fin.id)} style={{display:'flex',alignItems:'center',gap:5,padding:'6px 12px',background:'var(--red)',color:'#fff',border:'none',borderRadius:7,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer'}}><Icon name="trash-2" size={12}/> Excluir</button>
                      )
                    )}
                  </div>
                </div>
                <div style={{padding:16,display:'flex',flexDirection:'column',gap:14}}>
                  {categorias.map(([key,label,color,icon])=>{
                    const items=fin[key]||[];
                    if(!items.length)return null;
                    return(
                      <div key={key}>
                        <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}>
                          <div style={{width:20,height:20,borderRadius:6,background:color,display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name={icon} size={11} style={{color:'#fff'}}/></div>
                          <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',margin:0}}>{label}</p>
                        </div>
                        <div style={{display:'flex',flexDirection:'column',gap:6}}>
                          {items.map(p=>(
                            <div key={p.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',background:p.status==='Solucionado'?'#F0FBF5':'var(--smoke)',border:`1px solid ${p.status==='Solucionado'?'#AAE6C5':'var(--border)'}`,borderRadius:9}}>
                              {p.foto?<img src={p.foto} style={{width:36,height:36,borderRadius:7,objectFit:'cover',flexShrink:0}}/>:<div style={{width:36,height:36,borderRadius:7,background:'#fff',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name={icon} size={14}/></div>}
                              <div style={{flex:1,minWidth:0}}>
                                <p style={{fontSize:10,fontWeight:600,margin:0,color:'var(--ink)'}}>{p.descricao||'(sem descrição)'}{p.tipo&&<span style={{marginLeft:6,fontSize:8,fontWeight:800,textTransform:'uppercase',padding:'1px 7px',borderRadius:999,background:p.tipo==='Interno'?'#EAF0FF':'#FFF4E6',color:p.tipo==='Interno'?'#1A4EC2':'#C45E00',border:`1px solid ${p.tipo==='Interno'?'#C0D0F5':'#FFD9A8'}`}}>{p.tipo}</span>}</p>
                                <p style={{fontSize:8,color:'var(--muted)',fontWeight:600,margin:'2px 0 0'}}>Adicionado por <strong>{p.criadoPor||'—'}</strong> em {p.criadoEm?new Date(p.criadoEm).toLocaleString('pt-BR'):'—'}</p>
                               {p.status==='Solucionado'&&<p style={{fontSize:8,color:'#059669',fontWeight:700,margin:'2px 0 0'}}>✓ Resolvido {p.resolvidoPor?`por ${p.resolvidoPor}`:''} {p.resolvidoEm?'em '+new Date(p.resolvidoEm).toLocaleString('pt-BR'):''}</p>}
                                {p.status==='Solucionado'&&p.obsResolucao&&<p style={{fontSize:8,color:'var(--muted)',fontWeight:600,margin:'2px 0 0',fontStyle:'italic'}}>Obs: {p.obsResolucao}</p>}
                              </div>
                              {p.status!=='Solucionado'&&editar&&(
                                <button onClick={()=>abrirResolucao(fin.id,key,p.id,p.descricao)} style={{padding:'5px 12px',background:'var(--ink)',color:'#fff',border:'none',borderRadius:7,fontSize:8,fontWeight:800,textTransform:'uppercase',cursor:'pointer',flexShrink:0,fontFamily:'Plus Jakarta Sans,sans-serif'}}>Resolver Pendência</button>
                              )}
                              {p.status==='Solucionado'&&(
                                <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0,flexWrap:'wrap'}}>
                                  <span className="badge badge-done">Solucionado</span>
                                  {editar&&<button onClick={()=>cancelarSolucao(fin.id,key,p.id)} style={{padding:'4px 10px',background:'#fff',border:'1px solid #FFBDBD',borderRadius:7,fontSize:7,fontWeight:800,textTransform:'uppercase',color:'var(--red)',cursor:'pointer',fontFamily:'Plus Jakarta Sans,sans-serif'}}>↩ Cancelar Solução</button>}
                                </div>
                              )}
                              {isMaster&&(
                                confirmDelProb?.finId===fin.id&&confirmDelProb?.categoria===key&&confirmDelProb?.itemId===p.id?(
                                  <div style={{display:'flex',gap:4,flexShrink:0}}>
                                    <button onClick={()=>setConfirmDelProb(null)} className="btn-ghost" style={{padding:'4px 8px',fontSize:7}}>Não</button>
                                    <button onClick={excluirProblema} style={{padding:'4px 8px',background:'var(--red)',color:'#fff',border:'none',borderRadius:6,fontSize:7,fontWeight:800,cursor:'pointer'}}>Sim</button>
                                  </div>
                                ):(
                                  <button onClick={()=>setConfirmDelProb({finId:fin.id,categoria:key,itemId:p.id})} style={{width:24,height:24,background:'#fff',border:'1px solid #FFBDBD',borderRadius:6,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'var(--red)',flexShrink:0}}><Icon name="trash-2" size={11}/></button>
                                )
                              )}
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })}

                  {pecasItems.length>0&&(()=>{
                    const pecasSolucionado=pecasAtivas.length===0||pecasAtivas.every(it=>it.status==='Concluído');
                    return(
                    <div>
                      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8,flexWrap:'wrap'}}>
                        <div style={{width:20,height:20,borderRadius:6,background:'#7C3AED',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="package" size={11} style={{color:'#fff'}}/></div>
                        <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',margin:0}}>Peças ({pecasAtivas.length})</p>

function FinalizacaoView({vehiclesDB,requests,loggedInUser,isMaster}){
  const isComercial=loggedInUser?.role==='comercial';
  const[sub,setSub]=useState(isComercial?'meus':'nova');
  const{data:finalizacoes,loading}=useFirestore('finalizacoes');

  useEffect(()=>{
    if(loading||!finalizacoes.length||!vehiclesDB.length)return;
    const sweep=async()=>{
      const now=Date.now();
      for(const fin of finalizacoes){
        if(fin.arquivada)continue;
        const v=vehiclesDB.find(vv=>String(vv.os).trim()===String(fin.os).trim());
        const entregue=v&&(String(v.etapa||'').trim().toLowerCase()==='entregue'||String(v.localizacao||'').trim().toLowerCase()==='entregue');
        if(!entregue)continue;
        if(!fin.entregueDetectadoEm){
          try{await col('finalizacoes').doc(fin.id).update({entregueDetectadoEm:now});}catch(e){}
          continue;
        }
        if(now-fin.entregueDetectadoEm<5*86400000)continue;
try{
          const pecasItems=getPecasParaOS(fin.os,requests);
          const doc=await buildFinalizacaoPDF(fin,pecasItems);
          // Firebase Storage indisponível no plano atual — salvamos o PDF direto
          // como base64 no próprio documento do Firestore (igual às fotos).
          let pdfDataUrl=null;
          try{
            pdfDataUrl=doc.output('datauristring');
          }catch(e){console.warn('Geração do PDF histórico falhou:',e);}
          if(!pdfDataUrl){
            console.warn('PDF não gerado para OS',fin.os,'— tentando novamente na próxima verificação.');
            continue; // nunca arquiva (e apaga os dados) sem o PDF pronto
          }
          await col('finalizacoesHistorico').add(stripUndefined({os:fin.os,unidade:fin.unidade,vehicleData:fin.vehicleData,criadoPor:fin.criadoPor,criadoEm:fin.criadoEm,arquivadoEm:now,pdfDataUrl}));
        await col('finalizacoes').doc(fin.id).update({arquivada:true,ajuste:[],martelinho:[],pintura:[],vidro:[],outro:[],instalacaoPecas:[],historico:[...(fin.historico||[]),{acao:'Inspeção arquivada automaticamente (5 dias após entrega)',usuario:'Sistema',timestamp:now}]});
        }catch(e){console.warn('Arquivamento automático falhou para OS',fin.os,e);}
      }
    };
    sweep();
    // eslint-disable-next-line
  },[finalizacoes.length,vehiclesDB.length]);

  return(
    <div className="fade-up" style={{paddingBottom:16}}>
      <div style={{marginBottom:16}}>
        <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.15em',color:'var(--red)',marginBottom:4}}>Inspeção Final</p>
        <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',margin:'0 0 14px'}}>
          <h2 style={{fontSize:30,fontWeight:800,margin:0,letterSpacing:'-.02em'}}>Finalização</h2>
          <LastUpdateBadge/>
        </div>
        <div style={{display:'flex',gap:3,background:'var(--smoke)',padding:4,borderRadius:12,border:'1px solid var(--border)',width:'fit-content',flexWrap:'wrap'}}>
         {[!isComercial&&{k:'nova',l:'Nova Inspeção'},{k:'meus',l:'Carros'},isMaster&&{k:'historico',l:'Histórico'}].filter(Boolean).map(t=>(
            <button key={t.k} onClick={()=>setSub(t.k)} style={{padding:'8px 16px',borderRadius:9,fontSize:9,fontWeight:800,textTransform:'uppercase',border:'none',cursor:'pointer',letterSpacing:'.06em',fontFamily:'Plus Jakarta Sans,sans-serif',background:sub===t.k?'#fff':'transparent',color:sub===t.k?'var(--red)':'var(--muted)',boxShadow:sub===t.k?'0 2px 8px rgba(0,0,0,.08)':'none'}}>{t.l}</button>
          ))}
        </div>
      </div>
      {loading?<Skeleton/>:(
        <>
          {sub==='nova'&&<NovaFinalizacaoForm vehiclesDB={vehiclesDB} requests={requests} loggedInUser={loggedInUser} isMaster={isMaster} finalizacoes={finalizacoes}/>}
          {sub==='meus'&&<MeusCarrosView loggedInUser={loggedInUser} isMaster={isMaster} finalizacoes={finalizacoes} requests={requests}/>}
          {sub==='historico'&&isMaster&&<FinalizacaoHistoricoView/>}
        </>
      )}
    </div>
  );
}

function PedidosExcedentesView({requests}){
  const excedentes=useMemo(()=>{
    const list=[];
    requests.forEach(req=>(req.items||[]).forEach(it=>{
      if(it.excedente===true)list.push({reqId:req.id,os:req.os,unidade:req.unidade,vehicleData:req.vehicleData,item:it});
    }));
    return list.sort((a,b)=>(b.item.excedenteEm||0)-(a.item.excedenteEm||0));
  },[requests]);

  const manter=async(reqId,itemId)=>{
    const req=requests.find(r=>r.id===reqId);if(!req)return;
    const newItems=req.items.map(it=>{
      if(String(it.id)!==String(itemId))return it;
      const{excedente,excedentePor,excedenteEm,...rest}=it;
      return rest;
    });
    try{await col('requests').doc(reqId).update({items:stripUndefined(newItems)});}
    catch(e){alert('Erro: '+e.message);}
  };

  const excluir=async(reqId,itemId)=>{
    if(!window.confirm('Excluir esta peça do pedido de compra?'))return;
    const req=requests.find(r=>r.id===reqId);if(!req)return;
    const newItems=req.items.filter(it=>String(it.id)!==String(itemId));
    try{
      if(newItems.length===0)await col('requests').doc(reqId).delete();
      else await col('requests').doc(reqId).update({items:stripUndefined(newItems)});
    }catch(e){alert('Erro: '+e.message);}
  };

  if(excedentes.length===0)return(
    <div style={{padding:'56px 20px',textAlign:'center',background:'#fff',borderRadius:16,border:'1.5px dashed var(--border)'}}>
      <Icon name="package-minus" size={30} style={{margin:'0 auto 10px',display:'block',color:'var(--muted)'}}/>
      <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',margin:0}}>Nenhum pedido excedente registrado</p>
    </div>
  );

  return(
   <div className="card" style={{overflow:'hidden'}}>
          <div className="table-scroll">
          <table className="vtable w-full" style={{minWidth:500}}>
            <thead><tr><th>OS</th><th>Veículo</th><th>Peça</th><th>Qtd</th><th>Marcado por</th><th>Data</th><th style={{textAlign:'right'}}>Ação</th></tr></thead>
        <tbody>
          {excedentes.map((e,i)=>(
            <tr key={i}>
              <td style={{fontWeight:800}}>#{e.os}</td>
              <td style={{textTransform:'uppercase',fontSize:10}}>{e.vehicleData?.modelo||'—'}</td>
              <td style={{fontWeight:700,textTransform:'uppercase',fontSize:11}}>{e.item.description}</td>
              <td style={{textAlign:'center'}}>{e.item.quantity}</td>
              <td style={{fontSize:10,color:'var(--muted)'}}>{e.item.excedentePor||'—'}</td>
              <td style={{fontSize:10,color:'var(--muted)'}}>{e.item.excedenteEm?new Date(e.item.excedenteEm).toLocaleDateString('pt-BR'):'—'}</td>
              <td style={{textAlign:'right'}}>
                <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
                  <button onClick={()=>manter(e.reqId,e.item.id)} style={{padding:'5px 12px',background:'#059669',color:'#fff',border:'none',borderRadius:7,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer'}}>Manter</button>
                  <button onClick={()=>excluir(e.reqId,e.item.id)} style={{padding:'5px 12px',background:'var(--red)',color:'#fff',border:'none',borderRadius:7,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer'}}>Excluir</button>
                </div>
              </td>
            </tr>
          ))}
       </tbody>
      </table>
      </div>
    </div>
  );

function ResumoReuniaoView({requests}){
  const [periodo, setPeriodo] = useState('semanal'); // 'semanal', 'quinzenal', 'mensal'
  const [offset, setOffset] = useState(0);
  const [diaSelecionado, setDiaSelecionado] = useState(null);
  const [osMultiDiaAberto, setOsMultiDiaAberto] = useState(false);

  const { inicioPeriodo, fimPeriodo, numDias } = useMemo(() => {
    const agora = new Date();
    let ini, fim, n;

    if (periodo === 'semanal') {
      const diaSem = agora.getDay();
      ini = new Date(agora);
      ini.setDate(agora.getDate() - diaSem + (offset * 7));
      ini.setHours(0, 0, 0, 0);
      fim = new Date(ini);
      fim.setDate(ini.getDate() + 6);
      fim.setHours(23, 59, 59, 999);
      n = 7;
    } else if (periodo === 'quinzenal') {
      // Calcula a quinzena atual (1 ou 2 do mês)
      const quinzenaAtual = agora.getDate() <= 15 ? 0 : 1;
      const totalQuinzenas = (agora.getFullYear() * 24 + agora.getMonth() * 2 + quinzenaAtual) + offset;
      const year = Math.floor(totalQuinzenas / 24);
      const month = Math.floor((totalQuinzenas % 24) / 2);
      const isSecondHalf = totalQuinzenas % 2 !== 0;
      
      ini = new Date(year, month, isSecondHalf ? 16 : 1);
      ini.setHours(0, 0, 0, 0);
      if (isSecondHalf) {
        fim = new Date(year, month + 1, 0);
      } else {
        fim = new Date(year, month, 15);
      }
    fim.setHours(23, 59, 59, 999);
      n = fim.getDate() - ini.getDate() + 1;
    } else {
      const totalMonths = (agora.getFullYear() * 12 + agora.getMonth()) + offset;
      const year = Math.floor(totalMonths / 12);
      const month = totalMonths % 12;
      ini = new Date(year, month, 1);
      ini.setHours(0, 0, 0, 0);
      fim = new Date(year, month + 1, 0);
      fim.setHours(23, 59, 59, 999);
      n = fim.getDate();
    }
    return { inicioPeriodo: ini, fimPeriodo: fim, numDias: n };
  }, [periodo, offset]);

  const isPeriodoAtual = offset === 0;
  const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

  const diasDoPeriodo = useMemo(() => {
    return Array.from({ length: numDias }, (_, i) => {
      const d = new Date(inicioPeriodo);
      d.setDate(inicioPeriodo.getDate() + i);
      return {
        label: diasSemana[d.getDay()],
        date: d.toISOString().slice(0, 10),
        isHoje: d.toDateString() === new Date().toDateString(),
        pedidos: [],
        osSet: new Set(),
      };
    });
  }, [inicioPeriodo, numDias]);


 const dadosDia = useMemo(() => {
    const map = {};
    diasDoPeriodo.forEach(d => { map[d.date] = { ...d, pedidos: [], osSet: new Set() }; });

    // Usa a mesma consolidação de partes/doações da aba Análises, pra bater 100% com ela.
    const pedidos = pedidosConsolidados(requests);

    pedidos.forEach(r => {
      if (!r.timestamp) return;
      const dt = new Date(r.timestamp);
      const key = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
      if (map[key]) {
        map[key].pedidos.push(r);
        if (r.os) map[key].osSet.add(String(r.os).trim());
      }
    });
    return Object.values(map);
  }, [requests, diasDoPeriodo]);

  // OS's que tiveram pedidos de peças em mais de um dia dentro do período selecionado
  const osComPedidosEmDiasDiferentes = useMemo(() => {
    const pedidos = pedidosConsolidados(requests).filter(r => {
      if (!r.timestamp) return false;
      const dt = new Date(r.timestamp);
      return dt >= inicioPeriodo && dt <= fimPeriodo;
    });
    const porOS = {};
    pedidos.forEach(r => {
      const os = String(r.os || '').trim();
      if (!os) return;
      const dt = new Date(r.timestamp);
      const dayKey = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
      if (!porOS[os]) porOS[os] = { os, vehicleData: r.vehicleData, dias: {} };
      if (!porOS[os].vehicleData && r.vehicleData) porOS[os].vehicleData = r.vehicleData;
      if (!porOS[os].dias[dayKey]) porOS[os].dias[dayKey] = [];
      porOS[os].dias[dayKey].push(r);
    });
    return Object.values(porOS)
      .filter(g => Object.keys(g.dias).length > 1)
      .map(g => ({
        ...g,
        diasOrdenados: Object.entries(g.dias).sort((a, b) => a[0].localeCompare(b[0])),
        totalDias: Object.keys(g.dias).length,
        totalPedidos: Object.values(g.dias).reduce((a, arr) => a + arr.length, 0),
      }))
      .sort((a, b) => b.totalDias - a.totalDias);
  }, [requests, inicioPeriodo, fimPeriodo]);

// Estas duas métricas usam a MESMA fórmula das barras/rótulos abaixo — garante 100% de
  // fidelidade entre os cartões do topo e o que está desenhado no gráfico, sempre.
 const totalPecasPeriodo = dadosDia.reduce((a, d) => a + d.pedidos.reduce((s, p) => s + (p.items?.length || 0), 0), 0);
const osUnicasPeriodo = new Set(dadosDia.flatMap(d => Array.from(d.osSet))).size;
const mediaPorCarro = osUnicasPeriodo > 0 ? (totalPecasPeriodo / osUnicasPeriodo).toFixed(1) : '0';
const maxPedDia = Math.max(...dadosDia.map(d => d.pedidos.reduce((s, p) => s + (p.items?.length || 0), 0)), 1);

  const exportarAuditoriaPedidos = () => {
    const csvCellP = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const rows = [[csvCellP('Doc ID'), csvCellP('OS'), csvCellP('Data/Hora Envio'), csvCellP('Solicitante'), csvCellP('Peças no Documento'), csvCellP('Descrição das Peças'), csvCellP('Grupo de Consolidação'), csvCellP('Incluído no Gráfico?'), csvCellP('Motivo')].join(';')];
    requests.forEach(r => {
      if (!r.timestamp) return;
      const dt = new Date(r.timestamp);
      if (dt < inicioPeriodo || dt > fimPeriodo) return;
      const todasDoadas = r.items?.length > 0 && r.items.every(it => it.donatedTo);
      const key = r.loteId ? `lote_${r.loteId}` : (r.parte ? `${r.os}_${r.responsavel}_${r.totalPartes}_legacy` : r.id);
      const descItens = (r.items || []).map(it => `${it.quantity}x ${it.description || '(sem descrição)'}`).join(' | ') || '—';
      rows.push([
        csvCellP(r.id),
        csvCellP(r.os),
        csvCellP(dt.toLocaleString('pt-BR')),
        csvCellP(r.responsavel || '—'),
        csvCellP(r.items?.length || 0),
        csvCellP(descItens),
        csvCellP(key),
        csvCellP(todasDoadas ? 'NÃO' : 'SIM'),
        csvCellP(todasDoadas ? 'Cópia automática de doação (100% dos itens são donatedTo)' : '-'),
      ].join(';'));
    });
    rows.push('');
    rows.push([csvCellP('GERADO EM'), csvCellP(new Date().toLocaleString('pt-BR'))].join(';'));
    rows.push([csvCellP('PERÍODO'), csvCellP(`${inicioPeriodo.toLocaleDateString('pt-BR')} a ${fimPeriodo.toLocaleDateString('pt-BR')}`)].join(';'));
    rows.push([csvCellP('TOTAL DE PEÇAS CALCULADO PELO GRÁFICO'), csvCellP(totalPecasPeriodo)].join(';'));
    rows.push([csvCellP('TOTAL DE OS ÚNICAS CALCULADO PELO GRÁFICO'), csvCellP(osUnicasPeriodo)].join(';'));
    const blob = new Blob(['\uFEFF' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Auditoria_Pecas_${inicioPeriodo.toLocaleDateString('pt-BR').replace(/\//g, '-')}_a_${fimPeriodo.toLocaleDateString('pt-BR').replace(/\//g, '-')}.csv`;
    a.click();
  };

const dadosCompra = useMemo(() => {
    const map = {};
    diasDoPeriodo.forEach(d => { map[d.date] = { ...d, itens: [], valor: 0, osSet: new Set() }; });
   const osComCompra = new Set();
    requests.forEach(r => {
      (r.items || []).forEach(it => {
        if (!it.boughtAt) return;
       if (it.duplicataDeDoacao) return; // só exclui se a compra já existia ANTES da doação (duplicata real)
        const dateKey = String(it.boughtAt).trim().slice(0, 10);
        if (map[dateKey]) {
          const preco = parsePrice(it.price);
          map[dateKey].itens.push({ ...it, os: r.os, _preco: preco });
          map[dateKey].valor += preco;
          if (r.os) { map[dateKey].osSet.add(String(r.os).trim()); osComCompra.add(String(r.os).trim()); }
        }
      });
    });
    const dias = Object.values(map);
    const totalValor = dias.reduce((a, d) => a + d.valor, 0);
    const totalItens = dias.reduce((a, d) => a + d.itens.length, 0);
    const mediaValorOS = osComCompra.size > 0 ? (totalValor / osComCompra.size) : 0;
    return { dias, totalItens, osUnicas: osComCompra.size, totalValor, mediaValorOS };
  }, [requests, diasDoPeriodo]);

const csvCellRR = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const exportarAuditoriaCompras = () => {
    const rows = [[csvCellRR('OS'), csvCellRR('Peça'), csvCellRR('Qtd'), csvCellRR('Valor'), csvCellRR('Fornecedor'), csvCellRR('Data Compra'), csvCellRR('Incluído no Gráfico?'), csvCellRR('Motivo')].join(';')];
    requests.forEach(r => {
      (r.items || []).forEach(it => {
        if (!it.boughtAt) return;
        const dt = new Date(String(it.boughtAt).trim().slice(0, 10) + 'T00:00:00');
        if (dt < inicioPeriodo || dt > fimPeriodo) return;
        const excluido = !!it.duplicataDeDoacao;
        rows.push([
          csvCellRR(r.os),
          csvCellRR(it.description || '(sem descrição)'),
          csvCellRR(it.quantity || 1),
          csvCellRR(parsePrice(it.price).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })),
          csvCellRR(it.supplier || '-'),
          csvCellRR(it.boughtAt),
          csvCellRR(excluido ? 'NÃO' : 'SIM'),
          csvCellRR(excluido ? `Cópia de doação (transferido para OS ${it.donatedTo})` : '-'),
        ].join(';'));
      });
    });
    rows.push('');
    rows.push([csvCellRR('GERADO EM'), csvCellRR(new Date().toLocaleString('pt-BR'))].join(';'));
    rows.push([csvCellRR('PERÍODO'), csvCellRR(`${inicioPeriodo.toLocaleDateString('pt-BR')} a ${fimPeriodo.toLocaleDateString('pt-BR')}`)].join(';'));
    rows.push([csvCellRR('TOTAL CALCULADO PELO GRÁFICO'), csvCellRR(fmtBRL(dadosCompra.totalValor))].join(';'));
    const blob = new Blob(['\uFEFF' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Auditoria_Compras_${inicioPeriodo.toLocaleDateString('pt-BR').replace(/\//g, '-')}_a_${fimPeriodo.toLocaleDateString('pt-BR').replace(/\//g, '-')}.csv`;
    a.click();
  };
  const maxValDia = Math.max(...dadosCompra.dias.map(d => d.valor), 1);

  // Helper para renderizar gráfico estilo "Diretoria"
  const renderChart = (canvas, data, maxValue, type, sempreMostrarRotulos) => {
    if (!canvas) return;
   const ctx = canvas.getContext('2d');
    const dpr = Math.max(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    
    // Ajuste de DPI para evitar embaçamento
    if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
    }
    
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.scale(dpr, dpr);
    
    const displayW = rect.width, displayH = rect.height;
   const padL = 72, padR = 40, bot = 96, top = 40;
    const chartH = displayH - bot - top, chartW = displayW - padL - padR;
    const n = data.length;
    const bw = chartW / n;
    const barGap = n > 15 ? 0.1 : 0.25;
    
    // Grid lines
    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = '#E5E7EB';
    ctx.lineWidth = 1;
    [0, 0.25, 0.5, 0.75, 1].forEach(p => {
      const y = top + chartH * (1 - p);
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(displayW - padR, y);
      ctx.stroke();
      
      ctx.setLineDash([]);
      ctx.fillStyle = '#6B7280';
      ctx.font = '600 11px Plus Jakarta Sans';
      ctx.textAlign = 'right';
      let label;
      if (type === 'valor') {
        const v = maxValue * p;
        label = v >= 1000 ? 'R$ ' + (v / 1000).toFixed(1).replace('.', ',') + 'k' : 'R$ ' + Math.round(v);
      } else {
        label = Math.round(maxValue * p);
      }
      ctx.fillText(label, padL - 10, y + 4);
      ctx.setLineDash([3, 3]);
    });
    ctx.setLineDash([]);

    // Coordenadas das barras para detecção de clique
    const barRects = [];

   data.forEach((d, i) => {
      // Para 'pedidos', a barra mostra o total de PEÇAS solicitadas no dia;
      // 'count' mostra quantos pedidos/OS geraram essas peças (rótulo abaixo da barra)
      const val = type === 'valor' ? d.valor : d.pedidos.reduce((a, p) => a + (p.items?.length || 0), 0);
      const count = type === 'valor' ? d.itens.length : d.osSet.size;
      const x = padL + i * bw;
      const bh = maxValue > 0 ? (val / maxValue) * chartH : 0;
      const bx = x + bw * barGap, bwidth = bw * (1 - barGap * 2);
      const barY = top + chartH - Math.max(bh, 2);
      const barH = Math.max(bh, 2);

      barRects.push({ x: bx, y: barY, w: bwidth, h: barH, data: d });

      // Draw Bar
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(bx, barY, bwidth, barH, [6, 6, 0, 0]);
      } else {
        ctx.rect(bx, barY, bwidth, barH);
      }
      ctx.fillStyle = diaSelecionado?.date === d.date ? '#A81515' : '#DC1F1F';
      ctx.fill();

      // Value on top - Mostrar sempre conforme solicitado
      if (val > 0) {
        ctx.fillStyle = '#000';
        ctx.font = 'bold 10px Plus Jakarta Sans';
        ctx.textAlign = 'center';
      let vStr;
        if (type === 'valor') {
          // Valor exato — sem abreviação em "k" — para fidelidade financeira total
          vStr = 'R$ ' + val.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        } else {
          vStr = val;
        }
        // No mensal, rotacionar se necessário ou diminuir fonte
      if (periodo === 'mensal') {
          ctx.save();
          ctx.translate(x + bw / 2, barY - 12);
          ctx.rotate(-Math.PI / 4);
          ctx.fillText(vStr, 0, 0);
          ctx.restore();
        } else {
          ctx.fillText(vStr, x + bw / 2, barY - 8);
        }
      }
// X-axis Labels - semanal/quinzenal sempre mostram todas; mensal só mostra algumas para não poluir
   if (sempreMostrarRotulos || n <= 15 || i % Math.ceil(n/10) === 0 || i === n - 1) {
        ctx.fillStyle = '#000';
        ctx.font = 'bold 10px Plus Jakarta Sans';
        ctx.textAlign = 'center';
        ctx.fillText(d.label, x + bw / 2, displayH - 70);
        
        const dtParts = d.date.split('-');
        ctx.fillStyle = '#6B7280';
        ctx.font = '500 9px Plus Jakarta Sans';
        ctx.fillText(`${dtParts[2]}/${dtParts[1]}`, x + bw / 2, displayH - 57);
      }

  // Rótulo abaixo da barra: itens + OS's que geraram o valor (gráfico de compras) ou peças + OS's (gráfico de pedidos)
    if ((sempreMostrarRotulos || n <= 15 || diaSelecionado?.date === d.date) && (count > 0 || val > 0)) {
        ctx.fillStyle = '#DC1F1F';
        ctx.font = 'bold 9px Plus Jakarta Sans';
        ctx.textAlign = 'center';
        if (type === 'valor') {
          const osQtd = d.osSet ? d.osSet.size : 0;
          ctx.fillText(`${count} item${count !== 1 ? 's' : ''}`, x + bw / 2, displayH - 30);
          ctx.fillText(`${osQtd} OS${osQtd !== 1 ? "'s" : ''}`, x + bw / 2, displayH - 15);
        } else {
          ctx.fillText(`${count} OS${count !== 1 ? "'s" : ''}`, x + bw / 2, displayH - 15);
        }
      }
    });
    ctx.restore();

    // Adicionar listener de clique (removendo anterior se houver)
    canvas.onclick = (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      
      const clickedBar = barRects.find(r => 
        clickX >= r.x && clickX <= r.x + r.w && 
        clickY >= r.y - 20 && clickY <= r.y + r.h + 40
      );
      
      if (clickedBar) {
        setDiaSelecionado(clickedBar.data);
      } else {
        setDiaSelecionado(null);
      }
    };
  };

  const refBar1 = useRef(null);
  const refBar2 = useRef(null);

 useEffect(() => {
    const desenhar = () => {
      const sempreMostrarRotulos = periodo !== 'mensal';
      renderChart(refBar1.current, dadosDia, maxPedDia, 'pedidos', sempreMostrarRotulos);
      renderChart(refBar2.current, dadosCompra.dias, maxValDia, 'valor', sempreMostrarRotulos);
    };
    desenhar();
    window.addEventListener('resize', desenhar);
    return () => window.removeEventListener('resize', desenhar);
  }, [dadosDia, maxPedDia, dadosCompra, maxValDia, periodo, diaSelecionado]);
  const fmtPeriodo = `${inicioPeriodo.toLocaleDateString('pt-BR')} – ${fimPeriodo.toLocaleDateString('pt-BR')}`;

  return (
    <div className="fade-up" style={{ paddingBottom: 40 }}>
      {/* Header com Seleção de Período */}
      <div style={{ marginBottom: 24 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 16 }}>
          <div>
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, background: '#0D0D0D', borderRadius: 8, padding: '4px 12px', marginBottom: 12 }}>
              <span className="pulse-beacon" style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--red)', display: 'inline-block' }} />
              <span style={{ fontSize: 8, fontWeight: 800, textTransform: 'uppercase', letterSpacing: '.14em', color: 'rgba(255, 255, 255, .6)' }}>Relatório de Diretoria</span>
            </div>
          <h2 style={{ fontSize: 34, fontWeight: 800, margin: '0', letterSpacing: '-.03em', lineHeight: 1 }}>Resumo {periodo === 'semanal' ? 'da Semana' : periodo === 'quinzenal' ? 'da Quinzena' : 'do Mês'}</h2>
            <div style={{marginTop:10}}><LastUpdateBadge/></div>
          </div>

          {/* Seletores de Período */}
          <div style={{ display: 'flex', background: 'var(--smoke)', padding: 4, borderRadius: 12, border: '1.5px solid var(--border)' }}>
            {['semanal', 'quinzenal', 'mensal'].map(p => (
              <button
                key={p}
                onClick={() => { setPeriodo(p); setOffset(0); }}
                style={{
                  padding: '8px 16px',
                  borderRadius: 8,
                  border: 'none',
                  fontSize: 10,
                  fontWeight: 800,
                  textTransform: 'uppercase',
                  cursor: 'pointer',
                  background: periodo === p ? '#fff' : 'transparent',
                  color: periodo === p ? 'var(--red)' : 'var(--muted)',
                  boxShadow: periodo === p ? '0 2px 8px rgba(0,0,0,.05)' : 'none',
                  transition: 'all .2s'
                }}
              >
                {p}
              </button>
            ))}
          </div>
        </div>

        {/* Navegação */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 16 }}>
          <div style={{ display: 'flex', alignItems: 'center', background: '#fff', border: '1.5px solid var(--border)', borderRadius: 12, overflow: 'hidden' }}>
            <button
              onClick={() => setOffset(o => o - 1)}
              style={{ padding: '10px 16px', background: 'none', border: 'none', cursor: 'pointer', color: 'var(--ink)', display: 'flex', alignItems: 'center', gap: 5, fontFamily: 'Plus Jakarta Sans,sans-serif', fontSize: 11, fontWeight: 700 }}
            >
              <Icon name="chevron-left" size={16} /> Anterior
            </button>
            <div style={{ padding: '10px 20px', borderLeft: '1px solid var(--border)', borderRight: '1px solid var(--border)', textAlign: 'center', minWidth: 200 }}>
              <p style={{ fontSize: 12, fontWeight: 800, margin: 0 }}>{fmtPeriodo}</p>
              {isPeriodoAtual && <p style={{ fontSize: 8, fontWeight: 800, textTransform: 'uppercase', color: 'var(--red)', margin: '2px 0 0' }}>Período atual</p>}
            </div>
            <button
              onClick={() => setOffset(o => o + 1)}
              disabled={isPeriodoAtual}
              style={{ padding: '10px 16px', background: 'none', border: 'none', cursor: isPeriodoAtual ? 'not-allowed' : 'pointer', color: isPeriodoAtual ? '#D0C9C4' : 'var(--ink)', display: 'flex', alignItems: 'center', gap: 5, fontFamily: 'Plus Jakarta Sans,sans-serif', fontSize: 11, fontWeight: 700 }}
            >
              Próxima <Icon name="chevron-right" size={16} />
            </button>
          </div>
          {!isPeriodoAtual && (
            <button onClick={() => setOffset(0)} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '10px 16px', background: 'var(--ink)', color: '#fff', border: 'none', borderRadius: 10, fontSize: 10, fontWeight: 800, textTransform: 'uppercase', cursor: 'pointer' }}>
              <Icon name="rotate-ccw" size={13} /> Atual
            </button>
          )}
        </div>
      </div>

     {/* KPIs */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))', gap: 10, marginBottom: 24 }}>
        {[
         { label: 'Peças no período', v: totalPecasPeriodo, sub: `${osUnicasPeriodo} OS's no período`, icon: 'clipboard-list', dark: true },
          { label: 'Média por veículo', v: mediaPorCarro, sub: 'peças / carro', icon: 'car', red: true },
          { label: 'Itens comprados', v: dadosCompra.totalItens, sub: `${dadosCompra.osUnicas} OS com compra`, icon: 'shopping-bag' },
          { label: 'Valor médio / OS', v: dadosCompra.mediaValorOS > 0 ? fmtBRL(dadosCompra.mediaValorOS) : '—', sub: 'no período', icon: 'trending-up' },
          { label: 'Total gasto', v: dadosCompra.totalValor > 0 ? fmtBRL(dadosCompra.totalValor) : '—', sub: 'em compras', icon: 'banknote' },
          { label: "OS's c/ pedidos em dias diferentes", v: osComPedidosEmDiasDiferentes.length, sub: 'clique para ver detalhes', icon: 'calendar-clock', dark: true, onClick: () => setOsMultiDiaAberto(true) },
        ].map((k, i) => (
          <div key={i} onClick={k.onClick} style={{ background: k.dark ? '#0D0D0D' : k.red ? 'var(--red)' : 'var(--smoke)', color: k.dark || k.red ? '#fff' : 'var(--ink)', borderRadius: 14, padding: '16px 18px', border: (!k.dark && !k.red) ? '1.5px solid var(--border)' : 'none', cursor: k.onClick ? 'pointer' : 'default' }}>
            <div style={{ width: 28, height: 28, borderRadius: 7, background: k.dark || k.red ? 'rgba(255,255,255,.12)' : 'var(--border)', display: 'flex', alignItems: 'center', justifySelf: 'center', marginBottom: 12 }}><Icon name={k.icon} size={14} /></div>
            <p style={{ fontSize: String(k.v).length > 7 ? 18 : 28, fontWeight: 800, lineHeight: 1, margin: 0 }}>{k.v}</p>
            <p style={{ fontSize: 8, fontWeight: 800, textTransform: 'uppercase', marginTop: 5, opacity: .65 }}>{k.label}</p>
            <p style={{ fontSize: 8, fontWeight: 500, marginTop: 2, opacity: .4 }}>{k.sub}</p>
          </div>
        ))}
      </div>

     {/* Gráfico 1: Pedidos */}
      <div className="card" style={{ padding: 24, marginBottom: 16 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 20, flexWrap: 'wrap', gap: 10 }}>
          <div>
            <p style={{ fontSize: 8, fontWeight: 800, textTransform: 'uppercase', color: 'var(--red)', margin: '0 0 4px' }}>Peças por dia</p>
            <h3 style={{ fontSize: 18, fontWeight: 800, margin: 0 }}>Volume de Requisições</h3>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
            <button onClick={exportarAuditoriaPedidos} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '7px 14px', background: 'var(--ink)', color: '#fff', border: 'none', borderRadius: 8, fontSize: 9, fontWeight: 800, textTransform: 'uppercase', cursor: 'pointer', fontFamily: 'Plus Jakarta Sans,sans-serif' }}>
              <Icon name="shield-check" size={13} /> Auditoria
            </button>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>

          <div style={{ background: '#fff', borderRadius: 24, overflow: 'hidden', maxWidth: 640, width: '100%', maxHeight: '90vh', display: 'flex', flexDirection: 'column' }}>
            <div style={{ background: 'var(--ink)', padding: '24px 28px', color: '#fff', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>

            </div>
            <div className="scroll-y" style={{ padding: 24, flex: 1 }}>

                  {osComPedidosEmDiasDiferentes.map((g, gi) => (
                    <div key={gi} className="card" style={{ padding: 14 }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10, flexWrap: 'wrap', gap: 6 }}>
                        <div>
                          <span style={{ fontSize: 14, fontWeight: 800 }}>OS #{g.os}</span>

                        </div>
                        <span className="pill" style={{ fontSize: 8 }}>{g.totalDias} dias · {g.totalPedidos} pedido{g.totalPedidos !== 1 ? 's' : ''}</span>
