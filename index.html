          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
            <div style={{width:40,height:40,background:'#7C3AED',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name="database" size={18}/></div>
            <div><p style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.12em',color:'rgba(255,255,255,.35)',margin:0}}>Pedidos no Firebase</p><p style={{fontSize:9,color:'rgba(255,255,255,.2)',margin:0}}>Limite ~{LIM.toLocaleString()}</p></div>
          </div>
          <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',marginBottom:8}}>
            <span style={{fontSize:44,fontWeight:800,lineHeight:1}}>{total.toLocaleString()}</span>
            <span style={{fontSize:10,color:'rgba(255,255,255,.4)',fontWeight:600}}>de ~{LIM.toLocaleString()}</span>
          </div>
          <div className="progress-track" style={{background:'rgba(255,255,255,.08)',marginBottom:6}}><div className="progress-fill" style={{width:`${pctPed}%`,background:corB}}/></div>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:16}}><span style={{fontSize:8,fontWeight:800,textTransform:'uppercase',color:corB}}>{alerta}</span><span style={{fontSize:9,fontWeight:700,color:'rgba(255,255,255,.35)'}}>{pctPed.toFixed(1)}%</span></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:8,borderTop:'1px solid rgba(255,255,255,.08)',paddingTop:14}}>
            {[{l:'Ativos',v:ativos,c:'#2563EB'},{l:'Concluídos',v:totalConc,c:'#059669'},{l:'Restam',v:restam,c:'#7C3AED'},{l:'Finalizações',v:totalFinalizacoes,c:'#F59E0B'}].map((m,i)=>(
              <div key={i} style={{textAlign:'center',background:'rgba(255,255,255,.05)',borderRadius:10,padding:'10px 8px'}}>
                <p style={{fontSize:26,fontWeight:800,lineHeight:1,margin:0,color:m.c}}>{m.v}</p>
                <p style={{fontSize:7,fontWeight:800,textTransform:'uppercase',color:'rgba(255,255,255,.3)',margin:'4px 0 0'}}>{m.l}</p>
              </div>
            ))}
          </div>
        </div>
        <div className="card" style={{padding:20}}>
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
            <div style={{width:40,height:40,background:'var(--ink)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name="hard-drive" size={18} style={{color:'#fff'}}/></div>
            <div><p style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.12em',color:'var(--muted)',margin:0}}>Storage Estimado</p><p style={{fontSize:9,color:'var(--muted)',margin:0}}>Peças + Finalização (fotos e PDFs)</p></div>
          </div>
          <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',marginBottom:8}}><span style={{fontSize:36,fontWeight:800,lineHeight:1}}>{fmtBytes(bytesU)}</span><span style={{fontSize:10,color:'var(--muted)',fontWeight:600}}>de 1 GB</span></div>
          <div className="progress-track" style={{marginBottom:6}}><div className="progress-fill" style={{width:`${pctSt}%`,background:pctSt>=85?'var(--red)':pctSt>=60?'#F59E0B':'#7C3AED'}}/></div>
          <p style={{fontSize:9,color:'var(--muted)',fontWeight:600,marginBottom:14}}>{pctSt.toFixed(1)}% usado</p>
          <div style={{background:'#FFFBE6',border:'1px solid #FFE680',borderRadius:10,padding:12}}><p style={{fontSize:8,fontWeight:800,textTransform:'uppercase',color:'#856A00',margin:'0 0 4px'}}>💡 Dica</p><p style={{fontSize:9,color:'#856A00',fontWeight:600,lineHeight:1.5,margin:0}}>Arquive e exclua concluídos regularmente.</p></div>
        </div>
      </div>
      <div className="card" style={{overflow:'hidden'}}>
        <div style={{padding:'14px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
          <div><p style={{fontSize:12,fontWeight:800,textTransform:'uppercase',margin:0}}>Arquivar Pedidos Concluídos</p><p style={{fontSize:9,color:'var(--muted)',fontWeight:600,margin:0,marginTop:2}}>Exporte e exclua para liberar capacidade</p></div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {[{label:'Excel',icon:'file-spreadsheet',cb:exportCSV,bg:'#059669',disabled:!qtdSel},{label:'PDF',icon:'file-down',cb:exportPDF,bg:'#2563EB',disabled:!qtdSel||exportando,sp:exportando},{label:'Excluir',icon:'trash-2',cb:()=>qtdSel&&setConfirmar(true),bg:'var(--red)',disabled:!qtdSel||excluindo}].map((b,i)=>(
              <button key={i} onClick={b.cb} disabled={b.disabled} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',background:b.disabled?'var(--smoke)':b.bg,color:b.disabled?'var(--muted)':'#fff',border:'none',borderRadius:8,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:b.disabled?'not-allowed':'pointer'}}>
                {b.sp?<Icon name="loader" size={13} className="spin"/>:<Icon name={b.icon} size={13}/>} {b.label} ({qtdSel})
              </button>
            ))}
          </div>
        </div>
        {concluidos.length===0?(
          <div style={{padding:'48px 20px',textAlign:'center'}}><p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',margin:0}}>Nenhum pedido totalmente concluído</p></div>
        ):(
          <>
            <div style={{overflowX:'auto'}}>
              <table className="vtable w-full" style={{minWidth:750}}>
                <thead><tr><th style={{width:40}}><input type="checkbox" checked={todosSel} onChange={toggleTodos} style={{width:15,height:15,accentColor:'var(--red)',cursor:'pointer'}}/></th>{['OS','Unidade','Veículo','Solicitante','Data','Itens','Valor'].map(h=><th key={h}>{h}</th>)}</tr></thead>
                <tbody>
                  {concluidos.map(r=>{
                    const vT=(r.items||[]).reduce((a,it)=>a+parseFloat(it.price||0),0);
                    return(<tr key={r.id} onClick={()=>setSel(p=>({...p,[r.id]:!p[r.id]}))} style={{cursor:'pointer',background:sel[r.id]?'var(--red-light)':'transparent'}}>
                      <td onClick={e=>e.stopPropagation()}><input type="checkbox" checked={!!sel[r.id]} onChange={()=>setSel(p=>({...p,[r.id]:!p[r.id]}))} style={{width:15,height:15,accentColor:'var(--red)',cursor:'pointer'}}/></td>
                      <td style={{fontWeight:800,fontSize:13}}>#{r.os}</td><td><span className="pill" style={{fontSize:8}}>{r.unidade||'Unidade 1'}</span></td>
                      <td><p style={{fontSize:10,fontWeight:700,textTransform:'uppercase',margin:0}}>{r.vehicleData?.modelo||'—'}</p><p className="mono" style={{fontSize:8,color:'var(--muted)',margin:0}}>{r.vehicleData?.chassi||''}</p></td>
                      <td style={{fontSize:10,fontWeight:600,textTransform:'uppercase',color:'var(--muted)'}}>{r.responsavel||'—'}</td>
                      <td style={{fontSize:10,color:'var(--muted)'}}>{r.timestamp?new Date(r.timestamp).toLocaleDateString('pt-BR'):'—'}</td>
                      <td style={{textAlign:'center'}}><span className="badge" style={{background:'var(--ink)',color:'#fff'}}>{r.items?.length||0}</span></td>
                      <td style={{fontSize:10,fontWeight:800,color:'#059669'}}>{vT>0?fmtBRL(vT):'—'}</td>
                    </tr>);
                  })}
                </tbody>
              </table>
            </div>
            <div style={{padding:'10px 16px',background:'var(--ink)',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
              <div style={{display:'flex',alignItems:'center',gap:16}}><p style={{fontSize:8,fontWeight:700,textTransform:'uppercase',color:'rgba(255,255,255,.4)',margin:0}}>{qtdSel} de {concluidos.length} selecionados</p>{qtdSel>0&&<p style={{fontSize:8,fontWeight:700,color:'#059669',margin:0}}>Libera ~{fmtBytes(estimarBytes(pedSel))}</p>}</div>
              <div style={{display:'flex',gap:8}}><button onClick={()=>setSel({})} style={{fontSize:8,fontWeight:700,textTransform:'uppercase',color:'rgba(255,255,255,.4)',background:'none',border:'none',cursor:'pointer',padding:'5px 10px',borderRadius:7}}>Limpar</button><button onClick={toggleTodos} style={{fontSize:8,fontWeight:700,textTransform:'uppercase',color:'rgba(255,255,255,.6)',background:'rgba(255,255,255,.06)',border:'none',cursor:'pointer',padding:'5px 12px',borderRadius:7}}>{todosSel?'Desmarcar todos':'Selecionar todos'}</button></div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ── EditingModal — estado 100% local, salva APENAS ao clicar Salvar ────────
function EditingModal({req,onClose,onSave,estoque,isMaster,loggedInUser}){
  // Copia profunda dos items para estado local — nunca toca no Firestore enquanto digita
  const[localItems,setLocalItems]=useState(()=>JSON.parse(JSON.stringify(req.items||[])));
  const[saving,setSaving]=useState(false);
  const[confirmDeleteIdx,setConfirmDeleteIdx]=useState(null);
  const[baixaEstoqueOpen,setBaixaEstoqueOpen]=useState(false);
  const deleteItem=(idx)=>{
    if(localItems.length<=1){alert('O pedido precisa ter pelo menos 1 peça.');return;}
    setConfirmDeleteIdx(idx);
  };
  const confirmDelete=()=>{
    setLocalItems(prev=>prev.filter((_,i)=>i!==confirmDeleteIdx));
    setConfirmDeleteIdx(null);
  };

  // Atualiza um campo de um item localmente (sem salvar)
  const setField=(idx,key,val)=>{
    setLocalItems(prev=>{
      const next=[...prev];
      next[idx]={...next[idx],[key]:val};
      return next;
    });
  };

  // Aplica regra de status automático ao desfocar o campo
  const applyStatusRule=(idx)=>{
    setLocalItems(prev=>{
      const next=[...prev];
      const it={...next[idx]};
      // Não sobrescreve se já estiver Concluído ou Doado
      if(it.status==='Concluído'||it.status==='Doado')return prev;
      if(it.actualDeliveryDate) it.status='Concluído';
      else if(it.boughtAt)      it.status='Comprado';
      else if(it.price&&it.supplier&&it.deliveryDate) it.status='Em Cotação';
      next[idx]=it;
      return next;
    });
  };

  const markBought=(idx)=>{
    setLocalItems(prev=>{
      const next=[...prev];
      next[idx]={...next[idx],status:'Comprado',boughtAt:new Date().toISOString().slice(0,10)};
      return next;
    });
  };

  const unmarkBought=(idx)=>{
    setLocalItems(prev=>{
      const next=[...prev];
      next[idx]={...next[idx],status:'Em Cotação',boughtAt:''};
      return next;
    });
  };

  const handleSave=async()=>{
    setSaving(true);
    try{
      const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('Tempo esgotado. Verifique sua conexão.')),12000));
     await Promise.race([onSave(req.id,localItems,req.os),timeout]);
      onClose();
    }catch(e){
      alert('Erro ao salvar: '+e.message);
    }finally{
      setSaving(false);
    }
  };

  return(
    <div style={{position:'fixed',inset:0,zIndex:200,background:'rgba(0,0,0,.9)',backdropFilter:'blur(4px)',display:'flex',alignItems:'center',justifyContent:'center',padding:16,overflowY:'auto'}}>
      <div className="edit-modal-inner" style={{background:'#fff',width:'100%',maxWidth:1000,borderRadius:24,boxShadow:'0 40px 80px rgba(0,0,0,.5)',display:'flex',flexDirection:'column',margin:'auto',borderBottom:'5px solid var(--red)'}}>
        {/* Header */}
        <div style={{padding:'20px 28px',background:'var(--ink)',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
          <div>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <h3 style={{margin:0,fontSize:18,fontWeight:800,color:'#fff'}}>OS #{req.os}</h3>
              <span style={{padding:'3px 10px',borderRadius:999,background:'rgba(255,255,255,.08)',color:'rgba(255,255,255,.5)',border:'1px solid rgba(255,255,255,.12)',fontSize:8,fontWeight:800}}>{req.unidade||'Unidade 1'}</span>
            </div>
            <p style={{margin:0,fontSize:9,color:'var(--red)',fontWeight:700,textTransform:'uppercase',marginTop:4}}>{req.vehicleData?.modelo||''}{req.vehicleData?.chassi?' · '+req.vehicleData.chassi:''}</p>
          </div>
          <button onClick={onClose} style={{width:38,height:38,background:'rgba(255,255,255,.08)',border:'none',borderRadius:10,cursor:'pointer',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="x" size={20}/></button>
        </div>

        {/* Body */}
        <div style={{padding:24,overflowY:'auto',maxHeight:'68vh'}} className="scroll-y">
          {localItems.map((it,idx)=>(
           <div key={idx} style={{background:it.status==='Doado'?'var(--red-light)':it.status==='Comprado'?'#F5F0FF':'var(--smoke)',borderRadius:14,padding:18,border:`1.5px solid ${confirmDeleteIdx===idx?'var(--red)':it.status==='Doado'?'#FFBDBD':it.status==='Comprado'?'#D8B4FE':'var(--border)'}`,marginBottom:12}}>
              {confirmDeleteIdx===idx&&(
                <div style={{background:'var(--red)',borderRadius:10,padding:'10px 14px',marginBottom:12,display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,flexWrap:'wrap'}}>
                  <span style={{fontSize:10,fontWeight:800,color:'#fff'}}>Excluir "{it.description}"?</span>
                  <div style={{display:'flex',gap:8}}>
                    <button type="button" onClick={()=>setConfirmDeleteIdx(null)} style={{padding:'5px 14px',background:'rgba(255,255,255,.2)',border:'none',borderRadius:7,fontSize:9,fontWeight:800,color:'#fff',cursor:'pointer',fontFamily:'Plus Jakarta Sans,sans-serif'}}>Cancelar</button>
                    <button type="button" onClick={confirmDelete} style={{padding:'5px 14px',background:'#fff',border:'none',borderRadius:7,fontSize:9,fontWeight:800,color:'var(--red)',cursor:'pointer',fontFamily:'Plus Jakarta Sans,sans-serif'}}>Confirmar</button>
                  </div>
                </div>
              )}
              {/* Topo do item */}
              <div style={{display:'flex',alignItems:'flex-start',gap:12,marginBottom:16}}>
                {it.photo
                  ?<img src={it.photo} style={{width:52,height:52,borderRadius:10,objectFit:'cover',border:'1px solid var(--border)',flexShrink:0}} alt="Peça"/>
                  :<div style={{width:52,height:52,borderRadius:10,background:'var(--border)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name="package" size={20}/></div>
                }
                <div style={{minWidth:0,flex:1}}>
                  <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8,marginBottom:8}}>
                    <p style={{fontSize:13,fontWeight:800,textTransform:'uppercase',margin:0,color:'var(--ink)',flex:1}}>{it.description||'(sem descrição)'}</p>
                    {it.status!=='Concluído'&&it.status!=='Doado'&&(
                      <button type="button" onClick={()=>deleteItem(idx)} style={{display:'flex',alignItems:'center',gap:4,padding:'4px 10px',background:'var(--red-light)',border:'1px solid #FFBDBD',borderRadius:7,fontSize:8,fontWeight:800,textTransform:'uppercase',color:'var(--red)',cursor:'pointer',flexShrink:0,fontFamily:'Plus Jakarta Sans,sans-serif',whiteSpace:'nowrap'}}>
                        <Icon name="trash-2" size={11}/> Excluir
                      </button>
                    )}
                  </div>
                  
                  <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                    <span style={{fontSize:9,color:'var(--muted)',fontWeight:600}}>Qtd: {it.quantity}</span>
                    <StatusBadge status={it.status||'Pendente'} orig={it.statusOriginal}/>
                    {it.receivedFrom&&(
                      <span style={{display:'inline-flex',alignItems:'center',gap:3,padding:'2px 7px',background:'#EDFAF3',border:'1px solid #AAE6C5',borderRadius:6,fontSize:8,fontWeight:800,color:'#0A6B34'}}>
                        <Icon name="arrow-left" size={10}/> Recebida OS #{it.receivedFrom}
                      </span>
                    )}
                    {it.donatedTo&&!it.receivedFrom&&(
                      <span style={{display:'inline-flex',alignItems:'center',gap:3,padding:'2px 7px',background:'#FFF0F0',border:'1px solid #FFBDBD',borderRadius:6,fontSize:8,fontWeight:800,color:'var(--red)'}}>
                        <Icon name="arrow-right" size={10}/> Doada OS #{it.donatedTo}
                      </span>
                    )}
                    {it.status==='Em Cotação'&&(
                      <button type="button" onClick={()=>markBought(idx)} className="btn-bought">
                        <Icon name="shopping-bag" size={12}/> Já foi comprado?
                      </button>
                    )}
                    {it.status==='Comprado'&&(
                      <button type="button" onClick={()=>unmarkBought(idx)} style={{fontSize:8,fontWeight:700,padding:'3px 8px',borderRadius:6,border:'1px solid #D8B4FE',background:'#F5F0FF',color:'#6B21A8',cursor:'pointer',fontFamily:'Plus Jakarta Sans,sans-serif'}}>
                        ↩ Desfazer compra
                      </button>
                    )}
                  </div>
                  {it.boughtAt&&(
                    <p style={{fontSize:8,color:'#6B21A8',fontWeight:700,margin:'6px 0 0'}}>
                      🛍 Comprado: {new Date(it.boughtAt+'T00:00:00').toLocaleDateString('pt-BR')}
                      {it.deliveryDate&&<span style={{opacity:.7}}> · Prazo: {new Date(it.deliveryDate+'T00:00:00').toLocaleDateString('pt-BR')}</span>}
                    </p>
                  )}
                </div>
              </div>

              {/* Campos de preenchimento — editam estado LOCAL */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:12}} className="md-4col">
                <style>{`@media(min-width:768px){.md-4col{grid-template-columns:repeat(4,1fr)!important}}`}</style>

                {/* Valor */}
                <div>
                  <label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',display:'block',marginBottom:6}}>Valor Total (R$)</label>
                  <input
                    type="number" step="0.01" min="0"
                    placeholder="0,00"
                    value={it.price||''}
                    disabled={it.status==='Concluído'||it.status==='Doado'}
                    onChange={e=>setField(idx,'price',e.target.value)}
                    onBlur={()=>applyStatusRule(idx)}
                    className="input"
                    style={{fontSize:13,fontWeight:700,opacity:(it.status==='Concluído'||it.status==='Doado')?.6:1}}
                  />
                </div>

                {/* Fornecedor */}
                <div>
                  <label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',display:'block',marginBottom:6}}>Fornecedor</label>
                  <input
                    type="text"
                    placeholder="Nome da loja"
                    value={it.supplier||''}
                    disabled={it.status==='Concluído'||it.status==='Doado'}
                    onChange={e=>setField(idx,'supplier',sanitize(e.target.value))}
                    onBlur={()=>applyStatusRule(idx)}
                    className="input"
                    style={{fontSize:13,fontWeight:700,opacity:(it.status==='Concluído'||it.status==='Doado')?.6:1}}
                  />
                </div>

                {/* Prazo */}
                <div>
                  <label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',display:'block',marginBottom:6}}>Prazo de entrega</label>
                  <input
                    type="date"
                    value={it.deliveryDate||''}
                    disabled={it.status==='Concluído'||it.status==='Doado'}
                    onChange={e=>setField(idx,'deliveryDate',e.target.value)}
                    onBlur={()=>applyStatusRule(idx)}
                    className="input"
                    style={{fontSize:13,opacity:(it.status==='Concluído'||it.status==='Doado')?.6:1}}
                  />
                </div>

                {/* Entrega Real */}
                <div>
                  <label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--red)',display:'block',marginBottom:6}}>✓ Data de Entrega Real</label>
                  <input
                    type="date"
                    value={it.actualDeliveryDate||''}
                    disabled={it.status==='Pendente'||it.status==='Doado'}
                    onChange={e=>setField(idx,'actualDeliveryDate',e.target.value)}
                    onBlur={()=>applyStatusRule(idx)}
                    className="input"
                    style={{fontSize:13,background:'var(--red-light)',borderColor:'#FFBDBD',opacity:(it.status==='Pendente'||it.status==='Doado')?.6:1}}
                  />
                </div>
              </div>
            </div>
          ))}
        </div>

        {/* Footer */}
        <div style={{padding:'16px 24px',background:'var(--smoke)',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0,gap:12,flexWrap:'wrap'}}>
          <p style={{fontSize:8,color:'var(--muted)',fontWeight:600,fontStyle:'italic',margin:0}}>
            Preencha Valor + Fornecedor + Prazo → Em Cotação &nbsp;|&nbsp; "Já foi comprado?" → Comprado &nbsp;|&nbsp; Data de Entrega Real → Concluído
          </p>
         <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
            {isMaster&&(
              <button onClick={()=>setBaixaEstoqueOpen(true)} style={{display:'flex',alignItems:'center',gap:6,padding:'11px 16px',background:'#7C3AED',color:'#fff',border:'none',borderRadius:10,fontSize:10,fontWeight:800,textTransform:'uppercase',cursor:'pointer',fontFamily:'Plus Jakarta Sans,sans-serif'}}>
                <Icon name="boxes" size={14}/> Receber do Estoque
              </button>
            )}
            <button onClick={onClose} className="btn-ghost" style={{padding:'11px 20px'}}>Cancelar</button>
            <button onClick={handleSave} disabled={saving} className="btn-primary" style={{padding:'11px 28px',minWidth:160}}>
              {saving?<><Icon name="refresh-cw" size={14} className="spin"/> Salvando...</>:<><Icon name="save" size={14}/> Salvar alterações</>}
            </button>
          </div>
        </div>
      </div>
{baixaEstoqueOpen&&isMaster&&(
        <AssociarEstoqueBaixaModal
          reqFixo={{...req,items:localItems}}
          estoque={estoque||[]}
          loggedInUser={loggedInUser}
          onClose={()=>setBaixaEstoqueOpen(false)}
          onApplied={(itemId,fields)=>{
            setLocalItems(prev=>prev.map(it=>String(it.id)===String(itemId)?{...it,...fields}:it));
          }}
        />
      )}
    </div>
  );
}

// ── Chegadas View — itens entregues (actualDeliveryDate preenchido) ────────
function ChegadasView({requests,loggedInUser,vehicles}){
  const[filtro,setFiltro]=useState('7');
  const[search,setSearch]=useState('');
  // lidas compartilhadas via Firestore
  const{data:lidasData}=useFirestore('lidas');
  const lidas=useMemo(()=>{
    if(!lidasData?.length)return[];
    const all=lidasData.flatMap(d=>d.uids||[]);
    return all;
  },[lidasData]);
  const[lidasDocId,setLidasDocId]=useState(null);
  useEffect(()=>{
    if(lidasData?.length&&!lidasDocId)setLidasDocId(lidasData[0].id);
  },[lidasData]);

  const vehicleMap=useMemo(()=>{const m={};vehicles.forEach(v=>{m[String(v.os).trim()]=v;});return m;},[vehicles]);

  // Coleta todos os itens entregues (com actualDeliveryDate) de todos os pedidos
  const chegadas=useMemo(()=>{
    const now=Date.now();
    const dias=filtro==='todos'?99999:parseInt(filtro);
    const limite=now-(dias*86400000);
    const list=[];
    requests.forEach(req=>{
      (req.items||[]).forEach(it=>{
        if(!it.actualDeliveryDate)return;
        const dt=new Date(it.actualDeliveryDate+'T00:00:00').getTime();
        if(dt<limite)return;
        const t=search.toLowerCase();
        if(t&&!String(req.os).toLowerCase().includes(t)&&!String(it.description).toLowerCase().includes(t)&&!String(req.vehicleData?.modelo||'').toLowerCase().includes(t)&&!String(req.responsavel||'').toLowerCase().includes(t))return;
        const vInfo=vehicleMap[String(req.os).trim()]||req.vehicleData||{};
        list.push({
          reqId:req.id,
          itemId:it.id,
          os:req.os,
          unidade:req.unidade||'Unidade 1',
          responsavel:req.responsavel||'—',
          vehicleData:req.vehicleData||{},
          etapa:vInfo.etapa||'',
          localizacao:vInfo.localizacao||'',
          item:it,
          entregaTs:dt,
          uid:String(req.os)+'_'+String(it.id||it.description),
        });
      });
    });
    // Mais recentes primeiro
    list.sort((a,b)=>b.entregaTs-a.entregaTs);
    return list;
  },[requests,filtro,search,vehicleMap]);

  const naoLidas=chegadas.filter(c=>!lidas.includes(c.uid)).length;

  const salvarLidas=async(novo)=>{
    try{
      const arr=[...new Set([...lidas,...novo])];
      if(lidasDocId)await col('lidas').doc(lidasDocId).update({uids:arr});
      else{const ref=await col('lidas').add({uids:arr});setLidasDocId(ref.id);}
    }catch(e){console.warn('lidas:',e);}
  };
  const marcarTodasLidas=()=>salvarLidas(chegadas.map(c=>c.uid));
  const marcarLida=(uid)=>{if(lidas.includes(uid))return;salvarLidas([uid]);};

  return(
    <div className="fade-up" style={{paddingBottom:24}}>
      {/* Header */}
      <div style={{marginBottom:20}}>
        <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',flexWrap:'wrap',gap:12,marginBottom:16}}>
          <div>
           <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.15em',color:'var(--red)',marginBottom:4}}>Portal VRZ</p>
            <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
              <h2 style={{fontSize:32,fontWeight:800,margin:0,letterSpacing:'-.02em'}}>Chegadas</h2>
              <LastUpdateBadge/>
              {naoLidas>0&&(
                <div style={{background:'var(--red)',color:'#fff',borderRadius:999,padding:'4px 10px',fontSize:10,fontWeight:800,display:'flex',alignItems:'center',gap:5}}>
                  <span className="pulse-beacon" style={{width:6,height:6,borderRadius:'50%',background:'#fff',display:'inline-block'}}/>
                  {naoLidas} {naoLidas===1?'nova':'novas'}
                </div>
              )}
            </div>
          </div>
          {naoLidas>0&&(
            <button onClick={marcarTodasLidas} style={{display:'flex',alignItems:'center',gap:6,padding:'9px 16px',background:'var(--ink)',color:'#fff',border:'none',borderRadius:10,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer',letterSpacing:'.06em',fontFamily:'Plus Jakarta Sans,sans-serif'}}>
              <Icon name="check-check" size={14}/> Marcar todas como vistas
            </button>
          )}
        </div>

        {/* Filtros */}
        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
          <div style={{display:'flex',gap:3,background:'var(--smoke)',padding:4,borderRadius:12,border:'1px solid var(--border)'}}>
            {[{v:'7',l:'Últimos 7 dias'},{v:'30',l:'Últimos 30 dias'},{v:'todos',l:'Todas'}].map(f=>(
              <button key={f.v} onClick={()=>setFiltro(f.v)} style={{padding:'7px 14px',borderRadius:9,fontSize:9,fontWeight:800,textTransform:'uppercase',border:'none',cursor:'pointer',letterSpacing:'.06em',transition:'all .15s',fontFamily:'Plus Jakarta Sans,sans-serif',background:filtro===f.v?'#fff':'transparent',color:filtro===f.v?'#0A6B34':'var(--muted)',boxShadow:filtro===f.v?'0 2px 8px rgba(0,0,0,.08)':'none',whiteSpace:'nowrap'}}>
                {f.l}
              </button>
            ))}
          </div>
          <div style={{position:'relative',flex:1,minWidth:200}}>
            <input type="text" placeholder="Buscar OS / Peça / Modelo..." value={search} onChange={e=>setSearch(e.target.value)} className="input" style={{paddingLeft:36,fontSize:11}}/>
            <div style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',color:'var(--muted)'}}><Icon name="search" size={14}/></div>
          </div>
        </div>
      </div>

      {/* Resumo rápido */}
      {chegadas.length>0&&(
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:10,marginBottom:20}}>
          {[
            {label:'Total de chegadas',v:chegadas.length,icon:'package-check',bg:'var(--ink)',fg:'#fff'},
            {label:'Não visualizadas',v:naoLidas,icon:'bell',bg:'var(--red)',fg:'#fff'},
          ].map((k,i)=>(
            <div key={i} style={{background:k.bg,color:k.fg,borderRadius:14,padding:'16px 20px',border:k.bg==='var(--smoke)'?'1.5px solid var(--border)':'none'}}>
              <div style={{width:30,height:30,borderRadius:8,background:k.bg==='var(--smoke)'?'var(--border)':'rgba(255,255,255,.15)',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:10}}><Icon name={k.icon} size={15}/></div>
              <p style={{fontSize:30,fontWeight:800,lineHeight:1,margin:0}}>{k.v}</p>
              <p style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.08em',marginTop:4,opacity:.65}}>{k.label}</p>
            </div>
          ))}
        </div>
      )}

      {/* Lista */}
      {chegadas.length===0?(
        <div style={{padding:'64px 20px',textAlign:'center',background:'#fff',borderRadius:16,border:'1.5px dashed var(--border)'}}>
          <div style={{width:64,height:64,background:'var(--smoke)',borderRadius:18,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px'}}><Icon name="package" size={28}/></div>
          <p style={{fontSize:11,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',margin:'0 0 6px'}}>Nenhuma chegada no período</p>
          <p style={{fontSize:10,color:'var(--muted)',margin:0}}>As peças entregues aparecerão aqui quando a data de entrega real for preenchida</p>
        </div>
      ):(
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {chegadas.map((c,idx)=>{
            const isNova=!lidas.includes(c.uid);
            const dtFormatada=new Date(c.item.actualDeliveryDate+'T00:00:00').toLocaleDateString('pt-BR');
            return(
              <div key={c.uid} onClick={()=>marcarLida(c.uid)} className="card" style={{borderLeft:`3px solid ${isNova?'var(--red)':'#AAE6C5'}`,cursor:'pointer',transition:'background .15s',background:'#fff'}}
                onMouseEnter={e=>e.currentTarget.style.background='var(--smoke)'}
                onMouseLeave={e=>e.currentTarget.style.background='#fff'}>
                <div style={{padding:'12px 14px'}}>
                  {/* Linha 1: status + OS + badges */}
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,marginBottom:8}}>
                    <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',flex:1,minWidth:0}}>
                      {isNova&&<span style={{display:'inline-flex',alignItems:'center',gap:3,background:'var(--red)',color:'#fff',fontSize:7,fontWeight:800,padding:'2px 7px',borderRadius:999,textTransform:'uppercase',whiteSpace:'nowrap'}}><span className="pulse-beacon" style={{width:5,height:5,borderRadius:'50%',background:'#fff',display:'inline-block'}}/>Nova</span>}
                      <span style={{fontSize:13,fontWeight:800,color:'var(--ink)',whiteSpace:'nowrap'}}>OS #{c.os}</span>
                      <span className="pill" style={{fontSize:7,padding:'2px 7px'}}>{c.unidade}</span>
                      {c.etapa&&<span style={{fontSize:7,fontWeight:800,padding:'2px 7px',borderRadius:5,background:'#FFF4E6',border:'1px solid #FFD9A8',color:'#C45E00',textTransform:'uppercase',whiteSpace:'nowrap'}}>{c.etapa}</span>}
                      {c.localizacao&&<span style={{fontSize:7,fontWeight:800,padding:'2px 7px',borderRadius:5,background:'#EAF0FF',border:'1px solid #C0D0F5',color:'#1A4EC2',textTransform:'uppercase',whiteSpace:'nowrap'}}>{c.localizacao}</span>}
                    </div>
                    <div style={{width:32,height:32,borderRadius:8,background:isNova?'var(--red)':'#EDFAF3',border:`1px solid ${isNova?'var(--red)':'#AAE6C5'}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                      <Icon name={isNova?'bell':'check-circle'} size={15} style={{color:isNova?'#fff':'#059669'}}/>
                    </div>
                  </div>
                  {/* Linha 2: foto + info */}
                  <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
                    {c.item.photo
                      ?<img src={c.item.photo} style={{width:48,height:48,borderRadius:8,objectFit:'cover',border:'1px solid var(--border)',flexShrink:0}} alt="Peça"/>
                      :<div style={{width:48,height:48,borderRadius:8,background:isNova?'var(--red-light)':'var(--smoke)',border:`1px solid ${isNova?'#FFBDBD':'var(--border)'}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name="package" size={18}/></div>
                    }
                    <div style={{flex:1,minWidth:0}}>
                      <p style={{fontSize:12,fontWeight:800,textTransform:'uppercase',margin:'0 0 5px',color:'var(--ink)',lineHeight:1.2}}>{c.item.description}</p>
                      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'3px 12px'}}>
                        {[['Veículo',c.vehicleData?.modelo||'—'],['Solicitante',c.responsavel],['Qtd',String(c.item.quantity)],['Entregue',dtFormatada]].map(([l,v])=>(
                          <div key={l}>
                            <p style={{fontSize:7,fontWeight:700,textTransform:'uppercase',color:'var(--muted)',margin:0}}>{l}</p>
                            <p style={{fontSize:10,fontWeight:700,color:'var(--ink)',margin:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{v}</p>
                          </div>
                        ))}
                      </div>
                      {(c.item.supplier||c.item.price>0)&&(
                        <div style={{display:'flex',gap:8,marginTop:5,flexWrap:'wrap'}}>
                          {c.item.supplier&&<span style={{fontSize:8,fontWeight:700,color:'var(--muted)',display:'flex',alignItems:'center',gap:3}}><Icon name="store" size={10}/>{c.item.supplier}</span>}
                          {c.item.price>0&&<span style={{fontSize:9,fontWeight:800,color:'#059669'}}>{fmtBRL(c.item.price)}</span>}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── Login ─────────────────────────────────────────────────────────────────
function LoginView({onLogin,usersList,loadingUsers}){
  const[u,setU]=useState('');const[p,setP]=useState('');const[showP,setShowP]=useState(false);const[err,setErr]=useState('');
  const submit=e=>{
    e.preventDefault();
    if(loadingUsers){setErr('Ainda carregando dados de acesso... aguarde 2 segundos e tente novamente.');return;}
    const uT=u.trim();const pT=p.trim();
    const candidatos=usersList.filter(x=>x.user.trim().toLowerCase()===uT.toLowerCase());
    const found=candidatos.find(x=>x.pass===pT)||candidatos.find(x=>x.pass?.trim()===pT);
    if(found){if(found.active===false){setErr('Conta desativada. Contate o Admin.');}else{onLogin(found);}}
    else if(candidatos.length===0){setErr('Usuário não encontrado.');}
    else{setErr('Senha incorreta.');}
  };
  return(
    <div className="login-bg" style={{height:'100vh',minHeight:'100dvh',width:'100%',display:'flex',alignItems:'center',justifyContent:'center',padding:16,overflowY:'auto'}}>
      <div style={{background:'#fff',width:'100%',maxWidth:380,borderRadius:24,overflow:'hidden',boxShadow:'0 40px 80px rgba(0,0,0,.4)',borderBottom:'6px solid var(--red)'}} className="fade-in">
        <div style={{background:'var(--ink)',padding:'40px 32px',textAlign:'center',color:'#fff'}}>
          <div style={{width:56,height:56,background:'var(--red)',borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px',boxShadow:'0 8px 24px rgba(220,31,31,.4)'}}><Icon name="shopping-cart" size={28}/></div>
          <h1 style={{fontSize:36,fontWeight:800,margin:0,letterSpacing:'-.02em',color:'#fff'}}>VRZ Compras</h1>
          <p style={{fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:'.18em',color:'rgba(255,255,255,.3)',margin:'8px 0 0'}}>Acesso Restrito ao Sistema</p>
        </div>
        <form onSubmit={submit} style={{padding:32,display:'flex',flexDirection:'column',gap:20}}>
          {err&&(<div className="shake" style={{background:'var(--red-light)',border:'1px solid #FFBDBD',borderRadius:10,padding:'10px 14px',display:'flex',alignItems:'center',gap:8}}><Icon name="alert-circle" size={14}/><span style={{fontSize:10,fontWeight:700,textTransform:'uppercase',color:'var(--red)'}}>{err}</span></div>)}
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            <div>
              <label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.14em',color:'var(--muted)',display:'block',marginBottom:6}}>Usuário</label>
              <div style={{position:'relative'}}>
                <div style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'var(--muted)'}}><Icon name="user" size={15}/></div>
                <input type="text" value={u} onChange={e=>setU(e.target.value)} className="input" style={{paddingLeft:38}} placeholder="USUÁRIO" autoComplete="username" autoCorrect="off" autoCapitalize="none" spellCheck="false" required/>
              </div>
            </div>
            <div>
              <label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.14em',color:'var(--muted)',display:'block',marginBottom:6}}>Senha</label>
              <div style={{position:'relative'}}>
                <div style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'var(--muted)'}}><Icon name="lock" size={15}/></div>
                <input type={showP?'text':'password'} value={p} onChange={e=>setP(e.target.value)} className="input" style={{paddingLeft:38,paddingRight:40,letterSpacing:showP?'normal':'.2em'}} placeholder="••••••••" autoComplete="current-password" autoCorrect="off" autoCapitalize="none" spellCheck="false" required/>
                <button type="button" onClick={()=>setShowP(!showP)} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'var(--muted)',padding:4,display:'flex',alignItems:'center',justifyContent:'center',borderRadius:6,transition:'color .15s'}} onMouseEnter={e=>e.currentTarget.style.color='var(--ink)'} onMouseLeave={e=>e.currentTarget.style.color='var(--muted)'} title={showP?'Ocultar senha':'Ver senha'}>
                  {showP?(
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                  ):(
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  )}
                </button>
              </div>
            </div>
          </div>
          <button type="submit" className="btn-primary" style={{width:'100%',padding:15,fontSize:11,letterSpacing:'.1em'}}>
            {loadingUsers?<><Icon name="refresh-cw" size={14} className="spin"/> Carregando...</>:'Entrar no Portal'}
          </button>
          {loadingUsers&&<p style={{fontSize:9,color:'var(--muted)',textAlign:'center',margin:'8px 0 0',fontWeight:600}}>Conectando ao servidor, aguarde...</p>}
        </form>
      </div>
    </div>
  );
}

// ── CancelDonation View ───────────────────────────────────────────────────
function CancelDonationView({requests,loggedInUser}){
  const{data:donations,loading}=useFirestore('donations');
  const[cancelando,setCancelando]=useState(null);
  const[itensSelecionados,setItensSelecionados]=useState([]);
  const[processando,setProcessando]=useState(false);
  const[search,setSearch]=useState('');

  const ativas=useMemo(()=>{
    return donations
      .filter(d=>!d.cancelado)
      .filter(d=>{
        const t=search.toLowerCase();
        return !t||String(d.receptoraOS).includes(t)||String(d.doadoraOS).includes(t)||String(d.executadoPor||'').toLowerCase().includes(t);
      })
      .sort((a,b)=>b.timestamp-a.timestamp);
  },[donations,search]);

  const executarCancelamento=async(don,idsParaCancelar)=>{
    setProcessando(true);
    try{
      // 1. Remove itens doados da OS receptora (volta status para Pendente ou original)
      const receptoraDocs=requests.filter(r=>String(r.os).trim()===String(don.receptoraOS).trim());
      for(const req of receptoraDocs){
       const newItems=req.items.map(it=>{
 const eraDoado=idsParaCancelar.includes(String(it.id))&&it.receivedFrom===String(don.doadoraOS);
  if(!eraDoado)return it;
  // Tenta restaurar snapshot original
  const snap=don.snapshot?.find(s=>String(s.id)===String(it.id));
  const base=snap?stripUndefined({...snap}):stripUndefined({...it});
  // Remove campos de doação
  delete base.receivedFrom;
  delete base.donatedTo;
  delete base.donatedAt;
  // Recalcula status correto com base nos dados de compra
  let statusRestaurado='Pendente';
  if(base.actualDeliveryDate) statusRestaurado='Concluído';
  else if(base.boughtAt)      statusRestaurado='Comprado';
  else if(base.price&&base.supplier&&base.deliveryDate) statusRestaurado='Em Cotação';
  base.status=statusRestaurado;
  delete base.statusOriginal;
  return base;
});
        await col('requests').doc(req.id).update({items:stripUndefined(newItems)});
      }
      // 2. Remove itens transferidos da OS doadora (os que foram adicionados pela doação)
      const doadoraDocs=requests.filter(r=>String(r.os).trim()===String(don.doadoraOS).trim());
      for(const req of doadoraDocs){
       const newItems=req.items.filter(it=>!(it.donatedTo===String(don.receptoraOS)&&idsParaCancelar.includes(String(it.id))));
        if(newItems.length===0){
          await col('requests').doc(req.id).delete();
        }else{
          await col('requests').doc(req.id).update({items:stripUndefined(newItems)});
        }
      }
     // 3. Marca doação — total ou parcialmente cancelada
      const totalItens=don.itemIds?.length||0;
      const cancelamentoTotal=idsParaCancelar.length>=totalItens;
      await col('donations').doc(don.id).update({
        cancelado:cancelamentoTotal,
        canceladoParcial:!cancelamentoTotal,
        itensCancelados:idsParaCancelar,
        canceladoPor:loggedInUser?.user||'Sistema',
        canceladoEm:Date.now(),
      });
      setCancelando(null);
    }catch(e){alert('Erro ao cancelar: '+e.message);}
    setProcessando(false);
  };

  if(loading)return<Skeleton/>;

  return(
    <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:16,paddingBottom:40}}>
      <div style={{background:'var(--ink)',borderRadius:16,padding:'20px 24px',display:'flex',alignItems:'center',gap:14,color:'#fff'}}>
        <div style={{width:44,height:44,background:'var(--red)',borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name="undo-2" size={20}/></div>
        <div>
          <h3 style={{margin:0,fontSize:18,fontWeight:800}}>Cancelar Doação</h3>
          <p style={{margin:0,fontSize:9,color:'rgba(255,255,255,.45)',textTransform:'uppercase',letterSpacing:'.1em',marginTop:2}}>Reverte transferência e restaura OS original</p>
        </div>
      </div>

      <div style={{position:'relative'}}>
        <input type="text" placeholder="Buscar por OS receptora, doadora ou usuário..." value={search} onChange={e=>setSearch(e.target.value)} className="input" style={{paddingLeft:36}}/>
        <div style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',color:'var(--muted)'}}><Icon name="search" size={14}/></div>
      </div>

      {ativas.length===0?(
        <div style={{padding:'64px 20px',textAlign:'center',background:'#fff',borderRadius:16,border:'1.5px dashed var(--border)'}}>
          <div style={{width:56,height:56,background:'var(--smoke)',borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px'}}><Icon name="git-merge" size={24}/></div>
          <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',margin:0}}>Nenhuma doação ativa encontrada</p>
        </div>
      ):ativas.map(don=>(
        <div key={don.id} className="card" style={{padding:0,overflow:'hidden'}}>
          <div style={{background:'var(--smoke)',padding:'12px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
            <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <span style={{fontSize:8,fontWeight:800,textTransform:'uppercase',color:'var(--muted)'}}>Receptora</span>
                <span style={{fontSize:15,fontWeight:800,color:'var(--red)'}}>OS #{don.receptoraOS}</span>
              </div>
              <Icon name="arrow-right" size={14} style={{color:'var(--muted)'}}/>
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <span style={{fontSize:8,fontWeight:800,textTransform:'uppercase',color:'var(--muted)'}}>Doadora</span>
                <span style={{fontSize:15,fontWeight:800}}>OS #{don.doadoraOS}</span>
              </div>
            </div>
           <div style={{display:'flex',alignItems:'center',gap:8}}>
              <div style={{textAlign:'right'}}>
                <p style={{fontSize:8,fontWeight:700,color:'var(--muted)',margin:0,textTransform:'uppercase'}}>{don.executadoPor}</p>
                <p style={{fontSize:8,color:'var(--muted)',margin:0}}>{don.timestamp?new Date(don.timestamp).toLocaleDateString('pt-BR'):''}</p>
              </div>
              <button onClick={()=>{setCancelando(don);setItensSelecionados(don.itemIds?.map(String)||[]);}} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',background:'var(--red)',color:'#fff',border:'none',borderRadius:9,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer',fontFamily:'Plus Jakarta Sans,sans-serif'}}>
                <Icon name="undo-2" size={13}/> Cancelar
              </button>

function DeletedItemsView({loggedInUser}){
  const{data:deletedRaw,loading}=useFirestore('deletedItems');
  const[restaurando,setRestaurando]=useState(null);
  const[processando,setProcessando]=useState(false);
  const[search,setSearch]=useState('');
  const[limpando,setLimpando]=useState(false);

  // Limpa expirados automaticamente ao abrir
  useEffect(()=>{
    const agora=Date.now();
    const expirados=deletedRaw.filter(d=>d.expiresAt&&d.expiresAt<agora&&!d.restaurado);
    if(!expirados.length)return;
    expirados.forEach(d=>col('deletedItems').doc(d.id).delete().catch(()=>{}));
  },[deletedRaw]);

  const deleted=useMemo(()=>{
    const agora=Date.now();
    return deletedRaw
      .filter(d=>!d.restaurado&&d.expiresAt&&d.expiresAt>=agora)
      .filter(d=>{
        const t=search.toLowerCase();
        return !t||String(d.os||'').includes(t)||String(d.responsavel||'').toLowerCase().includes(t)||String(d.vehicleData?.modelo||'').toLowerCase().includes(t)||String(d.deletedBy||'').toLowerCase().includes(t);
      })
      .sort((a,b)=>b.deletedAt-a.deletedAt);
  },[deletedRaw,search]);

  const restaurar=async(item)=>{
    setProcessando(true);
    try{
      const{id,originalId,deletedBy,deletedAt,expiresAt,restaurado,...reqData}=item;
      await col('requests').add(stripUndefined({...reqData,id:undefined,restauradoDe:item.id,restauradoPor:loggedInUser?.user||'Sistema',restauradoEm:Date.now()}));
      await col('deletedItems').doc(item.id).update({restaurado:true,restauradoPor:loggedInUser?.user||'Sistema',restauradoEm:Date.now()});
      setRestaurando(null);
    }catch(e){alert('Erro ao restaurar: '+e.message);}
    setProcessando(false);
  };

  const diasRestantes=(expiresAt)=>{
    const diff=expiresAt-Date.now();
    const dias=Math.ceil(diff/86400000);
    return Math.max(dias,0);
  };

  const corExpiracao=(dias)=>{
    if(dias<=1)return{bg:'#FFF0F0',border:'#FFBDBD',text:'var(--red)'};
    if(dias<=2)return{bg:'#FFFBE6',border:'#FFE680',text:'#856A00'};
    return{bg:'#EDFAF3',border:'#AAE6C5',text:'#0A6B34'};
  };

  if(loading)return<Skeleton/>;

  return(
    <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:16,paddingBottom:40}}>
      <div style={{background:'var(--ink)',borderRadius:16,padding:'20px 24px',display:'flex',alignItems:'center',gap:14,color:'#fff'}}>

      </div>

      {deleted.length>0&&(
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:10}}>
          {[
            {label:'Para recuperar',v:deleted.length,icon:'inbox',bg:'var(--ink)',fg:'#fff'},
            {label:'Expira hoje/amanhã',v:deleted.filter(d=>diasRestantes(d.expiresAt)<=1).length,icon:'alert-triangle',bg:'var(--red)',fg:'#fff'},
          ].map((k,i)=>(
            <div key={i} style={{background:k.bg,color:k.fg,borderRadius:14,padding:'16px 20px'}}>

        <div style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',color:'var(--muted)'}}><Icon name="search" size={14}/></div>
      </div>

      {deleted.length===0?(
        <div style={{padding:'64px 20px',textAlign:'center',background:'#fff',borderRadius:16,border:'1.5px dashed var(--border)'}}>
          <div style={{width:56,height:56,background:'var(--smoke)',borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px'}}><Icon name="trash-2" size={24}/></div>

          <p style={{fontSize:9,color:'var(--muted)',margin:0}}>Pedidos excluídos ficam disponíveis por 5 dias</p>
        </div>
      ):deleted.map(item=>{
        const dias=diasRestantes(item.expiresAt);
        const cor=corExpiracao(dias);
        return(
          <div key={item.id} className="card" style={{padding:0,overflow:'hidden',borderLeft:`3px solid ${cor.text}`}}>
            <div style={{background:'var(--smoke)',padding:'12px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
              <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                <span style={{fontSize:16,fontWeight:800}}>OS #{item.os}</span>
                <span className="pill" style={{fontSize:7}}>{item.unidade||'Unidade 1'}</span>

              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <div style={{background:cor.bg,border:`1px solid ${cor.border}`,borderRadius:8,padding:'5px 10px',textAlign:'center'}}>

                  <p style={{fontSize:7,fontWeight:800,textTransform:'uppercase',color:cor.text,margin:0,opacity:.8}}>{dias===1?'dia':'dias'}</p>

                <button onClick={()=>setRestaurando(item)} style={{display:'flex',alignItems:'center',gap:6,padding:'9px 16px',background:'#059669',color:'#fff',border:'none',borderRadius:9,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer',fontFamily:'Plus Jakarta Sans,sans-serif'}}>

            <div style={{padding:'12px 16px'}}>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))',gap:'6px 16px',marginBottom:10}}>

        );
      })}

      {/* Modal restaurar */}
      {restaurando&&(
        <div style={{position:'fixed',inset:0,zIndex:700,background:'rgba(0,0,0,.85)',display:'flex',alignItems:'center',justifyContent:'center',padding:16,overflowY:'auto'}} className="fade-in">

              <div style={{display:'flex',alignItems:'center',gap:12}}>

// ── Finalização — Inspeção Final de Veículos ──────────────────────────────
function compressPhotoDataURL(file, maxPx=550, quality=0.4){
  return new Promise(resolve=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>h&&w>maxPx){h=Math.round(h*maxPx/w);w=maxPx;}
        else if(h>maxPx){w=Math.round(w*maxPx/h);h=maxPx;}
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.onerror=()=>resolve(null);
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}
async function uploadFotoStorage(base64, path){
  if(!base64) return null;
  if(!base64.startsWith('data:image')) return base64;
  const ref = storage.ref().child(path);
  await ref.putString(base64, 'data_url');
  return await ref.getDownloadURL();
}

async function fotoParaDataURL(foto){
  if(!foto) return null;
  if(foto.startsWith('data:image')) return foto;
  try{
    const res = await fetch(foto);
    const blob = await res.blob();
    return await new Promise(resolve=>{
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(blob);
    });
  }catch(e){ return null; }
}
function PhotoDropzone({photo,onChange,disabled}){
  const[isDragging,setIsDragging]=useState(false);
  const[compressing,setCompressing]=useState(false);
  const cameraInputRef=useRef(null);
  const galleryInputRef=useRef(null);
  const handleFile=async file=>{
    if(!file||disabled)return;
    setCompressing(true);
    try{const d=await compressPhotoDataURL(file);onChange(d);}catch{alert('Erro ao processar imagem.');}
    setCompressing(false);
  };
  const onDrop=e=>{
    e.preventDefault();setIsDragging(false);if(disabled)return;
    const f=e.dataTransfer.files?.[0];
    if(f&&f.type.startsWith('image/'))handleFile(f);
  };
  const hiddenInputs=(
    <>
      <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" onChange={e=>{if(e.target.files[0])handleFile(e.target.files[0]);e.target.value='';}} style={{display:'none'}} disabled={disabled}/>
      <input ref={galleryInputRef} type="file" accept="image/*" onChange={e=>{if(e.target.files[0])handleFile(e.target.files[0]);e.target.value='';}} style={{display:'none'}} disabled={disabled}/>
    </>
  );
  if(photo)return(
    <div style={{position:'relative',borderRadius:12,overflow:'hidden',border:'1.5px solid var(--border)',height:110}}>

        </div>
      )}
      {hiddenInputs}
    </div>
  );
  return(
    <div
      onDragOver={e=>{e.preventDefault();if(!disabled)setIsDragging(true);}}

        </>

async function buildFinalizacaoPDF(fin, pecasItems, comFoto=true){
  const{jsPDF}=window.jspdf;const doc=new jsPDF();
  doc.setFillColor(13,13,13);doc.rect(0,0,210,34,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(15);
  doc.text('VRZ — INSPEÇÃO DE FINALIZAÇÃO',10,15);
  doc.setFont('helvetica','normal');doc.setFontSize(8);
  doc.text(`OS #${fin.os}  ·  Gerado em ${new Date().toLocaleString('pt-BR')}`,10,24);
  doc.setTextColor(0,0,0);
  let y=44;
  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text('Dados do Veículo',10,y);y+=7;
  doc.setFont('helvetica','normal');doc.setFontSize(9);
  const vd=fin.vehicleData||{};
  [['Modelo',vd.modelo],['Chassi',vd.chassi],['Cor',vd.cor],['Etapa',vd.etapa],['Criado por',fin.criadoPor],['Criado em',fin.criadoEm?new Date(fin.criadoEm).toLocaleString('pt-BR'):'—']].forEach(([l,v])=>{doc.text(`${l}: ${v||'—'}`,10,y);y+=6;});
  y+=4;
  const secao=async(titulo,items)=>{
    if(y>260){doc.addPage();y=15;}
    doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text(titulo,10,y);y+=7;
    if(!items||!items.length){doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text('Nenhum problema registrado.',12,y);y+=8;return;}
    for(const[i,p] of items.entries()){
      if(y>255){doc.addPage();y=15;}
      doc.setFont('helvetica','bold');doc.setFontSize(9);
      doc.text(`${i+1}. ${p.status==='Solucionado'?'[SOLUCIONADO] ':'[PENDENTE] '}${p.descricao||'(sem descrição)'}${p.tipo?' ['+p.tipo+']':''}`,12,y);y+=6;
      if(p.status==='Solucionado'&&p.resolvidoPor){doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text(`Resolvido por ${p.resolvidoPor} em ${p.resolvidoEm?new Date(p.resolvidoEm).toLocaleString('pt-BR'):''}`,14,y);y+=6;}
      if(comFoto&&p.foto){
        const dataUrl=await fotoParaDataURL(p.foto);
        if(dataUrl){try{doc.addImage(dataUrl,'JPEG',12,y,40,26);y+=30;}catch(e){}}
      }
    }
    y+=4;
  };
 await secao('Ajuste',fin.ajuste);
  await secao('Martelinho',fin.martelinho);
  await secao('Pintura',fin.pintura);
  await secao('Vidro',fin.vidro);
  await secao('Estética',fin.outro);
  await secao('Instalação Peças',fin.instalacaoPecas);
  if(y>250){doc.addPage();y=15;}
  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text('Peças',10,y);y+=7;
  if(!pecasItems||!pecasItems.length){doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text('Nenhuma peça vinculada.',12,y);y+=8;}
  else pecasItems.forEach((it,i)=>{
    if(y>255){doc.addPage();y=15;}
    doc.setFont('helvetica','bold');doc.setFontSize(9);
    doc.text(`${i+1}. ${it.description||''} (Qtd ${it.quantity||1})${it.excedente?' [EXCEDENTE]':''}`,12,y);y+=5;
    doc.setFont('helvetica','normal');doc.setFontSize(8);
    let info=`Status: ${it.statusOriginal||it.status||'Pendente'}  ·  Solicitado por ${it._responsavel||'—'}`;
    if(it.status==='Comprado')info+=`  ·  Comprado em ${it.boughtAt?new Date(it.boughtAt+'T00:00:00').toLocaleDateString('pt-BR'):'—'}  ·  Previsão ${it.deliveryDate?new Date(it.deliveryDate+'T00:00:00').toLocaleDateString('pt-BR'):'—'}`;
    if(it.status==='Concluído')info+=`  ·  Recebido em ${it.actualDeliveryDate?new Date(it.actualDeliveryDate+'T00:00:00').toLocaleDateString('pt-BR'):'—'}`;
    doc.text(info,14,y);y+=7;
  });
  return doc;
}
const CATEGORIA_LABELS_HIST={ajuste:'Ajuste',martelinho:'Martelinho',pintura:'Pintura',vidro:'Vidro',outro:'Estética',instalacaoPecas:'Instalação Peças'};
function diffHistoricoProblemas(original,atualizado,usuario,now){
  const entradas=[];
  Object.keys(CATEGORIA_LABELS_HIST).forEach(cat=>{
    const antigos=original?.[cat]||[];
    const novos=atualizado?.[cat]||[];
    const idsAntigos=new Set(antigos.map(p=>p.id));
    const idsNovos=new Set(novos.map(p=>p.id));
    novos.forEach(p=>{
      if(!idsAntigos.has(p.id)){
        entradas.push({acao:`Problema adicionado em ${CATEGORIA_LABELS_HIST[cat]}: "${p.descricao||'(sem descrição)'}"`,usuario,timestamp:now});
      }
    });
    antigos.forEach(p=>{
      if(!idsNovos.has(p.id)){
        entradas.push({acao:`Problema removido em ${CATEGORIA_LABELS_HIST[cat]}: "${p.descricao||'(sem descrição)'}"`,usuario,timestamp:now});
      }
    });
  });
  return entradas;
}

const[showFotoAlert,setShowFotoAlert]=useState(false);
