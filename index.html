            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Estoque ────────────────────────────────────────────────────────────────
function EntradaEstoqueModal({item,onClose,loggedInUser}){
  const[quantidade,setQuantidade]=useState('');
  const[saving,setSaving]=useState(false);

  const confirmar=async()=>{
    const qtd=parseInt(quantidade)||0;
    if(qtd<=0)return alert('Informe uma quantidade válida.');
    setSaving(true);
    try{
      const now=Date.now();
      const novaQtd=(Number(item.quantidade)||0)+qtd;
      await col('estoque').doc(item.id).update({quantidade:novaQtd,atualizadoEm:now,atualizadoPor:loggedInUser.user});
      await col('estoqueMovimentos').add({
        estoqueId:item.id,fabricante:item.fabricante,modelo:item.modelo,descricao:item.descricao,
        tipo:'entrada',quantidade:qtd,os:null,
        executadoPor:loggedInUser.user,timestamp:now,
      });
      onClose();
    }catch(e){alert('Erro: '+e.message);}
    setSaving(false);
  };

  return(
    <div style={{position:'fixed',inset:0,zIndex:650,background:'rgba(0,0,0,.85)',display:'flex',alignItems:'center',justifyContent:'center',padding:16}} className="fade-in">
      <div style={{background:'#fff',borderRadius:24,overflow:'hidden',maxWidth:420,width:'100%',boxShadow:'0 40px 80px rgba(0,0,0,.4)'}}>
        <div style={{background:'#059669',padding:'22px 26px',color:'#fff'}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{width:40,height:40,background:'rgba(255,255,255,.2)',borderRadius:11,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name="plus-circle" size={18}/></div>
            <div><h3 style={{margin:0,fontSize:16,fontWeight:800}}>Entrada de Estoque</h3><p style={{margin:0,fontSize:9,opacity:.8,textTransform:'uppercase',marginTop:2}}>{item.descricao}</p></div>
          </div>
        </div>
        <div style={{padding:24,display:'flex',flexDirection:'column',gap:14}}>
          <div style={{background:'var(--smoke)',border:'1px solid var(--border)',borderRadius:10,padding:'10px 14px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontSize:9,fontWeight:700,textTransform:'uppercase',color:'var(--muted)'}}>{item.fabricante} · {item.modelo}</span>
            <span style={{fontSize:12,fontWeight:800}}>Atual: {item.quantidade||0}</span>
          </div>
          <div>
            <label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',display:'block',marginBottom:6}}>Quantidade a adicionar</label>
            <input type="number" min="1" value={quantidade} onChange={e=>setQuantidade(e.target.value)} className="input" style={{fontSize:20,fontWeight:800}} placeholder="0" autoFocus/>
          </div>
          <div style={{display:'flex',gap:10,marginTop:6}}>
            <button onClick={onClose} className="btn-ghost" style={{flex:1}}>Cancelar</button>
            <button onClick={confirmar} disabled={saving} className="btn-primary" style={{flex:2,background:'#059669'}}>
              {saving?<Icon name="refresh-cw" size={14} className="spin"/>:<Icon name="check" size={14}/>} Confirmar Entrada
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function AddEstoqueModal({onClose,loggedInUser,estoque}){
  const[fabricante,setFabricante]=useState('');
  const[modelo,setModelo]=useState('');
  const[descricao,setDescricao]=useState('');
  const[quantidade,setQuantidade]=useState('');
  const[saving,setSaving]=useState(false);

  const salvar=async()=>{
    if(!fabricante.trim()||!modelo.trim()||!descricao.trim())return alert('Preencha fabricante, modelo e peça.');
    const qtd=parseInt(quantidade)||0;
    setSaving(true);
    try{
      const id=estoqueDocId(fabricante,modelo,descricao);
      const existing=estoque.find(e=>e.id===id);
      const now=Date.now();
      if(existing){
        await col('estoque').doc(id).update({quantidade:(Number(existing.quantidade)||0)+qtd,atualizadoEm:now,atualizadoPor:loggedInUser.user});
      }else{
        await col('estoque').doc(id).set({fabricante:fabricante.trim(),modelo:modelo.trim(),descricao:descricao.trim().toUpperCase(),quantidade:qtd,atualizadoEm:now,atualizadoPor:loggedInUser.user});
      }
      if(qtd>0){
        await col('estoqueMovimentos').add({estoqueId:id,fabricante:fabricante.trim(),modelo:modelo.trim(),descricao:descricao.trim().toUpperCase(),tipo:'entrada',quantidade:qtd,os:null,executadoPor:loggedInUser.user,timestamp:now});
      }
      onClose();
    }catch(e){alert('Erro ao salvar: '+e.message);}
    setSaving(false);
  };

  return(
    <div style={{position:'fixed',inset:0,zIndex:600,background:'rgba(0,0,0,.85)',display:'flex',alignItems:'center',justifyContent:'center',padding:16}} className="fade-in">
      <div style={{background:'#fff',borderRadius:24,overflow:'hidden',maxWidth:440,width:'100%',boxShadow:'0 40px 80px rgba(0,0,0,.4)'}}>
        <div style={{background:'var(--ink)',padding:'22px 26px',display:'flex',alignItems:'center',gap:12,color:'#fff'}}>
          <div style={{width:40,height:40,background:'var(--red)',borderRadius:11,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name="plus-circle" size={18}/></div>
          <div><h3 style={{margin:0,fontSize:16,fontWeight:800}}>Adicionar Peça ao Estoque</h3></div>
        </div>
        <div style={{padding:24,display:'flex',flexDirection:'column',gap:14}}>
          <div><label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',display:'block',marginBottom:6}}>Fabricante</label><input type="text" value={fabricante} onChange={e=>setFabricante(sanitize(e.target.value))} className="input" placeholder="Ex: Volkswagen"/></div>
          <div><label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',display:'block',marginBottom:6}}>Modelo</label><input type="text" value={modelo} onChange={e=>setModelo(sanitize(e.target.value))} className="input" placeholder="Ex: Amarok"/></div>
          <div><label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',display:'block',marginBottom:6}}>Peça</label><input type="text" value={descricao} onChange={e=>setDescricao(sanitize(e.target.value))} className="input" placeholder="Ex: Parachoque Dianteiro" style={{textTransform:'uppercase'}}/></div>
          <div><label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',display:'block',marginBottom:6}}>Quantidade</label><input type="number" min="0" value={quantidade} onChange={e=>setQuantidade(e.target.value)} className="input" placeholder="0" style={{fontSize:18,fontWeight:800}}/></div>
          <div style={{display:'flex',gap:10,marginTop:6}}>
            <button onClick={onClose} className="btn-ghost" style={{flex:1}}>Cancelar</button>
            <button onClick={salvar} disabled={saving} className="btn-primary" style={{flex:2}}>{saving?<Icon name="refresh-cw" size={14} className="spin"/>:<Icon name="save" size={14}/>} Salvar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ImportEstoqueModal({onClose,loggedInUser}){
  const[rows,setRows]=useState([]);
  const[saving,setSaving]=useState(false);

  const handlePaste=e=>{
    const text=e.clipboardData.getData('text');const lines=text.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return;
    const headers=lines[0].split(/[,\t]/).map(h=>h.trim().toUpperCase());
    const fi=t=>headers.findIndex(h=>t.some(x=>h.includes(x)));
    const[iF,iM,iP,iQ]=[fi(['FABRICANTE','MARCA']),fi(['MODELO']),fi(['PEÇA','PECA','ITEM','DESCRI']),fi(['QTD','QUANTIDADE'])];
    const hasHeader=iF!==-1||iM!==-1||iP!==-1||iQ!==-1;
    const data=(hasHeader?lines.slice(1):lines).map(l=>{
      const v=l.split(/[,\t]/);
      const g=(i,fb)=>(i!==-1?v[i]:v[fb])?.trim()||'';
      return{fabricante:g(iF,0),modelo:g(iM,1),descricao:g(iP,2),quantidade:g(iQ,3)};
    }).filter(r=>r.modelo&&r.descricao);
    setRows(data);
  };

  const commit=async()=>{
    if(!rows.length)return;
    setSaving(true);
    try{
      const batch=db.batch();
      const now=Date.now();
      rows.forEach(r=>{
        const id=estoqueDocId(r.fabricante,r.modelo,r.descricao);
        batch.set(col('estoque').doc(id),{
          fabricante:r.fabricante.trim(),
          modelo:r.modelo.trim(),
          descricao:r.descricao.trim().toUpperCase(),
          quantidade:parseInt(r.quantidade)||0,
          atualizadoEm:now,
          atualizadoPor:loggedInUser.user,
        });
      });
      await batch.commit();
      dispatchRefresh();
      alert('Estoque atualizado! '+rows.length+' peça(s) processada(s).');
      onClose();
    }catch(e){alert('Erro ao importar: '+e.message);}
    setSaving(false);
  };

  return(
    <div style={{position:'fixed',inset:0,zIndex:600,background:'rgba(0,0,0,.9)',display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div style={{background:'#fff',width:'100%',maxWidth:900,height:'80vh',borderRadius:24,overflow:'hidden',boxShadow:'0 40px 80px rgba(0,0,0,.5)',display:'flex',flexDirection:'column'}}>
        <div style={{padding:'20px 28px',background:'var(--ink)',display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:'4px solid var(--red)',flexShrink:0}}>
          <div><h3 style={{margin:0,fontSize:18,fontWeight:800,color:'#fff'}}>Importar Estoque</h3><p style={{margin:0,fontSize:9,color:'rgba(255,255,255,.35)',textTransform:'uppercase',letterSpacing:'.1em',marginTop:2}}>Colunas: Fabricante, Modelo, Peça, Quantidade</p></div>
          <button onClick={onClose} style={{width:38,height:38,background:'rgba(255,255,255,.08)',border:'none',borderRadius:10,cursor:'pointer',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="x" size={20}/></button>
        </div>
        <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column',padding:20,gap:16}}>
          {rows.length===0?(
            <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',border:'2px dashed var(--border)',borderRadius:16,background:'var(--smoke)',position:'relative'}}>
              <Icon name="file-spreadsheet" size={52} style={{color:'var(--border)',marginBottom:12}}/>
              <p style={{fontSize:12,fontWeight:700,textTransform:'uppercase',color:'var(--muted)',margin:0}}>Pronto para importar</p>
              <p style={{fontSize:10,color:'var(--muted)',margin:'4px 0 0'}}>Selecione no Excel e CTRL+V</p>
              <p style={{fontSize:9,color:'var(--muted)',margin:'10px 0 0',maxWidth:340,textAlign:'center'}}>Peças já existentes (mesmo fabricante+modelo+peça) terão a quantidade substituída pela da planilha.</p>
              <textarea onPaste={handlePaste} style={{position:'absolute',inset:0,opacity:0,cursor:'pointer',resize:'none'}} autoFocus/>
            </div>
          ):(
            <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
              <div style={{flex:1,overflow:'auto',border:'1px solid var(--border)',borderRadius:12}} className="scroll-y">
                <table style={{width:'100%',borderCollapse:'collapse',minWidth:600}}>
                  <thead style={{background:'var(--smoke)',position:'sticky',top:0}}>
                    <tr>{['Fabricante','Modelo','Peça','Quantidade'].map(h=><th key={h} style={{padding:10,fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)',textAlign:'left',borderBottom:'1px solid var(--border)'}}>{h}</th>)}</tr>
                  </thead>
                  <tbody>
                    {rows.map((row,rIdx)=>(
                      <tr key={rIdx} style={{borderBottom:'1px solid var(--smoke)'}}>
                        {['fabricante','modelo','descricao','quantidade'].map(k=>(
                          <td key={k} style={{border:'none',padding:0,height:36}}><input className="excel-input" value={row[k]} onChange={e=>{const d=[...rows];d[rIdx][k]=sanitize(e.target.value);setRows(d);}}/></td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div style={{paddingTop:14,display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
                <p style={{fontSize:10,color:'var(--muted)',fontWeight:600}}>{rows.length} registros</p>
                <div style={{display:'flex',gap:10}}><button onClick={()=>setRows([])} className="btn-ghost">Limpar</button><button onClick={commit} disabled={saving} className="btn-primary" style={{padding:'11px 28px'}}>{saving?<Icon name="refresh-cw" size={14} className="spin"/>:null} Sincronizar</button></div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function AssociarEstoqueBaixaModal({estoqueItemFixo,reqFixo,estoque,requests,loggedInUser,onClose,onApplied}){
  // modoEstoque=true → veio da aba Estoque (peça de estoque já fixa; falta escolher OS + peça pendente)
  // modoEstoque=false → veio da Gestão (OS já fixa; falta escolher a peça pendente e depois a peça de estoque compatível)
  const modoEstoque=!!estoqueItemFixo;
  const[osInput,setOsInput]=useState('');
  const[itemSelecionado,setItemSelecionado]=useState(null);
  const[estoqueSelecionadoId,setEstoqueSelecionadoId]=useState(modoEstoque?(estoqueItemFixo?.id||null):null);
  const[saving,setSaving]=useState(false);

  const reqEncontrada=useMemo(()=>{
    if(!modoEstoque)return null;
    const t=osInput.trim();if(!t)return null;
    const matching=(requests||[]).filter(r=>String(r.os).trim()===t);
    return matching.length?matching[0]:null;
  },[requests,osInput,modoEstoque]);

  const vehicleModelo=modoEstoque?(reqEncontrada?.vehicleData?.modelo||''):(reqFixo?.vehicleData?.modelo||'');

  const modeloCompativel=modoEstoque
    ?(!!reqEncontrada&&normEstoqueTxt(vehicleModelo)===normEstoqueTxt(estoqueItemFixo?.modelo))
    :true;

  const itensPendentes=useMemo(()=>{
    if(modoEstoque){
      if(!reqEncontrada)return[];
      return getPecasParaOS(osInput.trim(),requests||[]).filter(it=>it.status!=='Concluído'&&it.status!=='Doado'&&!it.excedente);
    }
    return (reqFixo?.items||[]).filter(it=>it.status!=='Concluído'&&it.status!=='Doado'&&!it.excedente);
  },[modoEstoque,reqEncontrada,osInput,requests,reqFixo]);

  const estoqueCandidatos=useMemo(()=>{
    if(modoEstoque)return estoqueItemFixo?[estoqueItemFixo]:[];
    const modeloAlvo=normEstoqueTxt(reqFixo?.vehicleData?.modelo||'');
    return (estoque||[]).filter(e=>(Number(e.quantidade)||0)>0&&normEstoqueTxt(e.modelo)===modeloAlvo);
  },[modoEstoque,estoqueItemFixo,estoque,reqFixo]);

  const estoqueSelecionado=useMemo(()=>estoqueCandidatos.find(e=>e.id===estoqueSelecionadoId)||null,[estoqueCandidatos,estoqueSelecionadoId]);

  const qtdNecessaria=Number(itemSelecionado?.quantity)||1;
  const estoqueSuficiente=estoqueSelecionado?(Number(estoqueSelecionado.quantidade)||0)>=qtdNecessaria:false;
  const podeConfirmar=!!itemSelecionado&&!!estoqueSelecionado&&estoqueSuficiente&&(modoEstoque?modeloCompativel:true);

  const confirmar=async()=>{
    if(!podeConfirmar)return;
    setSaving(true);
    try{
      const now=Date.now();
      const qtd=qtdNecessaria;
      const osAlvo=modoEstoque?osInput.trim():String(reqFixo.os);
      await col('estoque').doc(estoqueSelecionado.id).update({quantidade:(Number(estoqueSelecionado.quantidade)||0)-qtd,atualizadoEm:now,atualizadoPor:loggedInUser.user});
      const reqIdAlvo=itemSelecionado._reqId;
      const docsAlvo=(requests||[]).filter(r=>r.id===reqIdAlvo);
      const dataEntrega=new Date().toISOString().slice(0,10);
      if(docsAlvo.length){
        const reqDoc=docsAlvo[0];
        const newItems=(reqDoc.items||[]).map(it=>String(it.id)===String(itemSelecionado.id)?{...it,status:'Concluído',recebidoDoEstoque:true,estoqueOrigemId:estoqueSelecionado.id,actualDeliveryDate:dataEntrega}:it);
        await col('requests').doc(reqDoc.id).update({items:stripUndefined(newItems)});
      }
      if(onApplied)onApplied(itemSelecionado.id,{status:'Concluído',recebidoDoEstoque:true,estoqueOrigemId:estoqueSelecionado.id,actualDeliveryDate:dataEntrega});
      await col('estoqueMovimentos').add({
        estoqueId:estoqueSelecionado.id,fabricante:estoqueSelecionado.fabricante,modelo:estoqueSelecionado.modelo,descricao:estoqueSelecionado.descricao,
        tipo:'baixa',quantidade:qtd,os:osAlvo,itemDescricao:itemSelecionado.description,
        executadoPor:loggedInUser.user,timestamp:now,
      });
      onClose();
    }catch(e){alert('Erro: '+e.message);}
    setSaving(false);
  };

  return(
    <div style={{position:'fixed',inset:0,zIndex:700,background:'rgba(0,0,0,.88)',display:'flex',alignItems:'center',justifyContent:'center',padding:16}} className="fade-in">
      <div style={{background:'#fff',borderRadius:24,overflow:'hidden',maxWidth:560,width:'100%',maxHeight:'88vh',display:'flex',flexDirection:'column',boxShadow:'0 40px 80px rgba(0,0,0,.4)'}}>
        <div style={{background:'var(--red)',padding:'22px 26px',color:'#fff',flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{width:40,height:40,background:'rgba(255,255,255,.2)',borderRadius:11,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name="minus-circle" size={18}/></div>
            <div>
              <h3 style={{margin:0,fontSize:16,fontWeight:800}}>Baixa de Estoque — Associar a Requisição</h3>
              <p style={{margin:0,fontSize:9,opacity:.8,textTransform:'uppercase',marginTop:2}}>{modoEstoque?(estoqueItemFixo?.descricao||''):'OS #'+reqFixo.os}</p>
            </div>
          </div>
        </div>
        <div style={{padding:20,overflowY:'auto',flex:1}} className="scroll-y">
          {modoEstoque&&(
            <div style={{marginBottom:16}}>
              <label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',display:'block',marginBottom:6}}>Número da OS de destino</label>
              <input type="text" inputMode="numeric" value={osInput} onChange={e=>{setOsInput(sanitize(e.target.value));setItemSelecionado(null);}} className="input" placeholder="Nº da OS" style={{fontSize:18,fontWeight:800}} autoFocus/>
              {osInput.trim()&&!reqEncontrada&&<p style={{fontSize:9,color:'var(--red)',fontWeight:700,marginTop:6}}>✗ Nenhum pedido encontrado para esta OS.</p>}
              {reqEncontrada&&!modeloCompativel&&(
                <p style={{fontSize:9,color:'var(--red)',fontWeight:700,marginTop:6}}>✗ O modelo da OS ({vehicleModelo||'—'}) não corresponde ao modelo desta peça em estoque ({estoqueItemFixo?.modelo}).</p>
              )}
              {reqEncontrada&&modeloCompativel&&<p style={{fontSize:9,color:'#059669',fontWeight:700,marginTop:6}}>✓ OS #{osInput.trim()} — {vehicleModelo} (modelo compatível)</p>}
            </div>
          )}

          {(!modoEstoque||(reqEncontrada&&modeloCompativel))&&(
            <div style={{marginBottom:16}}>
              <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',marginBottom:8}}>Selecione a peça pendente da requisição</p>
              {itensPendentes.length===0?(
                <p style={{fontSize:10,color:'var(--muted)'}}>Nenhuma peça pendente encontrada nesta OS.</p>
              ):(
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                  {itensPendentes.map((it,i)=>(
                    <label key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:10,border:`1.5px solid ${itemSelecionado?.id===it.id?'var(--red)':'var(--border)'}`,background:itemSelecionado?.id===it.id?'var(--red-light)':'#fff',cursor:'pointer'}}>
                      <input type="radio" checked={itemSelecionado?.id===it.id} onChange={()=>setItemSelecionado(it)} style={{width:15,height:15,accentColor:'var(--red)',flexShrink:0}}/>
                      {it.photo?<img src={it.photo} style={{width:36,height:36,borderRadius:7,objectFit:'cover',flexShrink:0}}/>:<div style={{width:36,height:36,borderRadius:7,background:'var(--smoke)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name="package" size={14}/></div>}
                      <div style={{flex:1,minWidth:0}}>
                        <p style={{fontSize:11,fontWeight:800,textTransform:'uppercase',margin:'0 0 3px'}}>{it.description}</p>
                        <div style={{display:'flex',gap:6,alignItems:'center'}}>
                          <StatusBadge status={it.status||'Pendente'}/>
                          <span style={{fontSize:8,color:'var(--muted)',fontWeight:700}}>Qtd necessária: {it.quantity}</span>
                        </div>
                      </div>
                    </label>
                  ))}
                </div>
              )}
            </div>
          )}

          {!modoEstoque&&itemSelecionado&&(
            <div>
              <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',marginBottom:8}}>Selecione a peça em estoque (modelo: {reqFixo?.vehicleData?.modelo||'—'})</p>
              {estoqueCandidatos.length===0?(
                <p style={{fontSize:10,color:'var(--red)',fontWeight:700}}>Nenhuma peça em estoque para o modelo {reqFixo?.vehicleData?.modelo||'—'}.</p>
              ):(
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                  {estoqueCandidatos.map(e=>(
                    <label key={e.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:10,border:`1.5px solid ${estoqueSelecionadoId===e.id?'var(--red)':'var(--border)'}`,background:estoqueSelecionadoId===e.id?'var(--red-light)':'#fff',cursor:'pointer'}}>
                      <input type="radio" checked={estoqueSelecionadoId===e.id} onChange={()=>setEstoqueSelecionadoId(e.id)} style={{width:15,height:15,accentColor:'var(--red)',flexShrink:0}}/>
                      <div style={{flex:1,minWidth:0}}>
                        <p style={{fontSize:11,fontWeight:800,textTransform:'uppercase',margin:0}}>{e.descricao}</p>
                        <p style={{fontSize:9,color:'var(--muted)',margin:0}}>{e.fabricante}</p>
                      </div>
                      <span className="badge" style={{background:(Number(e.quantidade)||0)>=qtdNecessaria?'#EDFAF3':'var(--red-light)',color:(Number(e.quantidade)||0)>=qtdNecessaria?'#0A6B34':'var(--red)',border:`1px solid ${(Number(e.quantidade)||0)>=qtdNecessaria?'#AAE6C5':'#FFBDBD'}`}}>{e.quantidade} un.</span>
                    </label>
                  ))}
                </div>
              )}
            </div>
          )}

          {modoEstoque&&itemSelecionado&&(
            <div style={{background:'var(--smoke)',border:'1px solid var(--border)',borderRadius:10,padding:'10px 14px',marginTop:4}}>
              <p style={{fontSize:9,fontWeight:700,color:'var(--muted)',margin:0}}>Disponível em estoque: <strong>{estoqueItemFixo?.quantidade||0}</strong> · Necessário: <strong>{qtdNecessaria}</strong></p>
              {!estoqueSuficiente&&<p style={{fontSize:9,color:'var(--red)',fontWeight:700,marginTop:4}}>Quantidade em estoque insuficiente para esta baixa.</p>}
            </div>
          )}
        </div>
        <div style={{padding:'16px 20px',background:'var(--smoke)',borderTop:'1px solid var(--border)',display:'flex',gap:10,flexShrink:0}}>
          <button onClick={onClose} className="btn-ghost" style={{flex:1}}>Cancelar</button>
          <button onClick={confirmar} disabled={saving||!podeConfirmar} className="btn-primary" style={{flex:2}}>
            {saving?<Icon name="refresh-cw" size={14} className="spin"/>:<Icon name="check" size={14}/>} Confirmar Baixa
          </button>
        </div>
      </div>
    </div>
  );
}

function EstoqueView({estoque,movimentos,requests,loggedInUser,isMaster}){
  const[search,setSearch]=useState('');
  const[showImport,setShowImport]=useState(false);
  const[showAdd,setShowAdd]=useState(false);
  const[baixaItem,setBaixaItem]=useState(null);
  const[entradaItem,setEntradaItem]=useState(null);
  const[historicoAberto,setHistoricoAberto]=useState(null);
  const[confirmDel,setConfirmDel]=useState(null);
  const[modelosAbertos,setModelosAbertos]=useState({});
  const[mostrarZerados,setMostrarZerados]=useState(false);

  const agrupado=useMemo(()=>{
    const t=search.trim().toLowerCase();
    const filtered=estoque.filter(e=>{
      // Peça zerada some da listagem — a exceção é quando ainda sobra quantidade
      // depois de uma baixa parcial, aí ela continua aparecendo com o saldo restante.
      if(!mostrarZerados&&(Number(e.quantidade)||0)<=0)return false;
      if(!t)return true;
      return String(e.modelo||'').toLowerCase().includes(t)||String(e.fabricante||'').toLowerCase().includes(t)||String(e.descricao||'').toLowerCase().includes(t);
    });
    const porFab={};
    filtered.forEach(e=>{
      const fab=e.fabricante||'Sem Fabricante';
      const mod=e.modelo||'Sem Modelo';
      if(!porFab[fab])porFab[fab]={};
      if(!porFab[fab][mod])porFab[fab][mod]=[];
      porFab[fab][mod].push(e);
    });
    return Object.entries(porFab).sort((a,b)=>a[0].localeCompare(b[0])).map(([fab,mods])=>({
      fabricante:fab,
      modelos:Object.entries(mods).sort((a,b)=>a[0].localeCompare(b[0])).map(([mod,items])=>({
        modelo:mod,
        items:items.sort((a,b)=>String(a.descricao).localeCompare(String(b.descricao))),
        total:items.reduce((a,i)=>a+(Number(i.quantidade)||0),0),
      })),
    }));
  },[estoque,search]);

  const totalPecas=estoque.reduce((a,e)=>a+(Number(e.quantidade)||0),0);
  const totalModelos=useMemo(()=>{
    const set=new Set();estoque.forEach(e=>set.add((e.fabricante||'')+'|'+(e.modelo||'')));return set.size;
  },[estoque]);
  const semEstoque=estoque.filter(e=>(Number(e.quantidade)||0)<=0).length;

  const toggleModelo=(key)=>setModelosAbertos(p=>({...p,[key]:p[key]===false}));
  const excluirItem=async(id)=>{
    try{await col('estoque').doc(id).delete();}catch(e){alert('Erro ao excluir: '+e.message);}
    setConfirmDel(null);
  };

  return(
    <div className="fade-up" style={{paddingBottom:40}}>
      <div style={{marginBottom:16,display:'flex',justifyContent:'space-between',alignItems:'flex-end',flexWrap:'wrap',gap:12}}>
        <div>
         <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.15em',color:'var(--red)',marginBottom:4}}>Controle de Peças</p>
          <h2 style={{fontSize:32,fontWeight:800,margin:0,letterSpacing:'-.02em'}}>Estoque</h2>
          <div style={{marginTop:8}}><LastUpdateBadge/></div>
        </div>
        {isMaster&&(
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button onClick={()=>setShowImport(true)} style={{display:'flex',alignItems:'center',gap:8,padding:'10px 18px',background:'var(--ink)',color:'#fff',border:'none',borderRadius:10,fontSize:10,fontWeight:800,textTransform:'uppercase',cursor:'pointer',letterSpacing:'.08em',borderBottom:'3px solid var(--red)',fontFamily:'Plus Jakarta Sans,sans-serif'}}>
              <Icon name="file-up" size={14}/> Importar Planilha
            </button>
            <button onClick={()=>setShowAdd(true)} className="btn-primary">
              <Icon name="plus-circle" size={14}/> Adicionar Peça
            </button>
          </div>
        )}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:10,marginBottom:20}}>
        {[
          {label:'Peças em Estoque',v:totalPecas,icon:'boxes',dark:true},
          {label:'Modelos Cadastrados',v:totalModelos,icon:'car'},
          {label:'Itens Zerados',v:semEstoque,icon:'alert-triangle',red:semEstoque>0},
        ].map((k,i)=>(
          <div key={i} style={{background:k.dark?'var(--ink)':k.red?'var(--red)':'var(--smoke)',color:k.dark||k.red?'#fff':'var(--ink)',borderRadius:14,padding:18,border:(!k.dark&&!k.red)?'1.5px solid var(--border)':'none'}}>
            <div style={{width:30,height:30,borderRadius:8,background:k.dark||k.red?'rgba(255,255,255,.12)':'var(--border)',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:12}}><Icon name={k.icon} size={15}/></div>
            <p style={{fontSize:30,fontWeight:800,lineHeight:1,margin:0}}>{k.v}</p>
            <p style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.08em',marginTop:6,opacity:.7}}>{k.label}</p>
          </div>
        ))}
      </div>

      <div style={{marginBottom:20}}>
        <div style={{position:'relative'}}>
          <input type="text" placeholder="Buscar por modelo, fabricante ou peça..." value={search} onChange={e=>setSearch(e.target.value)} className="input" style={{paddingLeft:36,fontSize:12}}/>
          <div style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',color:'var(--muted)'}}><Icon name="search" size={15}/></div>
        </div>
        {isMaster&&(
          <label style={{display:'flex',alignItems:'center',gap:6,fontSize:9,fontWeight:700,color:'var(--muted)',marginTop:8,cursor:'pointer'}}>
            <input type="checkbox" checked={mostrarZerados} onChange={e=>setMostrarZerados(e.target.checked)} style={{accentColor:'var(--red)'}}/>
            Mostrar peças zeradas (quantidade 0) para gerenciar
          </label>
        )}
      </div>
      {agrupado.length===0?(
        <div style={{padding:'64px 20px',textAlign:'center',background:'#fff',borderRadius:16,border:'1.5px dashed var(--border)'}}>
          <Icon name="boxes" size={32} style={{margin:'0 auto 10px',display:'block',color:'var(--muted)'}}/>
          <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',margin:0}}>{search?'Nenhum resultado encontrado':'Nenhuma peça cadastrada em estoque ainda'}</p>
        </div>
      ):(
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          {agrupado.map(grupo=>(
            <div key={grupo.fabricante}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
                <div style={{width:26,height:26,borderRadius:8,background:'var(--ink)',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="factory" size={13} style={{color:'#fff'}}/></div>
                <h3 style={{fontSize:14,fontWeight:800,textTransform:'uppercase',margin:0}}>{grupo.fabricante}</h3>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:10,marginLeft:8}}>
                {grupo.modelos.map(mg=>{
                  const key=grupo.fabricante+'|'+mg.modelo;
                  const aberto=modelosAbertos[key]!==false;
                  return(
                  <div key={key} className="card" style={{overflow:'hidden'}}>
                    <div onClick={()=>toggleModelo(key)} style={{padding:'12px 16px',background:'var(--smoke)',display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer'}}>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <Icon name={aberto?'chevron-down':'chevron-right'} size={14} style={{color:'var(--muted)'}}/>
                        <span style={{fontSize:12,fontWeight:800,textTransform:'uppercase'}}>{mg.modelo}</span>
                        <span className="pill" style={{fontSize:8}}>{mg.items.length} peça(s)</span>
                      </div>
                      <span style={{fontSize:11,fontWeight:800,color:'var(--red)'}}>{mg.total} un.</span>
                    </div>
                    {aberto&&(
                      <div className="table-scroll">
                        <table className="vtable w-full" style={{minWidth:640}}>
                          <thead><tr><th>Peça</th><th style={{textAlign:'center'}}>Qtd</th><th>Atualizado</th><th style={{textAlign:'right'}}>Ações</th></tr></thead>
                          <tbody>
                            {mg.items.map(it=>(
                              <React.Fragment key={it.id}>
                                <tr>
                                  <td style={{fontWeight:700,textTransform:'uppercase'}}>{it.descricao}</td>
                                  <td style={{textAlign:'center'}}>
                                    <span className="badge" style={{background:(Number(it.quantidade)||0)<=0?'var(--red-light)':'#EDFAF3',color:(Number(it.quantidade)||0)<=0?'var(--red)':'#0A6B34',border:`1px solid ${(Number(it.quantidade)||0)<=0?'#FFBDBD':'#AAE6C5'}`}}>{it.quantidade||0}</span>
                                  </td>
                                  <td style={{fontSize:9,color:'var(--muted)'}}>{it.atualizadoEm?new Date(it.atualizadoEm).toLocaleDateString('pt-BR'):'—'}{it.atualizadoPor?' · '+it.atualizadoPor:''}</td>
                                  <td style={{textAlign:'right'}}>
                                    <div style={{display:'flex',gap:6,justifyContent:'flex-end',flexWrap:'wrap'}}>
                                      <button onClick={()=>setHistoricoAberto(historicoAberto===it.id?null:it.id)} style={{display:'flex',alignItems:'center',gap:5,padding:'6px 10px',background:'var(--smoke)',border:'1px solid var(--border)',borderRadius:7,cursor:'pointer',color:'var(--muted)',fontSize:9,fontWeight:800,textTransform:'uppercase',fontFamily:'Plus Jakarta Sans,sans-serif',whiteSpace:'nowrap'}}><Icon name="history" size={12}/> Histórico</button>
                                      {isMaster&&(<>

// ── App Principal ─────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);

const[gestSearch,setGestSearch]=useState('');
const[gestFab,setGestFab]=useState('');

const{data:requests,loading:reqLoad}=useFirestore('requests');

  useEffect(()=>{const u=auth.onAuthStateChanged(u=>{if(u)setUser(u);else auth.signInAnonymously();});return u;},[]);

 useEffect(()=>{

  },[loggedIn]);

 useEffect(()=>{

 const role=loggedIn?.role||'solicitante';

  const isAdmin=role==='admin'||isMaster||isAdminEspecial;

  const addUser=async(u,p,r='solicitante')=>{
    // Só o Master 1 (Lucas.Sabino) pode criar masters
    if(r==='master'&&loggedIn?.user!==MASTER_USER)return alert('Somente o Master 1 pode criar usuários Master.');
    try{await col('users').add({user:u,pass:p,active:true,role:r});}catch{alert('Erro ao criar usuário.');}
  };
  const deleteUser=async(id,userObj)=>{
    // Ninguém pode excluir o próprio Master 1
    if(userObj?.user===MASTER_USER)return alert('O usuário Master 1 (Lucas.Sabino) não pode ser excluído.');
    // Só Master 1 pode excluir outros masters
    if(userObj?.role==='master'&&loggedIn?.user!==MASTER_USER)return alert('Somente o Master 1 pode excluir outros masters.');
    if(!window.confirm('Remover usuário "'+userObj?.user+'"?'))return;
    const docId=userObj?.id||id;
    if(!docId||docId===userObj?.user){setUsers(p=>p.filter(u=>u.id!==id&&u.user!==id));return;}
    try{await col('users').doc(docId).delete();}catch(e){console.error('deleteUser:',e);alert('Erro ao excluir: '+e.message);}
  };
  const toggleUser=async u=>{
    if(u.user===MASTER_USER)return; // Master 1 sempre ativo
    if(u.role==='master'&&loggedIn?.user!==MASTER_USER)return alert('Somente o Master 1 pode alterar outros masters.');

    try{await col('users').doc(u.id).update({active:s});}catch(e){console.error(e);alert('Erro ao alterar status.');}
  };
const changeRole=async(u,r)=>{
    if(u.user===MASTER_USER)return; // Master 1 nunca muda de role
    // Só Master 1 pode promover/rebaixar para/de master
    if((r==='master'||u.role==='master')&&loggedIn?.user!==MASTER_USER)return alert('Somente o Master 1 pode alterar a categoria Master.');
    if(!u.id){setUsers(p=>p.map(x=>x.user===u.user?{...x,role:r}:x));return;}

  };
 const toggleFinalizacaoAccess=async(u)=>{
    if(!isMaster)return;

  };
  const cleanDuplicateUsers=async()=>{
    if(!isMaster)return;
    const groups={};
    users.forEach(u=>{
      const key=(u.user||'').trim().toLowerCase();
      if(!key)return;
      if(!groups[key])groups[key]=[];
      groups[key].push(u);
    });
    const toDelete=[];
    Object.values(groups).forEach(group=>{
      if(group.length<=1)return;
      const keep=group.find(u=>u.user===MASTER_USER)||group.find(u=>u.role==='master')||group[0];
      group.forEach(u=>{if(u.id&&u.id!==keep.id)toDelete.push(u);});
    });
    if(!toDelete.length){alert('Nenhum usuário duplicado encontrado.');return;}
    if(!window.confirm(`Remover ${toDelete.length} conta(s) de usuário duplicada(s)? Esta ação é irreversível.`))return;
    try{
      for(const u of toDelete)await col('users').doc(u.id).delete();
      alert(`${toDelete.length} conta(s) duplicada(s) removida(s) com sucesso.`);
    }catch(e){alert('Erro ao limpar duplicados: '+e.message);}

  const defaultViewForRole=(r)=>{if(r==='leitor'||r==='comercial')return 'status';return 'request';};

 const handlePaste=e=>{
    const text=e.clipboardData.getData('text');const lines=text.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return;
    const headers=lines[0].split(/[,\t]/).map(h=>h.trim().toUpperCase());
    const fi=t=>headers.findIndex(h=>t.some(x=>h.includes(x)));
    const[iO,iM,iF,iC,iCh,iE,iL,iLP]=[fi(['OS']),fi(['MODELO']),fi(['FABRICANTE','MARCA']),fi(['COR']),fi(['CHASSI']),fi(['ETAPA']),fi(['LOCALIZA']),fi(['LINHA'])];
    const rows=(iO!==-1?lines.slice(1):lines).map(l=>{const v=l.split(/[,\t]/);const g=(i,fb)=>(i!==-1?v[i]:v[fb])?.trim()||'';return{os:g(iO,0),modelo:g(iM,1),fabricante:g(iF,2),cor:g(iC,3),chassi:g(iCh,4),etapa:g(iE,5),localizacao:g(iL,6),linhaProducao:g(iLP,7)};}).filter(r=>r.os);
    setImportData(rows);
  };
  const commitImport=async()=>{
    if(!importData.length)return;const batch=db.batch();
    importData.forEach(v=>batch.set(col('vehicles').doc(v.os),v));
    await batch.commit();dispatchRefresh();alert('Sucesso! '+importData.length+' veículos importados.');setImportData([]);setShowImport(false);
  };

  // Salva array completo de items no Firestore — chamado só ao confirmar
  const compressBase64=(b64,maxPx=600,quality=0.45)=>new Promise(resolve=>{
    if(!b64||!b64.startsWith('data:image')){resolve(b64);return;}
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>h&&w>maxPx){h=Math.round(h*maxPx/w);w=maxPx;}
      else if(h>maxPx){w=Math.round(w*maxPx/h);h=maxPx;}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>resolve(b64);
    img.src=b64;
  });

 const saveItems=async(reqId,newItems,os)=>{
    const req=requests.find(r=>r.id===reqId);if(!req)return;

    // Comprime fotos e remove os campos auxiliares (_responsavel/_timestamp/_reqId)
    const compressedItems=await Promise.all(newItems.map(async it=>{
      const{_responsavel,_timestamp,_reqId,...clean}=it;
      if(!clean.photo)return clean;
      const photo=await compressBase64(clean.photo,600,0.45);
      return{...clean,photo};
    }));

    // Reagrupa os itens pelo documento Firestore de origem, pois uma OS pode
    // estar espalhada em mais de um documento (inclusão adicional, Finalização, etc.)
    const grupos={};
    compressedItems.forEach((it,idx)=>{
      const origem=newItems[idx]._reqId||reqId;
      if(!grupos[origem])grupos[origem]=[];
      grupos[origem].push(it);
    });

    const alvoOS=os||req.os;
    const todosDocs=requests.filter(r=>String(r.os).trim()===String(alvoOS).trim());

    try{
      for(const doc of todosDocs){
        const itensDoDoc=grupos[doc.id]||[];
        if(itensDoDoc.length===0){
          // todos os itens deste documento foram excluídos → apaga o documento
          await col('requests').doc(doc.id).delete();
          continue;
        }
        let gs='Concluído';
        if(itensDoDoc.some(it=>it.status==='Pendente'))gs='Pendente';
        else if(itensDoDoc.some(it=>it.status==='Em Cotação'))gs='Em Cotação';
        else if(itensDoDoc.some(it=>it.status==='Comprado'))gs='Comprado';
        else if(itensDoDoc.some(it=>it.status==='Doado'))gs='Doado';
        const payload=stripUndefined(itensDoDoc);
        const estimado=JSON.stringify(payload).length;
        if(estimado>900000){
          alert(`Documento da OS ${alvoOS} ainda grande (~${Math.round(estimado/1024)}KB). Remova algumas fotos ou reduza itens.`);
          return;
        }
        await col('requests').doc(doc.id).update({items:payload,status:gs});
      }
    }catch(e){console.error('Erro ao salvar:',e);alert('Erro ao salvar: '+e.message);}
  };

  // ── Todos os hooks ANTES de qualquer return condicional ──────────────────
  
 const hoje=new Date();hoje.setHours(0,0,0,0);

        </div>

        {navItems.map(n=>(

            <Icon name="refresh-cw" size={12}/> Atualizar Informações
          </button>
          <button onClick={()=>setShowChangePwd(true)} style={{width:'100%',padding:'6px 0',marginBottom:8,background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.1)',borderRadius:8,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer',color:'rgba(255,255,255,.5)',transition:'all .15s',fontFamily:'Plus Jakarta Sans,sans-serif',display:'flex',alignItems:'center',justifyContent:'center',gap:6}} onMouseEnter={e=>{e.currentTarget.style.background='rgba(255,255,255,.14)';e.currentTarget.style.color='#fff';}} onMouseLeave={e=>{e.currentTarget.style.background='rgba(255,255,255,.06)';e.currentTarget.style.color='rgba(255,255,255,.5)';}}>
            <Icon name="key" size={12}/> Alterar Senha
          </button>
          <button onClick={logout} style={{width:'100%',padding:7,background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.12)',borderRadius:8,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer',color:'rgba(255,255,255,.5)',transition:'all .15s',fontFamily:'Plus Jakarta Sans,sans-serif'}} onMouseEnter={e=>{e.currentTarget.style.background='var(--red)';e.currentTarget.style.color='#fff';e.currentTarget.style.borderColor='var(--red)';}} onMouseLeave={e=>{e.currentTarget.style.background='rgba(255,255,255,.08)';e.currentTarget.style.color='rgba(255,255,255,.5)';e.currentTarget.style.borderColor='rgba(255,255,255,.12)';}}>Sair</button>
        </div>
      <div style={{textAlign:'center',paddingTop:6,flexShrink:0}}>
          <span style={{fontSize:8,fontWeight:700,color:user?'var(--red)':'rgba(255,255,255,.25)',display:'flex',alignItems:'center',justifyContent:'center',gap:5}}>
            <span className="pulse-beacon" style={{width:6,height:6,borderRadius:'50%',background:user?'var(--red)':'var(--muted)',display:'inline-block'}}/>{user?'ONLINE':'RECONECTANDO...'}
          </span>
          <p style={{fontSize:7,fontWeight:700,color:'rgba(255,255,255,.25)',margin:'4px 0 0'}}>Atualizado às {fmtHora(lastUpdate)}</p>
        </div>
      </nav>

      {/* Mobile Header */}
      <div id="mobile-header"><style>{`@media(min-width:768px){#mobile-header{display:none!important}}`}</style>
      <div style={{position:'fixed',top:0,left:0,right:0,zIndex:100,background:'#fff',borderBottom:'1px solid var(--border)',padding:'calc(env(safe-area-inset-top) + 12px) 16px 12px',display:'flex',alignItems:'center',justifyContent:'space-between',boxShadow:'0 2px 16px rgba(0,0,0,.06)',flexWrap:'nowrap',minHeight:56}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:32,height:32,background:'var(--red)',borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="shopping-cart" size={15}/></div>
            <h1 style={{fontSize:20,fontWeight:800,margin:0}}>VRZ</h1>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div style={{textAlign:'right'}}><p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',color:role==='master'?'#856A00':'var(--red)',margin:0,maxWidth:100,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{loggedIn.user}</p><RoleBadge role={loggedIn.role}/><p style={{fontSize:7,fontWeight:700,color:'var(--muted)',margin:'2px 0 0'}}>Atualizado {fmtHora(lastUpdate)}</p></div>
            {/* MELHORIA 2: botão alterar senha no mobile */}
        <button onClick={()=>window.dispatchEvent(new Event('vrz-refresh'))} title="Atualizar" aria-label="Atualizar" style={{width:46,height:44,background:'var(--smoke)',border:'1px solid var(--border)',borderRadius:9,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:2,cursor:'pointer'}}>
  <Icon name="refresh-cw" size={14}/>
  <span style={{fontSize:6.5,fontWeight:800,textTransform:'uppercase',letterSpacing:'.04em',color:'var(--muted)'}}>Atualizar</span>
</button>
           <button onClick={()=>setShowChangePwd(true)} title="Alterar Senha" aria-label="Alterar Senha" style={{width:46,height:44,background:'var(--smoke)',border:'1px solid var(--border)',borderRadius:9,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:2,cursor:'pointer'}}>
  <Icon name="key" size={14}/>
  <span style={{fontSize:6.5,fontWeight:800,textTransform:'uppercase',letterSpacing:'.04em',color:'var(--muted)'}}>Senha</span>
</button>
<button onClick={logout} title="Sair" aria-label="Sair" style={{width:46,height:44,background:'var(--red-light)',border:'1px solid #FFBDBD',borderRadius:9,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:2,cursor:'pointer'}}>
  <Icon name="log-out" size={14} className="" style={{color:'var(--red)'}}/>
  <span style={{fontSize:6.5,fontWeight:800,textTransform:'uppercase',letterSpacing:'.04em',color:'var(--red)'}}>Sair</span>
</button>
          </div>
        </div>
      </div>

      {/* Main */}
      <main style={{flex:1,overflowY:'auto',minWidth:0}} className="scroll-y">
        <div style={{padding:16,paddingTop:0}} id="main-pad">
         <style>{`@media(min-width:768px){#main-pad{padding:28px!important}}@media(max-width:767px){#main-pad{padding-top:calc(env(safe-area-inset-top) + 96px)!important;padding-bottom:90px!important}}`}</style>
          <div style={{maxWidth:1100,margin:'0 auto'}}>
            {loading?<Skeleton/>:(
              <>
                {view==='dashboard'&&(isMaster||isAdmin)&&<DashboardView requests={requests} vehicles={vehicles}/>}
{view==='resumo'&&(loggedIn?.user===MASTER_USER||loggedIn?.user==='Matheus.Ransi')&&<ResumoReuniaoView requests={requests}/>}
                {view==='request'&&isSol&&<RequestForm user={user} loggedInUser={loggedIn} vehiclesDB={vehicles} requests={requests}/>}
                {view==='status'&&<StatusView requests={requests} loggedInUser={loggedIn} vehicles={vehicles}/>}
                {view==='chegadas'&&<ChegadasView requests={requests} loggedInUser={loggedIn} vehicles={vehicles}/>}
                {view==='estoque'&&<EstoqueView estoque={estoque} movimentos={estoqueMovimentos} requests={requests} loggedInUser={loggedIn} isMaster={isMaster}/>}
               {view==='donor'&&canDo(role,'donor')&&<DonorSystem requests={requests} vehicles={vehicles} loggedInUser={loggedIn}/>}
                {view==='finalizacao'&&canAccessFinalizacao&&<FinalizacaoView vehiclesDB={vehicles} requests={requests} loggedInUser={loggedIn} isMaster={isMaster}/>}
               {view==='feedbackFinalizacao'&&canAccessFeedbackFinalizacao&&<FeedbackFinalizacaoView finalizacoes={finalizacoesApp} requests={requests} vehicles={vehicles} loggedInUser={loggedIn}/>}
                {view==='feedbackFinalizacaoReuniao'&&canAccessFeedbackFinalizacao&&<FeedbackFinalizacaoReuniaoView finalizacoes={finalizacoesApp} requests={requests} vehicles={vehicles} loggedInUser={loggedIn}/>}
                {view==='admin'&&canDo(role,'manage')&&(
                  <div className="fade-up" style={{paddingBottom:40}}>
                    <div style={{marginBottom:16}}>
                    <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.15em',color:'var(--red)',marginBottom:4}}>Administração</p>
                      <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',margin:'0 0 16px'}}>
                        <h2 style={{fontSize:32,fontWeight:800,margin:0,letterSpacing:'-.02em'}}>Gestão de Compras</h2>
                        <LastUpdateBadge/>
                      </div>
                    </div>
                   <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginBottom:16,flexWrap:'wrap'}}>
  <button onClick={()=>setShowImport(true)} style={{display:'flex',alignItems:'center',gap:8,padding:'10px 18px',background:'var(--ink)',color:'#fff',border:'none',borderRadius:10,fontSize:10,fontWeight:800,textTransform:'uppercase',cursor:'pointer',letterSpacing:'.08em',borderBottom:'3px solid var(--red)',fontFamily:'Plus Jakarta Sans,sans-serif'}}>
    <Icon name="file-up" size={14}/> Importar Planilha
  </button>
  <button onClick={()=>setSubView('cancelDonation')} style={{display:'flex',alignItems:'center',gap:8,padding:'10px 18px',background:'var(--red)',color:'#fff',border:'none',borderRadius:10,fontSize:10,fontWeight:800,textTransform:'uppercase',cursor:'pointer',letterSpacing:'.08em',borderBottom:'3px solid var(--red-deep)',fontFamily:'Plus Jakarta Sans,sans-serif'}}>
    <Icon name="undo-2" size={14}/> Cancelar Doação
  </button>
  <button onClick={()=>setSubView('deletedItems')} style={{display:'flex',alignItems:'center',gap:8,padding:'10px 18px',background:'#7C3AED',color:'#fff',border:'none',borderRadius:10,fontSize:10,fontWeight:800,textTransform:'uppercase',cursor:'pointer',letterSpacing:'.08em',borderBottom:'3px solid #5B21B6',fontFamily:'Plus Jakarta Sans,sans-serif'}}>
    <Icon name="archive-restore" size={14}/> Itens Excluídos
  </button>
</div>
                    <div style={{display:'flex',gap:4,background:'var(--smoke)',padding:4,borderRadius:12,border:'1px solid var(--border)',overflowX:'auto',marginBottom:20}}>
                      {[
                        {key:'pending',label:`Pendentes (${tabCounts.pending})`,color:'#C45E00'},
                        {key:'quoting',label:`Em Cotação (${tabCounts.quoting})`,color:'#1A4EC2'},
                       {key:'bought',label:`Comprado (${tabCounts.bought})`,color:'#6B21A8'},
                       {key:'overdue',label:`⚠ Atrasados (${tabCounts.overdue||0})`,color:'#DC1F1F'},
                       {key:'completed',label:`Concluídos (${tabCounts.completed})`,color:'#0A6B34'},
                        {key:'donated',label:`Doados (${tabCounts.donated})`,color:'#A81515'},
                       {key:'vehicles',label:`Veículos (${vehicles.length})`,color:'var(--ink)'},
                        isMaster&&{key:'excedentes',label:`Pedidos Excedentes (${excedentesCount})`,color:'#DC2626'},
                        isMaster&&{key:'users',label:'Usuários',color:'var(--red)'},
                        isMaster&&{key:'storage',label:'Capacidade',color:'#7C3AED'},
                      ].filter(Boolean).map(t=>(
                        <button key={t.key} onClick={()=>setSubView(t.key)} style={{padding:'8px 14px',borderRadius:9,fontSize:9,fontWeight:800,textTransform:'uppercase',whiteSpace:'nowrap',border:'none',cursor:'pointer',letterSpacing:'.06em',transition:'all .15s',background:subView===t.key?'#fff':'transparent',color:subView===t.key?t.color:'var(--muted)',boxShadow:subView===t.key?'0 2px 8px rgba(0,0,0,.08)':'none',fontFamily:'Plus Jakarta Sans,sans-serif'}}>
                          {t.label}
                        </button>
                      ))}
                    </div>

                {subView==='users'&&isMaster&&<UserManagement users={users} onAdd={addUser} onDelete={deleteUser} onToggle={toggleUser} onRole={changeRole} onFinalizacaoAccess={toggleFinalizacaoAccess} onCleanDuplicates={cleanDuplicateUsers} loggedInUser={loggedIn}/>}
{subView==='storage'&&isMaster&&<StorageView requests={requests} loggedInUser={loggedIn}/>}
{subView==='cancelDonation'&&isMaster&&<CancelDonationView requests={requests} loggedInUser={loggedIn}/>}
{subView==='deletedItems'&&isMaster&&<DeletedItemsView loggedInUser={loggedIn}/>}
{subView==='excedentes'&&isMaster&&<PedidosExcedentesView requests={requests}/>}
                    {subView==='vehicles'&&(
                      <div className="card" style={{overflow:'hidden'}}>
                        <div style={{overflowX:'auto',maxHeight:'60vh'}} className="scroll-y">
                          <table className="vtable w-full" style={{minWidth:900}}>
                           <thead style={{position:'sticky',top:0}}><tr>{['OS','Modelo','Fabricante','Cor','Chassi','Etapa','Localização','Linha Produção'].map(h=><th key={h}>{h}</th>)}</tr></thead>
                            <tbody>
                              {vehicles.length===0?<tr><td colSpan="8" style={{padding:40,textAlign:'center',fontSize:10,fontWeight:700,textTransform:'uppercase',color:'var(--muted)'}}>Nenhum veículo cadastrado</td></tr>:vehicles.map((v,i)=>(
                                <tr key={i}>
                                  <td style={{fontWeight:800,fontSize:13}}>#{v.os}</td><td style={{fontWeight:600,textTransform:'uppercase'}}>{v.modelo}</td><td style={{textTransform:'uppercase'}}>{v.fabricante}</td><td style={{textTransform:'uppercase'}}>{v.cor}</td>
                                  <td className="mono" style={{fontSize:10,fontWeight:700}}>{v.chassi}</td>
                                  <td><span className="badge badge-pending">{v.etapa}</span></td><td style={{textTransform:'uppercase'}}>{v.localizacao}</td><td style={{textTransform:'uppercase'}}>{v.linhaProducao||'—'}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}

                  {['pending','quoting','bought','overdue','completed','donated'].includes(subView)&&(()=>{
                      const merged=mergeByOS(requests);
                      const hojeAba=new Date();hojeAba.setHours(0,0,0,0);
                      const baseFiltered=merged.filter(req=>{
                        if(subView==='pending')return req.items?.some(it=>it.status==='Pendente');
                        if(subView==='quoting')return req.items?.some(it=>it.status==='Em Cotação');
                        if(subView==='bought')return req.items?.some(it=>it.status==='Comprado');
                        if(subView==='overdue')return req.items?.some(it=>{
                          if(it.status!=='Comprado'||!it.deliveryDate)return false;
                          const prazo=new Date(it.deliveryDate+'T00:00:00');
                          return prazo<hojeAba;
                        });
                        if(subView==='donated')return req.items?.some(it=>it.status==='Doado');
                        return req.items?.every(it=>it.status==='Concluído'||it.status==='Doado');
                      });
                    const fabricantes=[...new Set(baseFiltered.map(r=>r.vehicleData?.fabricante||'').filter(Boolean))].sort();
                      const filtered=baseFiltered.filter(req=>{
                        const t=gestSearch.toLowerCase();
                        const mb=!t||String(req.os||'').toLowerCase().includes(t)||String(req.vehicleData?.chassi||'').toLowerCase().includes(t)||String(req.vehicleData?.modelo||'').toLowerCase().includes(t);
                        const mf=!gestFab||req.vehicleData?.fabricante===gestFab;
                        return mb&&mf;
                      });
                      const accentCol=subView==='pending'?'#C45E00':subView==='quoting'?'#1A4EC2':subView==='bought'?'#6B21A8':subView==='donated'?'#A81515':'#0A6B34';
                      return(
                        <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:12}}>
                          {/* Barra de busca + filtro fabricante */}
                          <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
                            <div style={{position:'relative',flex:1,minWidth:200}}>
                              <input type="text" placeholder="Buscar OS / Chassi / Modelo..." value={gestSearch} onChange={e=>setGestSearch(e.target.value)} className="input" style={{paddingLeft:36,fontSize:11}}/>
                              <div style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',color:'var(--muted)'}}><Icon name="search" size={14}/></div>
                              {gestSearch&&<button onClick={()=>setGestSearch('')} style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'var(--muted)',fontSize:14,lineHeight:1}}>×</button>}
                            </div>
                            {fabricantes.length>0&&(
                              <select value={gestFab} onChange={e=>setGestFab(e.target.value)} className="input" style={{width:'auto',padding:'8px 14px',fontSize:10,fontWeight:700,appearance:'auto',minWidth:160}}>
                                <option value="">Todos os fabricantes</option>
                                {fabricantes.map(f=><option key={f} value={f}>{f}</option>)}
                              </select>
                            )}
                            {(gestSearch||gestFab)&&(
                              <button onClick={()=>{setGestSearch('');setGestFab('');}} style={{display:'flex',alignItems:'center',gap:5,padding:'8px 14px',background:'var(--smoke)',border:'1.5px solid var(--border)',borderRadius:10,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer',color:'var(--muted)',fontFamily:'Plus Jakarta Sans,sans-serif',whiteSpace:'nowrap'}}>
                                <Icon name="x" size={12}/> Limpar
                              </button>
                            )}
                          </div>
                          {filtered.length===0&&<div style={{padding:'48px 20px',textAlign:'center',background:'#fff',borderRadius:14,border:'1.5px dashed var(--border)'}}><p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',margin:0}}>{gestSearch||gestFab?'Nenhum resultado para os filtros aplicados':'Nenhum pedido nesta categoria'}</p></div>}
                          {filtered.map(req=>(
                            <div key={req.os} className="card" style={{display:'flex',alignItems:'center',gap:16,padding:'14px 16px',borderLeft:`3px solid ${accentCol}`}}>
                              <div style={{textAlign:'center',flexShrink:0}}>
                                <p style={{fontSize:7,fontWeight:700,textTransform:'uppercase',color:'var(--muted)',margin:0}}>OS</p>
                                <p style={{fontSize:16,fontWeight:800,margin:0}}>#{req.os}</p>
                                <p style={{fontSize:8,color:'var(--muted)',fontWeight:600,margin:0}}>{req.unidade||'Unidade 1'}</p>
                                {req._merged&&<span style={{fontSize:7,fontWeight:800,padding:'1px 5px',borderRadius:999,background:'#EAF0FF',color:'#1A4EC2',border:'1px solid #C0D0F5',display:'inline-block',marginTop:3}}>Mesclado</span>}
{req.parte&&req.totalPartes>1&&<span style={{fontSize:7,fontWeight:800,padding:'1px 5px',borderRadius:999,background:'#F3E8FF',color:'#6B21A8',border:'1px solid #D8B4FE',display:'inline-block',marginTop:3}}>Parte {req.parte}/{req.totalPartes}</span>}
                              </div>
                              <div style={{flex:1,minWidth:0}}>
                                <p style={{fontSize:7,fontWeight:700,textTransform:'uppercase',color:'var(--muted)',margin:'0 0 6px'}}>Itens ({req.items?.length||0}) · {req.vehicleData?.modelo||'—'}</p>
                                <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                                  {req.items?.map((it,i)=>(
                                    <span key={i} style={{display:'inline-flex',flexDirection:'column',gap:2,background:it.status==='Concluído'?'#0A6B3410':it.status==='Doado'?'#FFF0F0':it.status==='Comprado'?'#F3E8FF':it.status==='Em Cotação'?'#EAF0FF':'#FFF4E6',border:`1px solid ${it.status==='Concluído'?'#AAE6C5':it.status==='Doado'?'#FFBDBD':it.status==='Comprado'?'#D8B4FE':it.status==='Em Cotação'?'#C0D0F5':'#FFD9A8'}`,borderRadius:7,padding:'4px 8px',fontSize:9,fontWeight:700,textTransform:'uppercase',color:it.status==='Concluído'?'#0A6B34':it.status==='Doado'?'var(--red)':it.status==='Comprado'?'#6B21A8':it.status==='Em Cotação'?'#1A4EC2':'#C45E00'}}>
                                      <span>{it.description}</span>
                                      {it.receivedFrom&&<span style={{fontSize:7,fontWeight:700,opacity:.8}}>← OS #{it.receivedFrom}</span>}
                                      {it.donatedTo&&!it.receivedFrom&&<span style={{fontSize:7,fontWeight:700,opacity:.8}}>→ OS #{it.donatedTo}</span>}
                                    </span>
                                  ))}
                                </div>
                              </div>
                              <button onClick={()=>setEditing(req)} style={{display:'flex',alignItems:'center',gap:6,padding:'9px 16px',background:'var(--ink)',color:'#fff',border:'none',borderBottom:'3px solid var(--red)',borderRadius:10,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer',flexShrink:0,fontFamily:'Plus Jakarta Sans,sans-serif'}}>
                                <Icon name="edit-2" size={13}/> Gerenciar
                              </button>
                            </div>
                          ))}
                        </div>
                      );
                    })()}
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      </main>

      {/* Mobile Bottom Nav */}
      <div id="mobile-bottom"><style>{`@media(min-width:768px){#mobile-bottom{display:none!important}}`}</style>
        <div className="bottom-nav">
          {navItems.map(n=>(
            <button key={n.key} onClick={()=>setView(n.key)} className={`bottom-nav-btn ${view===n.key?'active':''}`}>
              <div style={{position:'relative',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <Icon name={n.icon} size={21}/>
                {n.badge>0&&<span style={{position:'absolute',top:-2,right:-2,width:8,height:8,borderRadius:'50%',background:'var(--red)',border:'2px solid #fff'}}/>}
              </div>
              <span>{n.label}</span>
            </button>
          ))}
        </div>
      </div>

      {/* Import Modal */}
      {showImport&&canDo(role,'manage')&&(
        <div style={{position:'fixed',inset:0,zIndex:300,background:'rgba(0,0,0,.9)',display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
          <div style={{background:'#fff',width:'100%',maxWidth:1000,height:'82vh',borderRadius:24,overflow:'hidden',boxShadow:'0 40px 80px rgba(0,0,0,.5)',display:'flex',flexDirection:'column'}}>
            <div style={{padding:'20px 28px',background:'var(--ink)',display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:'4px solid var(--red)',flexShrink:0}}>
              <div><h3 style={{margin:0,fontSize:20,fontWeight:800,color:'#fff'}}>Importar Planilha</h3><p style={{margin:0,fontSize:9,color:'rgba(255,255,255,.35)',textTransform:'uppercase',letterSpacing:'.1em',marginTop:2}}>Cole os dados do Excel (Ctrl+V)</p></div>
              <button onClick={()=>{setShowImport(false);setImportData([]);}} style={{width:38,height:38,background:'rgba(255,255,255,.08)',border:'none',borderRadius:10,cursor:'pointer',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="x" size={20}/></button>
            </div>
            <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column',padding:20,gap:16}}>
              {importData.length===0?(
                <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',border:'2px dashed var(--border)',borderRadius:16,background:'var(--smoke)',position:'relative'}}>
                  <Icon name="file-spreadsheet" size={52} style={{color:'var(--border)',marginBottom:12}}/>
                  <p style={{fontSize:12,fontWeight:700,textTransform:'uppercase',color:'var(--muted)',margin:0}}>Pronto para importar</p>
                  <p style={{fontSize:10,color:'var(--muted)',margin:'4px 0 0'}}>Selecione no Excel e CTRL+V</p>
                  <textarea onPaste={handlePaste} style={{position:'absolute',inset:0,opacity:0,cursor:'pointer',resize:'none'}} autoFocus/>
                </div>
              ):(
                <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
                  <div style={{flex:1,overflow:'auto',border:'1px solid var(--border)',borderRadius:12}} className="scroll-y">
                    <table style={{width:'100%',borderCollapse:'collapse',minWidth:900}}>
                      <thead style={{background:'var(--smoke)',position:'sticky',top:0}}>
                       <tr>{['OS','Modelo','Fabricante','Cor','Chassi','Etapa','Localização','Linha Produção'].map(h=><th key={h} style={{padding:10,fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)',textAlign:'left',borderBottom:'1px solid var(--border)'}}>{h}</th>)}</tr>
                      </thead>
                      <tbody>
                        {importData.map((row,rIdx)=>(
                          <tr key={rIdx} style={{borderBottom:'1px solid var(--smoke)'}}>
                            {['os','modelo','fabricante','cor','chassi','etapa','localizacao','linhaProducao'].map(k=>(
                              <td key={k} style={{border:'none',padding:0,height:36}}><input className="excel-input" value={row[k]} onChange={e=>{const d=[...importData];d[rIdx][k]=sanitize(e.target.value);setImportData(d);}}/></td>
                            ))}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  <div style={{paddingTop:14,display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
                    <p style={{fontSize:10,color:'var(--muted)',fontWeight:600}}>{importData.length} registros</p>
                    <div style={{display:'flex',gap:10}}><button onClick={()=>setImportData([])} className="btn-ghost">Limpar</button><button onClick={commitImport} className="btn-primary" style={{padding:'11px 28px'}}>Sincronizar</button></div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Editing Modal — estado local, salva só ao confirmar */}
     {editing&&(isMaster||isAdmin)&&(
        <EditingModal
          key={editing.id}
          req={editing}
          onClose={()=>setEditing(null)}
          onSave={saveItems}
          estoque={estoque}
          isMaster={isMaster}
          loggedInUser={loggedIn}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
