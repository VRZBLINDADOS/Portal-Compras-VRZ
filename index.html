          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
            <div style={{width:40,height:40,background:'var(--ink)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name="hard-drive" size={18} style={{color:'#fff'}}/></div>
            <div><p style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.12em',color:'var(--muted)',margin:0}}>Storage Estimado</p><p style={{fontSize:9,color:'var(--muted)',margin:0}}>Foto ~800KB · Sem foto ~30KB</p></div>
          </div>
          <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',marginBottom:8}}><span style={{fontSize:36,fontWeight:800,lineHeight:1}}>{fmtBytes(bytesU)}</span><span style={{fontSize:10,color:'var(--muted)',fontWeight:600}}>de 1 GB</span></div>
          <div className="progress-track" style={{marginBottom:6}}><div className="progress-fill" style={{width:`${pctSt}%`,background:pctSt>=85?'var(--red)':pctSt>=60?'#F59E0B':'#7C3AED'}}/></div>
          <p style={{fontSize:9,color:'var(--muted)',fontWeight:600,marginBottom:14}}>{pctSt.toFixed(1)}% usado</p>
          <div style={{background:'#FFFBE6',border:'1px solid #FFE680',borderRadius:10,padding:12}}><p style={{fontSize:8,fontWeight:800,textTransform:'uppercase',color:'#856A00',margin:'0 0 4px'}}>💡 Dica</p><p style={{fontSize:9,color:'#856A00',fontWeight:600,lineHeight:1.5,margin:0}}>Arquive e exclua concluídos regularmente.</p></div>
        </div>
      </div>
      <div className="card" style={{overflow:'hidden'}}>
        <div style={{padding:'14px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
          <div><p style={{fontSize:12,fontWeight:800,textTransform:'uppercase',margin:0}}>Arquivar Pedidos Concluídos</p><p style={{fontSize:9,color:'var(--muted)',fontWeight:600,margin:0,marginTop:2}}>Exporte e exclua para liberar capacidade</p></div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {[{label:'Excel',icon:'file-spreadsheet',cb:exportCSV,bg:'#059669',disabled:!qtdSel},{label:'PDF',icon:'file-down',cb:exportPDF,bg:'#2563EB',disabled:!qtdSel||exportando,sp:exportando},{label:'Excluir',icon:'trash-2',cb:()=>qtdSel&&setConfirmar(true),bg:'var(--red)',disabled:!qtdSel||excluindo}].map((b,i)=>(
              <button key={i} onClick={b.cb} disabled={b.disabled} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',background:b.disabled?'var(--smoke)':b.bg,color:b.disabled?'var(--muted)':'#fff',border:'none',borderRadius:8,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:b.disabled?'not-allowed':'pointer'}}>
                {b.sp?<Icon name="loader" size={13} className="spin"/>:<Icon name={b.icon} size={13}/>} {b.label} ({qtdSel})
              </button>
            ))}
          </div>
        </div>
        {concluidos.length===0?(
          <div style={{padding:'48px 20px',textAlign:'center'}}><p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',margin:0}}>Nenhum pedido totalmente concluído</p></div>
        ):(
          <>
            <div style={{overflowX:'auto'}}>
              <table className="vtable w-full" style={{minWidth:750}}>
                <thead><tr><th style={{width:40}}><input type="checkbox" checked={todosSel} onChange={toggleTodos} style={{width:15,height:15,accentColor:'var(--red)',cursor:'pointer'}}/></th>{['OS','Unidade','Veículo','Solicitante','Data','Itens','Valor'].map(h=><th key={h}>{h}</th>)}</tr></thead>
                <tbody>
                  {concluidos.map(r=>{
                    const vT=(r.items||[]).reduce((a,it)=>a+parseFloat(it.price||0),0);
                    return(<tr key={r.id} onClick={()=>setSel(p=>({...p,[r.id]:!p[r.id]}))} style={{cursor:'pointer',background:sel[r.id]?'var(--red-light)':'transparent'}}>
                      <td onClick={e=>e.stopPropagation()}><input type="checkbox" checked={!!sel[r.id]} onChange={()=>setSel(p=>({...p,[r.id]:!p[r.id]}))} style={{width:15,height:15,accentColor:'var(--red)',cursor:'pointer'}}/></td>
                      <td style={{fontWeight:800,fontSize:13}}>#{r.os}</td><td><span className="pill" style={{fontSize:8}}>{r.unidade||'Unidade 1'}</span></td>
                      <td><p style={{fontSize:10,fontWeight:700,textTransform:'uppercase',margin:0}}>{r.vehicleData?.modelo||'—'}</p><p className="mono" style={{fontSize:8,color:'var(--muted)',margin:0}}>{r.vehicleData?.chassi||''}</p></td>
                      <td style={{fontSize:10,fontWeight:600,textTransform:'uppercase',color:'var(--muted)'}}>{r.responsavel||'—'}</td>
                      <td style={{fontSize:10,color:'var(--muted)'}}>{r.timestamp?new Date(r.timestamp).toLocaleDateString('pt-BR'):'—'}</td>
                      <td style={{textAlign:'center'}}><span className="badge" style={{background:'var(--ink)',color:'#fff'}}>{r.items?.length||0}</span></td>
                      <td style={{fontSize:10,fontWeight:800,color:'#059669'}}>{vT>0?fmtBRL(vT):'—'}</td>
                    </tr>);
                  })}
                </tbody>
              </table>
            </div>
            <div style={{padding:'10px 16px',background:'var(--ink)',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
              <div style={{display:'flex',alignItems:'center',gap:16}}><p style={{fontSize:8,fontWeight:700,textTransform:'uppercase',color:'rgba(255,255,255,.4)',margin:0}}>{qtdSel} de {concluidos.length} selecionados</p>{qtdSel>0&&<p style={{fontSize:8,fontWeight:700,color:'#059669',margin:0}}>Libera ~{fmtBytes(estimarBytes(pedSel))}</p>}</div>
              <div style={{display:'flex',gap:8}}><button onClick={()=>setSel({})} style={{fontSize:8,fontWeight:700,textTransform:'uppercase',color:'rgba(255,255,255,.4)',background:'none',border:'none',cursor:'pointer',padding:'5px 10px',borderRadius:7}}>Limpar</button><button onClick={toggleTodos} style={{fontSize:8,fontWeight:700,textTransform:'uppercase',color:'rgba(255,255,255,.6)',background:'rgba(255,255,255,.06)',border:'none',cursor:'pointer',padding:'5px 12px',borderRadius:7}}>{todosSel?'Desmarcar todos':'Selecionar todos'}</button></div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ── EditingModal — estado 100% local, salva APENAS ao clicar Salvar ────────
function EditingModal({req,onClose,onSave}){
  // Copia profunda dos items para estado local — nunca toca no Firestore enquanto digita
  const[localItems,setLocalItems]=useState(()=>JSON.parse(JSON.stringify(req.items||[])));
  const[saving,setSaving]=useState(false);

  // Atualiza um campo de um item localmente (sem salvar)
  const setField=(idx,key,val)=>{
    setLocalItems(prev=>{
      const next=[...prev];
      next[idx]={...next[idx],[key]:val};
      return next;
    });
  };

  // Aplica regra de status automático ao desfocar o campo
  const applyStatusRule=(idx)=>{
    setLocalItems(prev=>{
      const next=[...prev];
      const it={...next[idx]};
      // Não sobrescreve se já estiver Concluído ou Doado
      if(it.status==='Concluído'||it.status==='Doado')return prev;
      if(it.actualDeliveryDate) it.status='Concluído';
      else if(it.boughtAt)      it.status='Comprado';
      else if(it.price&&it.supplier&&it.deliveryDate) it.status='Em Cotação';
      next[idx]=it;
      return next;
    });
  };

  const markBought=(idx)=>{
    setLocalItems(prev=>{
      const next=[...prev];
      next[idx]={...next[idx],status:'Comprado',boughtAt:new Date().toISOString().slice(0,10)};
      return next;
    });
  };

  const unmarkBought=(idx)=>{
    setLocalItems(prev=>{
      const next=[...prev];
      next[idx]={...next[idx],status:'Em Cotação',boughtAt:''};
      return next;
    });
  };

  const handleSave=async()=>{
    setSaving(true);
    await onSave(req.id,localItems);
    setSaving(false);
    onClose();
  };

  return(
    <div style={{position:'fixed',inset:0,zIndex:200,background:'rgba(0,0,0,.9)',backdropFilter:'blur(4px)',display:'flex',alignItems:'center',justifyContent:'center',padding:16,overflowY:'auto'}}>
      <div style={{background:'#fff',width:'100%',maxWidth:1000,borderRadius:24,boxShadow:'0 40px 80px rgba(0,0,0,.5)',display:'flex',flexDirection:'column',margin:'auto',borderBottom:'5px solid var(--red)'}}>
        {/* Header */}
        <div style={{padding:'20px 28px',background:'var(--ink)',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
          <div>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <h3 style={{margin:0,fontSize:18,fontWeight:800,color:'#fff'}}>OS #{req.os}</h3>
              <span style={{padding:'3px 10px',borderRadius:999,background:'rgba(255,255,255,.08)',color:'rgba(255,255,255,.5)',border:'1px solid rgba(255,255,255,.12)',fontSize:8,fontWeight:800}}>{req.unidade||'Unidade 1'}</span>
            </div>
            <p style={{margin:0,fontSize:9,color:'var(--red)',fontWeight:700,textTransform:'uppercase',marginTop:4}}>{req.vehicleData?.modelo||''}{req.vehicleData?.chassi?' · '+req.vehicleData.chassi:''}</p>
          </div>
          <button onClick={onClose} style={{width:38,height:38,background:'rgba(255,255,255,.08)',border:'none',borderRadius:10,cursor:'pointer',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="x" size={20}/></button>
        </div>

        {/* Body */}
        <div style={{padding:24,overflowY:'auto',maxHeight:'68vh'}} className="scroll-y">
          {localItems.map((it,idx)=>(
            <div key={idx} style={{background:it.status==='Doado'?'var(--red-light)':it.status==='Comprado'?'#F5F0FF':'var(--smoke)',borderRadius:14,padding:18,border:`1.5px solid ${it.status==='Doado'?'#FFBDBD':it.status==='Comprado'?'#D8B4FE':'var(--border)'}`,marginBottom:12}}>
              {/* Topo do item */}
              <div style={{display:'flex',alignItems:'flex-start',gap:12,marginBottom:16}}>
                {it.photo
                  ?<img src={it.photo} style={{width:52,height:52,borderRadius:10,objectFit:'cover',border:'1px solid var(--border)',flexShrink:0}} alt="Peça"/>
                  :<div style={{width:52,height:52,borderRadius:10,background:'var(--border)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name="package" size={20}/></div>
                }
                <div style={{minWidth:0,flex:1}}>
                  <p style={{fontSize:13,fontWeight:800,textTransform:'uppercase',margin:'0 0 8px',color:'var(--ink)'}}>{it.description||'(sem descrição)'}</p>
                  <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                    <span style={{fontSize:9,color:'var(--muted)',fontWeight:600}}>Qtd: {it.quantity}</span>
                    <StatusBadge status={it.status||'Pendente'} orig={it.statusOriginal}/>
                    {it.receivedFrom&&(
                      <span style={{display:'inline-flex',alignItems:'center',gap:3,padding:'2px 7px',background:'#EDFAF3',border:'1px solid #AAE6C5',borderRadius:6,fontSize:8,fontWeight:800,color:'#0A6B34'}}>
                        <Icon name="arrow-left" size={10}/> Recebida OS #{it.receivedFrom}
                      </span>
                    )}
                    {it.donatedTo&&!it.receivedFrom&&(
                      <span style={{display:'inline-flex',alignItems:'center',gap:3,padding:'2px 7px',background:'#FFF0F0',border:'1px solid #FFBDBD',borderRadius:6,fontSize:8,fontWeight:800,color:'var(--red)'}}>
                        <Icon name="arrow-right" size={10}/> Doada OS #{it.donatedTo}
                      </span>
                    )}
                    {it.status==='Em Cotação'&&(
                      <button type="button" onClick={()=>markBought(idx)} className="btn-bought">
                        <Icon name="shopping-bag" size={12}/> Já foi comprado?
                      </button>
                    )}
                    {it.status==='Comprado'&&(
                      <button type="button" onClick={()=>unmarkBought(idx)} style={{fontSize:8,fontWeight:700,padding:'3px 8px',borderRadius:6,border:'1px solid #D8B4FE',background:'#F5F0FF',color:'#6B21A8',cursor:'pointer',fontFamily:'Plus Jakarta Sans,sans-serif'}}>
                        ↩ Desfazer compra
                      </button>
                    )}
                  </div>
                  {it.boughtAt&&<p style={{fontSize:8,color:'#6B21A8',fontWeight:700,margin:'6px 0 0'}}>🛍 Comprado em {it.boughtAt}</p>}
                </div>
              </div>

              {/* Campos de preenchimento — editam estado LOCAL */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:12}} className="md-4col">
                <style>{`@media(min-width:768px){.md-4col{grid-template-columns:repeat(4,1fr)!important}}`}</style>

                {/* Valor */}
                <div>
                  <label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',display:'block',marginBottom:6}}>Valor Total (R$)</label>
                  <input
                    type="number" step="0.01" min="0"
                    placeholder="0,00"
                    value={it.price||''}
                    disabled={it.status==='Concluído'||it.status==='Doado'}
                    onChange={e=>setField(idx,'price',e.target.value)}
                    onBlur={()=>applyStatusRule(idx)}
                    className="input"
                    style={{fontSize:13,fontWeight:700,opacity:(it.status==='Concluído'||it.status==='Doado')?.6:1}}
                  />
                </div>

                {/* Fornecedor */}
                <div>
                  <label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',display:'block',marginBottom:6}}>Fornecedor</label>
                  <input
                    type="text"
                    placeholder="Nome da loja"
                    value={it.supplier||''}
                    disabled={it.status==='Concluído'||it.status==='Doado'}
                    onChange={e=>setField(idx,'supplier',sanitize(e.target.value))}
                    onBlur={()=>applyStatusRule(idx)}
                    className="input"
                    style={{fontSize:13,fontWeight:700,opacity:(it.status==='Concluído'||it.status==='Doado')?.6:1}}
                  />
                </div>

                {/* Prazo */}
                <div>
                  <label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',display:'block',marginBottom:6}}>Prazo de entrega</label>
                  <input
                    type="date"
                    value={it.deliveryDate||''}
                    disabled={it.status==='Concluído'||it.status==='Doado'}
                    onChange={e=>setField(idx,'deliveryDate',e.target.value)}
                    onBlur={()=>applyStatusRule(idx)}
                    className="input"
                    style={{fontSize:13,opacity:(it.status==='Concluído'||it.status==='Doado')?.6:1}}
                  />
                </div>

                {/* Entrega Real */}
                <div>
                  <label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--red)',display:'block',marginBottom:6}}>✓ Data de Entrega Real</label>
                  <input
                    type="date"
                    value={it.actualDeliveryDate||''}
                    disabled={it.status==='Pendente'||it.status==='Doado'}
                    onChange={e=>setField(idx,'actualDeliveryDate',e.target.value)}
                    onBlur={()=>applyStatusRule(idx)}
                    className="input"
                    style={{fontSize:13,background:'var(--red-light)',borderColor:'#FFBDBD',opacity:(it.status==='Pendente'||it.status==='Doado')?.6:1}}
                  />
                </div>
              </div>
            </div>
          ))}
        </div>

        {/* Footer */}
        <div style={{padding:'16px 24px',background:'var(--smoke)',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0,gap:12,flexWrap:'wrap'}}>
          <p style={{fontSize:8,color:'var(--muted)',fontWeight:600,fontStyle:'italic',margin:0}}>
            Preencha Valor + Fornecedor + Prazo → Em Cotação &nbsp;|&nbsp; "Já foi comprado?" → Comprado &nbsp;|&nbsp; Data de Entrega Real → Concluído
          </p>
          <div style={{display:'flex',gap:10}}>
            <button onClick={onClose} className="btn-ghost" style={{padding:'11px 20px'}}>Cancelar</button>
            <button onClick={handleSave} disabled={saving} className="btn-primary" style={{padding:'11px 28px',minWidth:160}}>
              {saving?<><Icon name="refresh-cw" size={14} className="spin"/> Salvando...</>:<><Icon name="save" size={14}/> Salvar alterações</>}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Chegadas View — itens entregues (actualDeliveryDate preenchido) ────────
function ChegadasView({requests,loggedInUser,vehicles}){
  const[filtro,setFiltro]=useState('7'); // dias: '7','30','todos'
  const[search,setSearch]=useState('');
  const[lidas,setLidas]=useState(()=>{try{return JSON.parse(localStorage.getItem('vrz_lidas')||'[]');}catch{return[];}});

  // Mapa de veículos por OS
  const vehicleMap=useMemo(()=>{const m={};vehicles.forEach(v=>{m[String(v.os).trim()]=v;});return m;},[vehicles]);

  // Coleta todos os itens entregues (com actualDeliveryDate) de todos os pedidos
  const chegadas=useMemo(()=>{
    const now=Date.now();
    const dias=filtro==='todos'?99999:parseInt(filtro);
    const limite=now-(dias*86400000);
    const list=[];
    requests.forEach(req=>{
      (req.items||[]).forEach(it=>{
        if(!it.actualDeliveryDate)return;
        const dt=new Date(it.actualDeliveryDate+'T00:00:00').getTime();
        if(dt<limite)return;
        const t=search.toLowerCase();
        if(t&&!String(req.os).toLowerCase().includes(t)&&!String(it.description).toLowerCase().includes(t)&&!String(req.vehicleData?.modelo||'').toLowerCase().includes(t)&&!String(req.responsavel||'').toLowerCase().includes(t))return;
        const vInfo=vehicleMap[String(req.os).trim()]||req.vehicleData||{};
        list.push({
          reqId:req.id,
          itemId:it.id,
          os:req.os,
          unidade:req.unidade||'Unidade 1',
          responsavel:req.responsavel||'—',
          vehicleData:req.vehicleData||{},
          etapa:vInfo.etapa||'',
          localizacao:vInfo.localizacao||'',
          item:it,
          entregaTs:dt,
          uid:String(req.os)+'_'+String(it.id||it.description),
        });
      });
    });
    // Mais recentes primeiro
    list.sort((a,b)=>b.entregaTs-a.entregaTs);
    return list;
  },[requests,filtro,search,vehicleMap]);

  const naoLidas=chegadas.filter(c=>!lidas.includes(c.uid)).length;

  const marcarTodasLidas=()=>{
    const ids=chegadas.map(c=>c.uid);
    const novo=[...new Set([...lidas,...ids])];
    setLidas(novo);
    try{localStorage.setItem('vrz_lidas',JSON.stringify(novo));}catch{}
  };
  const marcarLida=(uid)=>{
    if(lidas.includes(uid))return;
    const novo=[...lidas,uid];
    setLidas(novo);
    try{localStorage.setItem('vrz_lidas',JSON.stringify(novo));}catch{}
  };

  const hoje=new Date().toLocaleDateString('pt-BR');

  return(
    <div className="fade-up" style={{paddingBottom:24}}>
      {/* Header */}
      <div style={{marginBottom:20}}>
        <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',flexWrap:'wrap',gap:12,marginBottom:16}}>
          <div>
            <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.15em',color:'var(--red)',marginBottom:4}}>Portal VRZ</p>
            <div style={{display:'flex',alignItems:'center',gap:12}}>
              <h2 style={{fontSize:32,fontWeight:800,margin:0,letterSpacing:'-.02em'}}>Chegadas</h2>
              {naoLidas>0&&(
                <div style={{background:'var(--red)',color:'#fff',borderRadius:999,padding:'4px 10px',fontSize:10,fontWeight:800,display:'flex',alignItems:'center',gap:5}}>
                  <span className="pulse-beacon" style={{width:6,height:6,borderRadius:'50%',background:'#fff',display:'inline-block'}}/>
                  {naoLidas} {naoLidas===1?'nova':'novas'}
                </div>
              )}
            </div>
          </div>
          {naoLidas>0&&(
            <button onClick={marcarTodasLidas} style={{display:'flex',alignItems:'center',gap:6,padding:'9px 16px',background:'var(--ink)',color:'#fff',border:'none',borderRadius:10,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer',letterSpacing:'.06em',fontFamily:'Plus Jakarta Sans,sans-serif'}}>
              <Icon name="check-check" size={14}/> Marcar todas como vistas
            </button>
          )}
        </div>

        {/* Filtros */}
        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
          <div style={{display:'flex',gap:3,background:'var(--smoke)',padding:4,borderRadius:12,border:'1px solid var(--border)'}}>
            {[{v:'7',l:'Últimos 7 dias'},{v:'30',l:'Últimos 30 dias'},{v:'todos',l:'Todas'}].map(f=>(
              <button key={f.v} onClick={()=>setFiltro(f.v)} style={{padding:'7px 14px',borderRadius:9,fontSize:9,fontWeight:800,textTransform:'uppercase',border:'none',cursor:'pointer',letterSpacing:'.06em',transition:'all .15s',fontFamily:'Plus Jakarta Sans,sans-serif',background:filtro===f.v?'#fff':'transparent',color:filtro===f.v?'#0A6B34':'var(--muted)',boxShadow:filtro===f.v?'0 2px 8px rgba(0,0,0,.08)':'none',whiteSpace:'nowrap'}}>
                {f.l}
              </button>
            ))}
          </div>
          <div style={{position:'relative',flex:1,minWidth:200}}>
            <input type="text" placeholder="Buscar OS / Peça / Modelo..." value={search} onChange={e=>setSearch(e.target.value)} className="input" style={{paddingLeft:36,fontSize:11}}/>
            <div style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',color:'var(--muted)'}}><Icon name="search" size={14}/></div>
          </div>
        </div>
      </div>

      {/* Resumo rápido */}
      {chegadas.length>0&&(
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:10,marginBottom:20}}>
          {[
            {label:'Total de chegadas',v:chegadas.length,icon:'package-check',bg:'var(--ink)',fg:'#fff'},
            {label:'Não visualizadas',v:naoLidas,icon:'bell',bg:'var(--red)',fg:'#fff'},
            {label:'Hoje',v:chegadas.filter(c=>new Date(c.item.actualDeliveryDate+'T00:00:00').toLocaleDateString('pt-BR')===hoje).length,icon:'calendar-check',bg:'var(--smoke)',fg:'var(--ink)'},
          ].map((k,i)=>(
            <div key={i} style={{background:k.bg,color:k.fg,borderRadius:14,padding:'16px 20px',border:k.bg==='var(--smoke)'?'1.5px solid var(--border)':'none'}}>
              <div style={{width:30,height:30,borderRadius:8,background:k.bg==='var(--smoke)'?'var(--border)':'rgba(255,255,255,.15)',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:10}}><Icon name={k.icon} size={15}/></div>
              <p style={{fontSize:30,fontWeight:800,lineHeight:1,margin:0}}>{k.v}</p>
              <p style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.08em',marginTop:4,opacity:.65}}>{k.label}</p>
            </div>
          ))}
        </div>
      )}

      {/* Lista */}
      {chegadas.length===0?(
        <div style={{padding:'64px 20px',textAlign:'center',background:'#fff',borderRadius:16,border:'1.5px dashed var(--border)'}}>
          <div style={{width:64,height:64,background:'var(--smoke)',borderRadius:18,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px'}}><Icon name="package" size={28}/></div>
          <p style={{fontSize:11,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',margin:'0 0 6px'}}>Nenhuma chegada no período</p>
          <p style={{fontSize:10,color:'var(--muted)',margin:0}}>As peças entregues aparecerão aqui quando a data de entrega real for preenchida</p>
        </div>
      ):(
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {chegadas.map((c,idx)=>{
            const isNova=!lidas.includes(c.uid);
            const dtFormatada=new Date(c.item.actualDeliveryDate+'T00:00:00').toLocaleDateString('pt-BR');
            return(
              <div key={c.uid} onClick={()=>marcarLida(c.uid)} className="card" style={{borderLeft:`3px solid ${isNova?'var(--red)':'#AAE6C5'}`,cursor:'pointer',transition:'all .15s',opacity:isNova?1:.82}}
                onMouseEnter={e=>e.currentTarget.style.background='var(--smoke)'}
                onMouseLeave={e=>e.currentTarget.style.background='#fff'}>
                <div style={{padding:'14px 16px'}}>
                  <div style={{display:'flex',alignItems:'flex-start',gap:14}}>
                    {/* Foto ou ícone */}
                    <div style={{flexShrink:0}}>
                      {c.item.photo?(
                        <img src={c.item.photo} style={{width:56,height:56,borderRadius:10,objectFit:'cover',border:'1.5px solid var(--border)'}} alt="Peça"/>
                      ):(
                        <div style={{width:56,height:56,borderRadius:10,background:isNova?'var(--red-light)':'var(--smoke)',border:`1.5px solid ${isNova?'#FFBDBD':'var(--border)'}`,display:'flex',alignItems:'center',justifyContent:'center'}}>
                          <Icon name="package" size={22}/>
                        </div>
                      )}
                    </div>

                    {/* Conteúdo */}
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:6}}>
                        {isNova&&<span style={{display:'inline-flex',alignItems:'center',gap:4,background:'var(--red)',color:'#fff',fontSize:8,fontWeight:800,padding:'2px 8px',borderRadius:999,textTransform:'uppercase',letterSpacing:'.06em'}}><span className="pulse-beacon" style={{width:5,height:5,borderRadius:'50%',background:'#fff',display:'inline-block'}}/>Nova</span>}
                        <span style={{fontSize:15,fontWeight:800,color:'var(--ink)'}}>OS #{c.os}</span>
                        <span className="pill" style={{fontSize:8}}>{c.unidade}</span>
                        {c.etapa&&<span style={{display:'inline-flex',alignItems:'center',gap:3,padding:'3px 8px',borderRadius:6,background:'#FFF4E6',border:'1px solid #FFD9A8',fontSize:8,fontWeight:800,color:'#C45E00',textTransform:'uppercase'}}><Icon name="layers" size={9}/>{c.etapa}</span>}
                        {c.localizacao&&<span style={{display:'inline-flex',alignItems:'center',gap:3,padding:'3px 8px',borderRadius:6,background:'#EAF0FF',border:'1px solid #C0D0F5',fontSize:8,fontWeight:800,color:'#1A4EC2',textTransform:'uppercase'}}><Icon name="map-pin" size={9}/>{c.localizacao}</span>}
                      </div>

                      <p style={{fontSize:13,fontWeight:700,textTransform:'uppercase',margin:'0 0 6px',color:'var(--ink)'}}>{c.item.description}</p>

                      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(90px,1fr))',gap:'4px 16px'}}>
                        {[
                          ['Veículo',c.vehicleData?.modelo||'—'],
                          ['Solicitante',c.responsavel],
                          ['Qtd',c.item.quantity],
                          ['Entregue em',dtFormatada],
                        ].map(([l,v])=>(
                          <div key={l}>
                            <p style={{fontSize:7,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',margin:'0 0 1px'}}>{l}</p>
                            <p style={{fontSize:10,fontWeight:700,color:'var(--ink)',margin:0}}>{v}</p>
                          </div>
                        ))}
                      </div>

                      {/* Fornecedor e valor se existir */}
                      {(c.item.supplier||c.item.price>0)&&(
                        <div style={{display:'flex',gap:10,marginTop:8,flexWrap:'wrap'}}>
                          {c.item.supplier&&<span style={{fontSize:9,fontWeight:700,color:'var(--muted)',display:'flex',alignItems:'center',gap:4}}><Icon name="store" size={11}/>{c.item.supplier}</span>}
                          {c.item.price>0&&<span style={{fontSize:9,fontWeight:800,color:'#059669'}}>{fmtBRL(c.item.price)}</span>}
                        </div>
                      )}
                    </div>

                    {/* Badge de status */}
                    <div style={{flexShrink:0,textAlign:'right'}}>
                      <div style={{width:40,height:40,borderRadius:10,background:isNova?'var(--red)':'#EDFAF3',border:`1px solid ${isNova?'var(--red)':'#AAE6C5'}`,display:'flex',alignItems:'center',justifyContent:'center'}}>
                        <Icon name={isNova?'bell':'check-circle'} size={18} style={{color:isNova?'#fff':'#059669'}}/>
                      </div>
                      <p style={{fontSize:7,fontWeight:800,textTransform:'uppercase',color:isNova?'var(--red)':'#059669',margin:'4px 0 0',letterSpacing:'.06em'}}>{isNova?'Nova':'Vista'}</p>
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── Login ─────────────────────────────────────────────────────────────────
function LoginView({onLogin,usersList}){
  const[u,setU]=useState('');const[p,setP]=useState('');const[showP,setShowP]=useState(false);const[err,setErr]=useState('');
  const submit=e=>{
    e.preventDefault();
    const found=usersList.find(x=>x.user.toLowerCase()===u.trim().toLowerCase()&&x.pass===p.trim());
    if(found){if(found.active===false){setErr('Conta desativada. Contate o Admin.');}else{onLogin(found);}}
    else{setErr('Usuário ou senha incorretos.');}
  };
  return(
    <div className="login-bg" style={{height:'100vh',width:'100%',display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div style={{background:'#fff',width:'100%',maxWidth:380,borderRadius:24,overflow:'hidden',boxShadow:'0 40px 80px rgba(0,0,0,.4)',borderBottom:'6px solid var(--red)'}} className="fade-in">
        <div style={{background:'var(--ink)',padding:'40px 32px',textAlign:'center',color:'#fff'}}>
          <div style={{width:56,height:56,background:'var(--red)',borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px',boxShadow:'0 8px 24px rgba(220,31,31,.4)'}}><Icon name="shopping-cart" size={28}/></div>
          <h1 style={{fontSize:36,fontWeight:800,margin:0,letterSpacing:'-.02em',color:'#fff'}}>VRZ Compras</h1>
          <p style={{fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:'.18em',color:'rgba(255,255,255,.3)',margin:'8px 0 0'}}>Acesso Restrito ao Sistema</p>
        </div>
        <form onSubmit={submit} style={{padding:32,display:'flex',flexDirection:'column',gap:20}}>
          {err&&(<div className="shake" style={{background:'var(--red-light)',border:'1px solid #FFBDBD',borderRadius:10,padding:'10px 14px',display:'flex',alignItems:'center',gap:8}}><Icon name="alert-circle" size={14}/><span style={{fontSize:10,fontWeight:700,textTransform:'uppercase',color:'var(--red)'}}>{err}</span></div>)}
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            <div><label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.14em',color:'var(--muted)',display:'block',marginBottom:6}}>Usuário</label>
              <div style={{position:'relative'}}><div style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'var(--muted)'}}><Icon name="user" size={15}/></div><input type="text" value={u} onChange={e=>setU(e.target.value)} className="input" style={{paddingLeft:38}} placeholder="USUÁRIO" required/></div></div>
            <div><label style={{fontSize:8,fontWeight:800,textTransform:'uppercase',letterSpacing:'.14em',color:'var(--muted)',display:'block',marginBottom:6}}>Senha</label>
              <div style={{position:'relative'}}><div style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'var(--muted)'}}><Icon name="lock" size={15}/></div><input type={showP?'text':'password'} value={p} onChange={e=>setP(e.target.value)} className="input" style={{paddingLeft:38,paddingRight:40,letterSpacing:showP?'normal':'.2em'}} placeholder="••••••••" required/><button type="button" onClick={()=>setShowP(!showP)} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'var(--muted)',padding:4,display:'flex',alignItems:'center',justifyContent:'center',borderRadius:6,transition:'color .15s'}} onMouseEnter={e=>e.currentTarget.style.color='var(--ink)'} onMouseLeave={e=>e.currentTarget.style.color='var(--muted)'} title={showP?'Ocultar senha':'Ver senha'}>
                  {showP?(
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                  ):(
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  )}
                </button></div></div>
          </div>
          <button type="submit" className="btn-primary" style={{width:'100%',padding:15,fontSize:11,letterSpacing:'.1em'}}>Entrar no Portal</button>
        </form>
      </div>
    </div>
  );
}

// ── App Principal ─────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[loggedIn,setLoggedIn]=useState(null);
  const[view,setView]=useState('request');
  const[subView,setSubView]=useState('pending');
  const[importData,setImportData]=useState([]);const[showImport,setShowImport]=useState(false);const[editing,setEditing]=useState(null);
  const[showChangePwd,setShowChangePwd]=useState(false); // MELHORIA 2

  const{data:requests,loading:reqLoad}=useFirestore('requests');
  const{data:vehicles,loading:vehLoad}=useFirestore('vehicles');
  const{data:usersData,loading:usrLoad}=useFirestore('users');
  const[users,setUsers]=useState([]);
  const[initDone,setInitDone]=useState(false);

  useEffect(()=>{
    if(usrLoad)return;
    if(!initDone){
      INIT_USERS.forEach(async iu=>{
        const exists=usersData.find(d=>d.user.toLowerCase()===iu.user.toLowerCase());
        if(!exists){try{await col('users').add(iu);}catch(e){console.warn('seed user:',e);}}
      });
      setInitDone(true);
    }
    setUsers(usersData);
    // Atualiza loggedIn se os dados do usuário mudaram (ex: senha alterada)
    setLoggedIn(prev=>{
      if(!prev)return prev;
      const fresh=usersData.find(u=>u.user===prev.user);
      return fresh?{...prev,...fresh}:prev;
    });
  },[usersData,usrLoad]);

  useEffect(()=>{const u=auth.onAuthStateChanged(u=>{if(u)setUser(u);else auth.signInAnonymously();});return u;},[]);

  const role=loggedIn?.role||'solicitante';
  const isMaster=role==='master';
  const isAdmin=role==='admin'||isMaster;
  const isSol=canDo(role,'newReq');

  const addUser=async(u,p,r='solicitante')=>{
    // Só o Master 1 (Lucas.Sabino) pode criar masters
    if(r==='master'&&loggedIn?.user!==MASTER_USER)return alert('Somente o Master 1 pode criar usuários Master.');
    try{await col('users').add({user:u,pass:p,active:true,role:r});}catch{alert('Erro ao criar usuário.');}
  };
  const deleteUser=async(id,userObj)=>{
    // Ninguém pode excluir o próprio Master 1
    if(userObj?.user===MASTER_USER)return alert('O usuário Master 1 (Lucas.Sabino) não pode ser excluído.');
    // Só Master 1 pode excluir outros masters
    if(userObj?.role==='master'&&loggedIn?.user!==MASTER_USER)return alert('Somente o Master 1 pode excluir outros masters.');
    if(!window.confirm('Remover usuário "'+userObj?.user+'"?'))return;
    const docId=userObj?.id||id;
    if(!docId||docId===userObj?.user){setUsers(p=>p.filter(u=>u.id!==id&&u.user!==id));return;}
    try{await col('users').doc(docId).delete();}catch(e){console.error('deleteUser:',e);alert('Erro ao excluir: '+e.message);}
  };
  const toggleUser=async u=>{
    if(u.user===MASTER_USER)return; // Master 1 sempre ativo
    if(u.role==='master'&&loggedIn?.user!==MASTER_USER)return alert('Somente o Master 1 pode alterar outros masters.');
    const s=!(u.active!==false);
    if(!u.id){setUsers(p=>p.map(x=>x.user===u.user?{...x,active:s}:x));return;}
    try{await col('users').doc(u.id).update({active:s});}catch(e){console.error(e);alert('Erro ao alterar status.');}
  };
  const changeRole=async(u,r)=>{
    if(u.user===MASTER_USER)return; // Master 1 nunca muda de role
    // Só Master 1 pode promover/rebaixar para/de master
    if((r==='master'||u.role==='master')&&loggedIn?.user!==MASTER_USER)return alert('Somente o Master 1 pode alterar a categoria Master.');
    if(!u.id){setUsers(p=>p.map(x=>x.user===u.user?{...x,role:r}:x));return;}
    try{await col('users').doc(u.id).update({role:r});}catch(e){console.error(e);alert('Erro ao alterar categoria.');}
  };

  const defaultViewForRole=(r)=>{if(r==='leitor')return 'status';return 'request';};
  const login=u=>{
    const found=users.find(x=>x.user.toLowerCase()===u.user.toLowerCase()&&x.pass===u.pass);
    if(found){setLoggedIn(found);setView(defaultViewForRole(found.role));}
  };
  const logout=()=>{setLoggedIn(null);setView('request');};

  const handlePaste=e=>{
    const text=e.clipboardData.getData('text');const lines=text.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return;
    const headers=lines[0].split(/[,\t]/).map(h=>h.trim().toUpperCase());
    const fi=t=>headers.findIndex(h=>t.some(x=>h.includes(x)));
    const[iO,iM,iF,iC,iCh,iE,iL]=[fi(['OS']),fi(['MODELO']),fi(['FABRICANTE','MARCA']),fi(['COR']),fi(['CHASSI']),fi(['ETAPA']),fi(['LOCALIZA'])];
    const rows=(iO!==-1?lines.slice(1):lines).map(l=>{const v=l.split(/[,\t]/);const g=(i,fb)=>(i!==-1?v[i]:v[fb])?.trim()||'';return{os:g(iO,0),modelo:g(iM,1),fabricante:g(iF,2),cor:g(iC,3),chassi:g(iCh,4),etapa:g(iE,5),localizacao:g(iL,6)};}).filter(r=>r.os);
    setImportData(rows);
  };
  const commitImport=async()=>{
    if(!importData.length)return;const batch=db.batch();
    importData.forEach(v=>batch.set(col('vehicles').doc(v.os),v));
    await batch.commit();alert('Sucesso! '+importData.length+' veículos importados.');setImportData([]);setShowImport(false);
  };

  // Salva array completo de items no Firestore — chamado só ao confirmar
  const saveItems=async(reqId,newItems)=>{
    const req=requests.find(r=>r.id===reqId);if(!req)return;
    let gs='Concluído';
    if(newItems.some(it=>it.status==='Pendente'))gs='Pendente';
    else if(newItems.some(it=>it.status==='Em Cotação'))gs='Em Cotação';
    else if(newItems.some(it=>it.status==='Comprado'))gs='Comprado';
    else if(newItems.some(it=>it.status==='Doado'))gs='Doado';
    try{await col('requests').doc(reqId).update({items:stripUndefined(newItems),status:gs});}
    catch(e){console.error('Erro ao salvar:',e);alert('Erro ao salvar: '+e.message);}
  };

  // ── Todos os hooks ANTES de qualquer return condicional ──────────────────
  const tabCounts={
    pending:requests.filter(r=>r.items?.some(it=>it.status==='Pendente')).length,
    quoting:requests.filter(r=>r.items?.some(it=>it.status==='Em Cotação')).length,
    bought:requests.filter(r=>r.items?.some(it=>it.status==='Comprado')).length,
    completed:requests.filter(r=>r.items?.every(it=>it.status==='Concluído'||it.status==='Doado')).length,
    donated:requests.filter(r=>r.items?.some(it=>it.status==='Doado')).length,
  };

  const chegadasNaoLidas=useMemo(()=>{
    try{
      const lidas=JSON.parse(localStorage.getItem('vrz_lidas')||'[]');
      let count=0;
      requests.forEach(req=>{
        (req.items||[]).forEach(it=>{
          if(!it.actualDeliveryDate)return;
          const uid=String(req.os)+'_'+String(it.id||it.description);
          if(!lidas.includes(uid))count++;
        });
      });
      return count;
    }catch{return 0;}
  },[requests]);

  const navItems=[
    isSol&&{key:'request',icon:'plus-circle',label:'Nova Peça'},
    {key:'status',icon:'search',label:'Histórico'},
    {key:'chegadas',icon:'package-check',label:'Chegadas',badge:chegadasNaoLidas},
    canDo(role,'donor')&&{key:'donor',icon:'git-merge',label:'Doações'},
    canDo(role,'manage')&&{key:'admin',icon:'settings',label:'Gestão'},
    (isMaster||isAdmin)&&{key:'dashboard',icon:'bar-chart-2',label:'Análises'},
  ].filter(Boolean);

  const loading=reqLoad||vehLoad||usrLoad;

  // ── Return condicional APÓS todos os hooks ────────────────────────────────
  if(!loggedIn)return <LoginView onLogin={login} usersList={users}/>;

  return(
    <div style={{height:'100vh',display:'flex',flexDirection:'row',background:'#FAFAF9',overflow:'hidden'}}>
      <NetworkStatus/>

      {/* MELHORIA 2: Modal de alterar senha */}
      {showChangePwd&&<ChangePasswordModal loggedInUser={loggedIn} onClose={()=>setShowChangePwd(false)}/>}

      {/* Desktop Sidebar */}
      <nav style={{display:'none',width:220,background:'#0D0D0D',padding:'20px 14px',flexDirection:'column',gap:4,flexShrink:0}} id="desktop-nav">
        <style>{`@media(min-width:768px){#desktop-nav{display:flex!important}}`}</style>
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'6px 6px 20px',borderBottom:'1px solid rgba(255,255,255,.08)',marginBottom:8}}>
          <div style={{width:36,height:36,background:'var(--red)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,boxShadow:'0 4px 12px rgba(220,31,31,.3)'}}><Icon name="shopping-cart" size={18}/></div>
          <div><p style={{fontSize:7,fontWeight:700,textTransform:'uppercase',letterSpacing:'.14em',color:'rgba(255,255,255,.3)',margin:0,lineHeight:1}}>Portal Compras</p><h1 style={{fontSize:20,fontWeight:800,margin:0,lineHeight:1.1,color:'#fff'}}>VRZ</h1></div>
        </div>
        <div style={{flex:1,display:'flex',flexDirection:'column',gap:2}}>
          {navItems.map(n=>(
            <button key={n.key} onClick={()=>setView(n.key)} className={`nav-item ${view===n.key?'active':''}`}>
              <div className="nav-icon" style={{position:'relative'}}>
                <Icon name={n.icon} size={15}/>
                {n.badge>0&&<span style={{position:'absolute',top:-4,right:-4,background:'var(--red)',color:'#fff',borderRadius:999,fontSize:7,fontWeight:800,minWidth:14,height:14,display:'flex',alignItems:'center',justifyContent:'center',padding:'0 3px',border:'1.5px solid #0D0D0D'}}>{n.badge>99?'99+':n.badge}</span>}
              </div>
              {n.label}
              {n.badge>0&&view!==n.key&&<span style={{marginLeft:'auto',background:'var(--red)',color:'#fff',borderRadius:999,fontSize:8,fontWeight:800,padding:'2px 7px'}}>{n.badge>99?'99+':n.badge}</span>}
            </button>
          ))}
        </div>
        <div style={{background:'rgba(255,255,255,.06)',borderRadius:12,padding:12,border:'1px solid rgba(255,255,255,.1)'}}>
          <p style={{fontSize:7,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'rgba(255,255,255,.3)',margin:'0 0 4px'}}>Logado como</p>
          <p style={{fontSize:11,fontWeight:800,textTransform:'uppercase',color:role==='master'?'#FFD700':'var(--red)',margin:'0 0 6px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{loggedIn.user}</p>
          <div style={{marginBottom:10,display:'flex',alignItems:'center',gap:6}}>
            <RoleBadge role={loggedIn.role}/>
          </div>
          {/* MELHORIA 2: botão alterar senha */}
          <button onClick={()=>setShowChangePwd(true)} style={{width:'100%',padding:'6px 0',marginBottom:8,background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.1)',borderRadius:8,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer',color:'rgba(255,255,255,.5)',transition:'all .15s',fontFamily:'Plus Jakarta Sans,sans-serif',display:'flex',alignItems:'center',justifyContent:'center',gap:6}} onMouseEnter={e=>{e.currentTarget.style.background='rgba(255,255,255,.14)';e.currentTarget.style.color='#fff';}} onMouseLeave={e=>{e.currentTarget.style.background='rgba(255,255,255,.06)';e.currentTarget.style.color='rgba(255,255,255,.5)';}}>
            <Icon name="key" size={12}/> Alterar Senha
          </button>
          <button onClick={logout} style={{width:'100%',padding:7,background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.12)',borderRadius:8,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer',color:'rgba(255,255,255,.5)',transition:'all .15s',fontFamily:'Plus Jakarta Sans,sans-serif'}} onMouseEnter={e=>{e.currentTarget.style.background='var(--red)';e.currentTarget.style.color='#fff';e.currentTarget.style.borderColor='var(--red)';}} onMouseLeave={e=>{e.currentTarget.style.background='rgba(255,255,255,.08)';e.currentTarget.style.color='rgba(255,255,255,.5)';e.currentTarget.style.borderColor='rgba(255,255,255,.12)';}}>Sair</button>
        </div>
        <div style={{textAlign:'center',paddingTop:6}}>
          <span style={{fontSize:8,fontWeight:700,color:user?'var(--red)':'rgba(255,255,255,.25)',display:'flex',alignItems:'center',justifyContent:'center',gap:5}}>
            <span className="pulse-beacon" style={{width:6,height:6,borderRadius:'50%',background:user?'var(--red)':'var(--muted)',display:'inline-block'}}/>{user?'ONLINE':'RECONECTANDO...'}
          </span>
        </div>
      </nav>

      {/* Mobile Header */}
      <div id="mobile-header"><style>{`@media(min-width:768px){#mobile-header{display:none!important}}`}</style>
        <div style={{position:'fixed',top:0,left:0,right:0,zIndex:100,background:'#fff',borderBottom:'1px solid var(--border)',padding:'10px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',boxShadow:'0 2px 16px rgba(0,0,0,.06)'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:32,height:32,background:'var(--red)',borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="shopping-cart" size={15}/></div>
            <h1 style={{fontSize:20,fontWeight:800,margin:0}}>VRZ</h1>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div style={{textAlign:'right'}}><p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',color:role==='master'?'#856A00':'var(--red)',margin:0,maxWidth:100,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{loggedIn.user}</p><RoleBadge role={loggedIn.role}/></div>
            {/* MELHORIA 2: botão alterar senha no mobile */}
            <button onClick={()=>setShowChangePwd(true)} style={{width:34,height:34,background:'var(--smoke)',border:'1px solid var(--border)',borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}><Icon name="key" size={15}/></button>
            <button onClick={logout} style={{width:34,height:34,background:'var(--smoke)',border:'1px solid var(--border)',borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}><Icon name="log-out" size={15}/></button>
          </div>
        </div>
      </div>

      {/* Main */}
      <main style={{flex:1,overflowY:'auto',minWidth:0}} className="scroll-y">
        <div style={{padding:16,paddingTop:0}} id="main-pad">
          <style>{`@media(min-width:768px){#main-pad{padding:28px!important}}@media(max-width:767px){#main-pad{padding-top:64px!important;padding-bottom:80px!important}}`}</style>
          <div style={{maxWidth:1100,margin:'0 auto'}}>
            {loading?<Skeleton/>:(
              <>
                {view==='dashboard'&&(isMaster||isAdmin)&&<DashboardView requests={requests}/>}
                {view==='request'&&isSol&&<RequestForm user={user} loggedInUser={loggedIn} vehiclesDB={vehicles} requests={requests}/>}
                {view==='status'&&<StatusView requests={requests} loggedInUser={loggedIn} vehicles={vehicles}/>}
                {view==='chegadas'&&<ChegadasView requests={requests} loggedInUser={loggedIn} vehicles={vehicles}/>}
                {view==='donor'&&canDo(role,'donor')&&<DonorSystem requests={requests} vehicles={vehicles} loggedInUser={loggedIn}/>}
                {view==='admin'&&canDo(role,'manage')&&(
                  <div className="fade-up" style={{paddingBottom:40}}>
                    <div style={{marginBottom:16}}>
                      <p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.15em',color:'var(--red)',marginBottom:4}}>Administração</p>
                      <h2 style={{fontSize:32,fontWeight:800,margin:'0 0 16px',letterSpacing:'-.02em'}}>Gestão de Compras</h2>
                    </div>
                    <div style={{display:'flex',justifyContent:'flex-end',marginBottom:16}}>
                      <button onClick={()=>setShowImport(true)} style={{display:'flex',alignItems:'center',gap:8,padding:'10px 18px',background:'var(--ink)',color:'#fff',border:'none',borderRadius:10,fontSize:10,fontWeight:800,textTransform:'uppercase',cursor:'pointer',letterSpacing:'.08em',borderBottom:'3px solid var(--red)'}}>
                        <Icon name="file-up" size={14}/> Importar Planilha
                      </button>
                    </div>
                    <div style={{display:'flex',gap:4,background:'var(--smoke)',padding:4,borderRadius:12,border:'1px solid var(--border)',overflowX:'auto',marginBottom:20}}>
                      {[
                        {key:'pending',label:`Pendentes (${tabCounts.pending})`,color:'#C45E00'},
                        {key:'quoting',label:`Em Cotação (${tabCounts.quoting})`,color:'#1A4EC2'},
                        {key:'bought',label:`Comprado (${tabCounts.bought})`,color:'#6B21A8'},
                        {key:'completed',label:`Concluídos (${tabCounts.completed})`,color:'#0A6B34'},
                        {key:'donated',label:`Doados (${tabCounts.donated})`,color:'#A81515'},
                        {key:'vehicles',label:`Veículos (${vehicles.length})`,color:'var(--ink)'},
                        isMaster&&{key:'users',label:'Usuários',color:'var(--red)'},
                        isMaster&&{key:'storage',label:'Capacidade',color:'#7C3AED'},
                      ].filter(Boolean).map(t=>(
                        <button key={t.key} onClick={()=>setSubView(t.key)} style={{padding:'8px 14px',borderRadius:9,fontSize:9,fontWeight:800,textTransform:'uppercase',whiteSpace:'nowrap',border:'none',cursor:'pointer',letterSpacing:'.06em',transition:'all .15s',background:subView===t.key?'#fff':'transparent',color:subView===t.key?t.color:'var(--muted)',boxShadow:subView===t.key?'0 2px 8px rgba(0,0,0,.08)':'none',fontFamily:'Plus Jakarta Sans,sans-serif'}}>
                          {t.label}
                        </button>
                      ))}
                    </div>

                    {subView==='users'&&isMaster&&<UserManagement users={users} onAdd={addUser} onDelete={deleteUser} onToggle={toggleUser} onRole={changeRole} loggedInUser={loggedIn}/>}
                    {subView==='storage'&&isMaster&&<StorageView requests={requests}/>}
                    {subView==='vehicles'&&(
                      <div className="card" style={{overflow:'hidden'}}>
                        <div style={{overflowX:'auto',maxHeight:'60vh'}} className="scroll-y">
                          <table className="vtable w-full" style={{minWidth:900}}>
                            <thead style={{position:'sticky',top:0}}><tr>{['OS','Modelo','Fabricante','Cor','Chassi','Etapa','Localização'].map(h=><th key={h}>{h}</th>)}</tr></thead>
                            <tbody>
                              {vehicles.length===0?<tr><td colSpan="7" style={{padding:40,textAlign:'center',fontSize:10,fontWeight:700,textTransform:'uppercase',color:'var(--muted)'}}>Nenhum veículo cadastrado</td></tr>:vehicles.map((v,i)=>(
                                <tr key={i}>
                                  <td style={{fontWeight:800,fontSize:13}}>#{v.os}</td><td style={{fontWeight:600,textTransform:'uppercase'}}>{v.modelo}</td><td style={{textTransform:'uppercase'}}>{v.fabricante}</td><td style={{textTransform:'uppercase'}}>{v.cor}</td>
                                  <td className="mono" style={{fontSize:10,fontWeight:700}}>{v.chassi}</td>
                                  <td><span className="badge badge-pending">{v.etapa}</span></td><td style={{textTransform:'uppercase'}}>{v.localizacao}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}

                    {['pending','quoting','bought','completed','donated'].includes(subView)&&(()=>{
                      const merged=mergeByOS(requests);
                      const filtered=merged.filter(req=>{
                        if(subView==='pending')return req.items?.some(it=>it.status==='Pendente');
                        if(subView==='quoting')return req.items?.some(it=>it.status==='Em Cotação');
                        if(subView==='bought')return req.items?.some(it=>it.status==='Comprado');
                        if(subView==='donated')return req.items?.some(it=>it.status==='Doado');
                        return req.items?.every(it=>it.status==='Concluído'||it.status==='Doado');
                      });
                      const accentCol=subView==='pending'?'#C45E00':subView==='quoting'?'#1A4EC2':subView==='bought'?'#6B21A8':subView==='donated'?'#A81515':'#0A6B34';
                      return(
                        <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:12}}>
                          {filtered.length===0&&<div style={{padding:'48px 20px',textAlign:'center',background:'#fff',borderRadius:14,border:'1.5px dashed var(--border)'}}><p style={{fontSize:9,fontWeight:800,textTransform:'uppercase',color:'var(--muted)',margin:0}}>Nenhum pedido nesta categoria</p></div>}
                          {filtered.map(req=>(
                            <div key={req.os} className="card" style={{display:'flex',alignItems:'center',gap:16,padding:'14px 16px',borderLeft:`3px solid ${accentCol}`}}>
                              <div style={{textAlign:'center',flexShrink:0}}>
                                <p style={{fontSize:7,fontWeight:700,textTransform:'uppercase',color:'var(--muted)',margin:0}}>OS</p>
                                <p style={{fontSize:16,fontWeight:800,margin:0}}>#{req.os}</p>
                                <p style={{fontSize:8,color:'var(--muted)',fontWeight:600,margin:0}}>{req.unidade||'Unidade 1'}</p>
                                {req._merged&&<span style={{fontSize:7,fontWeight:800,padding:'1px 5px',borderRadius:999,background:'#EAF0FF',color:'#1A4EC2',border:'1px solid #C0D0F5',display:'inline-block',marginTop:3}}>Mesclado</span>}
                              </div>
                              <div style={{flex:1,minWidth:0}}>
                                <p style={{fontSize:7,fontWeight:700,textTransform:'uppercase',color:'var(--muted)',margin:'0 0 6px'}}>Itens ({req.items?.length||0}) · {req.vehicleData?.modelo||'—'}</p>
                                <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                                  {req.items?.map((it,i)=>(
                                    <span key={i} style={{display:'inline-flex',flexDirection:'column',gap:2,background:it.status==='Concluído'?'#0A6B3410':it.status==='Doado'?'#FFF0F0':it.status==='Comprado'?'#F3E8FF':it.status==='Em Cotação'?'#EAF0FF':'#FFF4E6',border:`1px solid ${it.status==='Concluído'?'#AAE6C5':it.status==='Doado'?'#FFBDBD':it.status==='Comprado'?'#D8B4FE':it.status==='Em Cotação'?'#C0D0F5':'#FFD9A8'}`,borderRadius:7,padding:'4px 8px',fontSize:9,fontWeight:700,textTransform:'uppercase',color:it.status==='Concluído'?'#0A6B34':it.status==='Doado'?'var(--red)':it.status==='Comprado'?'#6B21A8':it.status==='Em Cotação'?'#1A4EC2':'#C45E00'}}>
                                      <span>{it.description}</span>
                                      {it.receivedFrom&&<span style={{fontSize:7,fontWeight:700,opacity:.8}}>← OS #{it.receivedFrom}</span>}
                                      {it.donatedTo&&!it.receivedFrom&&<span style={{fontSize:7,fontWeight:700,opacity:.8}}>→ OS #{it.donatedTo}</span>}
                                    </span>
                                  ))}
                                </div>
                              </div>
                              <button onClick={()=>setEditing(req)} style={{display:'flex',alignItems:'center',gap:6,padding:'9px 16px',background:'var(--ink)',color:'#fff',border:'none',borderBottom:'3px solid var(--red)',borderRadius:10,fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer',flexShrink:0,fontFamily:'Plus Jakarta Sans,sans-serif'}}>
                                <Icon name="edit-2" size={13}/> Gerenciar
                              </button>
                            </div>
                          ))}
                        </div>
                      );
                    })()}
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      </main>

      {/* Mobile Bottom Nav */}
      <div id="mobile-bottom"><style>{`@media(min-width:768px){#mobile-bottom{display:none!important}}`}</style>
        <div className="bottom-nav">
          {navItems.map(n=>(
            <button key={n.key} onClick={()=>setView(n.key)} className={`bottom-nav-btn ${view===n.key?'active':''}`}>
              <div style={{position:'relative',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <Icon name={n.icon} size={21}/>
                {n.badge>0&&<span style={{position:'absolute',top:-5,right:-7,background:'var(--red)',color:'#fff',borderRadius:999,fontSize:7,fontWeight:800,minWidth:14,height:14,display:'flex',alignItems:'center',justifyContent:'center',padding:'0 3px',border:'2px solid #fff'}}>{n.badge>99?'99+':n.badge}</span>}
              </div>
              <span>{n.label}</span>
            </button>
          ))}
        </div>
      </div>

      {/* Import Modal */}
      {showImport&&canDo(role,'manage')&&(
        <div style={{position:'fixed',inset:0,zIndex:300,background:'rgba(0,0,0,.9)',display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
          <div style={{background:'#fff',width:'100%',maxWidth:1000,height:'82vh',borderRadius:24,overflow:'hidden',boxShadow:'0 40px 80px rgba(0,0,0,.5)',display:'flex',flexDirection:'column'}}>
            <div style={{padding:'20px 28px',background:'var(--ink)',display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:'4px solid var(--red)',flexShrink:0}}>
              <div><h3 style={{margin:0,fontSize:20,fontWeight:800,color:'#fff'}}>Importar Planilha</h3><p style={{margin:0,fontSize:9,color:'rgba(255,255,255,.35)',textTransform:'uppercase',letterSpacing:'.1em',marginTop:2}}>Cole os dados do Excel (Ctrl+V)</p></div>
              <button onClick={()=>{setShowImport(false);setImportData([]);}} style={{width:38,height:38,background:'rgba(255,255,255,.08)',border:'none',borderRadius:10,cursor:'pointer',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="x" size={20}/></button>
            </div>
            <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column',padding:20,gap:16}}>
              {importData.length===0?(
                <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',border:'2px dashed var(--border)',borderRadius:16,background:'var(--smoke)',position:'relative'}}>
                  <Icon name="file-spreadsheet" size={52} style={{color:'var(--border)',marginBottom:12}}/>
                  <p style={{fontSize:12,fontWeight:700,textTransform:'uppercase',color:'var(--muted)',margin:0}}>Pronto para importar</p>
                  <p style={{fontSize:10,color:'var(--muted)',margin:'4px 0 0'}}>Selecione no Excel e CTRL+V</p>
                  <textarea onPaste={handlePaste} style={{position:'absolute',inset:0,opacity:0,cursor:'pointer',resize:'none'}} autoFocus/>
                </div>
              ):(
                <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
                  <div style={{flex:1,overflow:'auto',border:'1px solid var(--border)',borderRadius:12}} className="scroll-y">
                    <table style={{width:'100%',borderCollapse:'collapse',minWidth:900}}>
                      <thead style={{background:'var(--smoke)',position:'sticky',top:0}}>
                        <tr>{['OS','Modelo','Fabricante','Cor','Chassi','Etapa','Localização'].map(h=><th key={h} style={{padding:10,fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)',textAlign:'left',borderBottom:'1px solid var(--border)'}}>{h}</th>)}</tr>
                      </thead>
                      <tbody>
                        {importData.map((row,rIdx)=>(
                          <tr key={rIdx} style={{borderBottom:'1px solid var(--smoke)'}}>
                            {['os','modelo','fabricante','cor','chassi','etapa','localizacao'].map(k=>(
                              <td key={k} style={{border:'none',padding:0,height:36}}><input className="excel-input" value={row[k]} onChange={e=>{const d=[...importData];d[rIdx][k]=sanitize(e.target.value);setImportData(d);}}/></td>
                            ))}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  <div style={{paddingTop:14,display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
                    <p style={{fontSize:10,color:'var(--muted)',fontWeight:600}}>{importData.length} registros</p>
                    <div style={{display:'flex',gap:10}}><button onClick={()=>setImportData([])} className="btn-ghost">Limpar</button><button onClick={commitImport} className="btn-primary" style={{padding:'11px 28px'}}>Sincronizar</button></div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Editing Modal — estado local, salva só ao confirmar */}
      {editing&&(isMaster||isAdmin)&&(
        <EditingModal
          key={editing.id}
          req={editing}
          onClose={()=>setEditing(null)}
          onSave={saveItems}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
